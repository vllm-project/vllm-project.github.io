<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Simplified Omni PPO trainer and OmniModelBase adapter flow</title>
  <desc id="desc">A simplified flowchart showing the main_omni entrypoint, the generic PPO trainer, the FSDP model builder, and the OmniModelBase model adapter.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5fbff"/>
      <stop offset="100%" stop-color="#eaf3ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2c5a9a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a72b5"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, Segoe UI, Arial, sans-serif; fill: #12315a; }
      .subtitle { font: 15px Inter, Segoe UI, Arial, sans-serif; fill: #52677f; }
      .box-title { font: 700 19px Inter, Segoe UI, Arial, sans-serif; fill: #17345a; }
      .box-text { font: 14px Inter, Segoe UI, Arial, sans-serif; fill: #566b85; }
      .label { font: 700 13px Inter, Segoe UI, Arial, sans-serif; letter-spacing: .08em; fill: #66809f; }
      .box { rx: 20; stroke: #bdd1ec; stroke-width: 1.5; filter: url(#shadow); }
      .arrow { fill: none; stroke: #4a72b5; stroke-width: 2.4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>
  <circle cx="1040" cy="70" r="160" fill="#d8edff" opacity=".5"/>
  <circle cx="140" cy="470" r="190" fill="#dbeafe" opacity=".45"/>

  <text x="600" y="58" text-anchor="middle" class="title">Omni PPO x OmniModelBase</text>
  <text x="600" y="86" text-anchor="middle" class="subtitle">PPO owns the training loop; OmniModelBase owns model-specific adaptation.</text>

  <rect x="70" y="150" width="235" height="130" class="box" fill="#ffffff"/>
  <text x="95" y="180" class="label">ENTRYPOINT</text>
  <text x="95" y="212" class="box-title">main_omni.py</text>
  <text x="95" y="240" class="box-text">Route online omni RL</text>
  <text x="95" y="263" class="box-text">into verl PPO V1.</text>

  <rect x="365" y="150" width="235" height="130" class="box" fill="#dff1ff"/>
  <text x="390" y="180" class="label">TRAINER SCOPE</text>
  <text x="390" y="212" class="box-title">PPO Trainer</text>
  <text x="390" y="240" class="box-text">Rollout scheduling,</text>
  <text x="390" y="263" class="box-text">advantages, policy update.</text>

  <rect x="660" y="150" width="235" height="130" class="box" fill="#fff3df"/>
  <text x="685" y="180" class="label">MODEL BUILD</text>
  <text x="685" y="212" class="box-title">FSDP omni engine</text>
  <text x="685" y="240" class="box-text">Load HF model and</text>
  <text x="685" y="263" class="box-text">prepare FSDP wrapping.</text>

  <rect x="955" y="150" width="205" height="130" class="box" fill="#e8faef"/>
  <text x="980" y="180" class="label">ADAPTER SCOPE</text>
  <text x="980" y="212" class="box-title">OmniModelBase</text>
  <text x="980" y="240" class="box-text">Resolve adapter by</text>
  <text x="980" y="263" class="box-text">architecture + stage.</text>

  <path d="M305 215 H355" class="arrow"/>
  <path d="M600 215 H650" class="arrow"/>
  <path d="M895 215 H945" class="arrow"/>

  <rect x="215" y="350" width="770" height="78" rx="18" fill="#ffffff" stroke="#bdd1ec" stroke-width="1.5"/>
  <text x="600" y="382" text-anchor="middle" class="box-title">Example: Qwen3OmniThinkerAdapter</text>
  <text x="600" y="408" text-anchor="middle" class="box-text">Strip inactive modules, redirect forward to thinker, configure processor and rollout alignment.</text>

  <path d="M1057.5 280 C1057.5 330 600 325 600 342" class="arrow"/>
</svg>
