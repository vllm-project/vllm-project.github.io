  <rect x="55" y="826" width="18" height="14" rx="3" fill="#9aa7ba"/>
  <text x="82" y="838" font-family="Arial,sans-serif" font-size="13" fill="#63718a">FP8 · original dispatch</text>
  <rect x="260" y="826" width="18" height="14" rx="3" fill="#416fd0"/>
  <text x="287" y="838" font-family="Arial,sans-serif" font-size="13" fill="#63718a">FP8 · routed-row dispatch</text>
  <text x="55" y="870" font-family="Arial,sans-serif" font-size="12.5" fill="#63718a">24 samples; median of each sample's slowest rank. Speedup uses unrounded values.</text>
</svg>
