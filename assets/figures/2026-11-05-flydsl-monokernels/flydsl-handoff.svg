<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img">
<title>Hand-off inside one launch: write the data, then raise a flag</title>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#617588"/></marker></defs>
<style>text {font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', Arial, sans-serif; font-size:14px; fill:#25394B;} .title {font-size:17px;font-weight:600;} .subhead {font-size:14.5px;font-weight:600;} .small {font-size:13px;fill:#536577;} .code {font-family: Consolas, 'DejaVu Sans Mono', monospace; font-size:12.5px; fill:#7A4B12;} .on {fill:#FFFFFF;font-weight:600;font-size:13px;}</style>
<rect x="0.5" y="0.5" width="799" height="439" rx="9" fill="#FBFCFE" stroke="#D8E1E8"/>
<text x="24" y="31" class="title" text-anchor="start">Hand-off inside one launch: write the data, then raise a flag</text>
<text x="776" y="31" class="small" text-anchor="end">Schematic time →</text>
<rect x="24" y="50" width="752" height="104" rx="6" fill="#FFFFFF" stroke="#D8E1E8"/>
<text x="40" y="76" class="subhead" text-anchor="start">Block i · stage A</text>
<rect x="48" y="92" width="252" height="40" rx="6" fill="#DFEAF5" stroke="#D8E1E8"/>
<text x="174" y="117" text-anchor="middle">Compute A · token t</text>
