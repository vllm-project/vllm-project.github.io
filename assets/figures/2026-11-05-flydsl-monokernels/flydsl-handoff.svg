<text x="40" y="196" class="subhead" text-anchor="start">HBM</text>
<rect x="300" y="198" width="90" height="34" rx="6" fill="#DFEAF5" stroke="#617588" stroke-dasharray="4 3"/>
<text x="345" y="220" class="small" text-anchor="middle">q · token t</text>
<rect x="412" y="203" width="24" height="24" rx="4" fill="#3E9B6E" stroke="#2F7D58"/>
<text x="424.0" y="220" class="on" text-anchor="middle">✓</text>
<rect x="441" y="203" width="24" height="24" rx="4" fill="#3E9B6E" stroke="#2F7D58"/>
<text x="453.0" y="220" class="on" text-anchor="middle">✓</text>
<rect x="470" y="203" width="24" height="24" rx="4" fill="#3E9B6E" stroke="#2F7D58"/>
<text x="482.0" y="220" class="on" text-anchor="middle">✓</text>
<rect x="499" y="203" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#D8E1E8"/>
<rect x="528" y="203" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#D8E1E8"/>
<rect x="557" y="203" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#D8E1E8"/>
<text x="482.0" y="243" class="small" text-anchor="middle">t</text>
<text x="591" y="212" class="small" text-anchor="start">one flag</text>
<text x="591" y="229" class="small" text-anchor="start">per token</text>
<path d="M345 132 V196" fill="none" stroke="#617588" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M482.0 132 V201" fill="none" stroke="#617588" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="24" y="270" width="752" height="150" rx="6" fill="#FFFFFF" stroke="#D8E1E8"/>
<text x="40" y="296" class="subhead" text-anchor="start">Block j · stage B</text>
