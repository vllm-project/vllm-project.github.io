<text x="180" y="396" class="small" text-anchor="middle">Wait for flag t</text>
<text x="400" y="396" class="code" text-anchor="middle">mailbox.poll</text>
<rect x="530" y="374" width="180" height="34" rx="6" fill="#DDEEE6" stroke="#D8E1E8"/>
<text x="620" y="396" text-anchor="middle">Compute B · token t</text>
<path d="M482.0 249 V300 H620 V372" fill="none" stroke="#617588" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="632" y="296" class="small" text-anchor="start">flag t up</text>
