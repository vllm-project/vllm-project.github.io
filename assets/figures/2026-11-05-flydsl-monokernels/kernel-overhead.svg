<text x="162.0" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#ffffff">Work</text>
<rect x="227" y="132" width="65" height="52" fill="#dde3e9"/>
<text x="259.5" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#35475a">Drain</text>
<path d="M303,158 L330,158" stroke="#657585" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="472" y="114" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#223344">Kernel B</text>
<rect x="342" y="132" width="65" height="52" fill="#f4d8af"/>
<text x="374.5" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#714619">Start</text>
<rect x="407" y="132" width="130" height="52" fill="#285f94"/>
<text x="472.0" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#ffffff">Work</text>
<rect x="537" y="132" width="65" height="52" fill="#dde3e9"/>
<text x="569.5" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#35475a">Drain</text>
<path d="M613,158 L640,158" stroke="#657585" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="782" y="114" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#223344">Kernel C</text>
<rect x="652" y="132" width="65" height="52" fill="#f4d8af"/>
<text x="684.5" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#714619">Start</text>
<rect x="717" y="132" width="130" height="52" fill="#285f94"/>
<text x="782.0" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#ffffff">Work</text>
<rect x="847" y="132" width="65" height="52" fill="#dde3e9"/>
<text x="879.5" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#35475a">Drain</text>
<text x="954" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#223344">…</text>
