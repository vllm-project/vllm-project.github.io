<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="252" viewBox="0 0 1000 252" role="img"><title>Short kernels repeat GPU-side overhead</title>
<rect width="1000" height="252" rx="16" fill="#f6f8fa"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#657585" stroke-width="1.5"/></marker></defs>
<text x="32" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" text-anchor="start" fill="#223344">Short kernels repeat GPU-side overhead</text>
<text x="32" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#526476">A dependent kernel chain within one decode step</text>
<text x="162" y="114" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#223344">Kernel A</text>
