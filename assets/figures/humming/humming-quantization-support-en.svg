<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1164" viewBox="0 0 1400 1164" role="img" aria-labelledby="title desc">
<title id="title">Humming: Quantization Support</title>
<desc id="desc">Columns show activation types; rows show weight types. Green checks indicate support; unsupported cells are blank. E0M symmetric integer formats are excluded. INT1: FP16, BF16, INT4, INT8, FP8, FP4; INT2: FP16, BF16, INT4, INT8, FP8, FP4; INT3: FP16, BF16, INT4, INT8, FP8, FP4; INT4: FP16, BF16, INT4, INT8, FP8; INT5: FP16, BF16, INT8, FP8; INT6: FP16, BF16, INT8, FP8; INT7: FP16, BF16, INT8; INT8: FP16, BF16, INT8; FP8: FP16, BF16, FP8; FP7: FP16, BF16, FP8; FP6: FP16, BF16, FP8; FP5: FP16, BF16, FP8; FP4: FP16, BF16, INT8, FP8, FP4</desc>
<!-- Sources: humming/schema/humming.py:is_humming_schema_compatible;
     humming/config/mma.py:get_mma_b_dtype;
     tests/kernels/humming/test_datatype.py; humming/transform.py:prepare_layer_config.
     Aggregate by numeric family across compatible devices and scale configurations.
     E0M symmetric integer formats and conversions to/from them are excluded.
     INT6/FP8 includes E3M4-capable hardware. FP4/INT8 includes MXFP4 (E8M0, group 32).
     Witnesses below are schema-compatible examples, not a claim of runtime testing.
     INT1/FP16: W=uint1, A=float16, scale=bfloat16, group=0.
     INT1/BF16: W=uint1, A=bfloat16, scale=bfloat16, group=0.
     INT1/INT4: W=uint1, A=int4, scale=bfloat16, group=0.
     INT1/INT8: W=uint1, A=int8, scale=bfloat16, group=0.
     INT1/FP8: W=uint1, A=float8e4m3, scale=bfloat16, group=0.
     INT1/FP4: W=uint1, A=float4e2m1, scale=bfloat16, group=0.
     INT2/FP16: W=uint2, A=float16, scale=bfloat16, group=0.
     INT2/BF16: W=uint2, A=bfloat16, scale=bfloat16, group=0.
     INT2/INT4: W=uint2, A=int4, scale=bfloat16, group=0.
     INT2/INT8: W=uint2, A=int8, scale=bfloat16, group=0.
     INT2/FP8: W=uint2, A=float8e4m3, scale=bfloat16, group=0.
     INT2/FP4: W=uint2, A=float4e2m1, scale=bfloat16, group=0.
     INT3/FP16: W=uint3, A=float16, scale=bfloat16, group=0.
     INT3/BF16: W=uint3, A=bfloat16, scale=bfloat16, group=0.
     INT3/INT4: W=uint3, A=int4, scale=bfloat16, group=0.
     INT3/INT8: W=uint3, A=int8, scale=bfloat16, group=0.
     INT3/FP8: W=uint3, A=float8e4m3, scale=bfloat16, group=0.
     INT3/FP4: W=uint3, A=float4e2m1, scale=bfloat16, group=0.
     INT4/FP16: W=uint4, A=float16, scale=bfloat16, group=0.
     INT4/BF16: W=uint4, A=bfloat16, scale=bfloat16, group=0.
     INT4/INT4: W=uint4, A=int4, scale=bfloat16, group=0.
     INT4/INT8: W=uint4, A=int8, scale=bfloat16, group=0.
     INT4/FP8: W=uint4, A=float8e4m3, scale=bfloat16, group=0.
     INT5/FP16: W=uint5, A=float16, scale=bfloat16, group=0.
     INT5/BF16: W=uint5, A=bfloat16, scale=bfloat16, group=0.
     INT5/INT8: W=uint5, A=int8, scale=bfloat16, group=0.
     INT5/FP8: W=uint5, A=float8e4m3, scale=bfloat16, group=0.
     INT6/FP16: W=uint6, A=float16, scale=bfloat16, group=0.
     INT6/BF16: W=uint6, A=bfloat16, scale=bfloat16, group=0.
     INT6/INT8: W=uint6, A=int8, scale=bfloat16, group=0.
     INT6/FP8: W=uint6, A=float8e4m3, scale=bfloat16, group=0.
     INT7/FP16: W=uint7, A=float16, scale=bfloat16, group=0.
     INT7/BF16: W=uint7, A=bfloat16, scale=bfloat16, group=0.
     INT7/INT8: W=uint7, A=int8, scale=bfloat16, group=0.
     INT8/FP16: W=uint8, A=float16, scale=bfloat16, group=0.
     INT8/BF16: W=uint8, A=bfloat16, scale=bfloat16, group=0.
     INT8/INT8: W=uint8, A=int8, scale=bfloat16, group=0.
     FP8/FP16: W=float8e1m6, A=float16, scale=bfloat16, group=0.
     FP8/BF16: W=float8e1m6, A=bfloat16, scale=bfloat16, group=0.
     FP8/FP8: W=float8e4m3, A=float8e4m3, scale=bfloat16, group=0.
     FP7/FP16: W=float7e2m4, A=float16, scale=bfloat16, group=0.
     FP7/BF16: W=float7e2m4, A=bfloat16, scale=bfloat16, group=0.
     FP7/FP8: W=float7e2m4, A=float8e4m3, scale=bfloat16, group=0.
     FP6/FP16: W=float6e2m3, A=float16, scale=bfloat16, group=0.
     FP6/BF16: W=float6e2m3, A=bfloat16, scale=bfloat16, group=0.
     FP6/FP8: W=float6e2m3, A=float8e4m3, scale=bfloat16, group=0.
     FP5/FP16: W=float5e2m2, A=float16, scale=bfloat16, group=0.
     FP5/BF16: W=float5e2m2, A=bfloat16, scale=bfloat16, group=0.
     FP5/FP8: W=float5e2m2, A=float8e4m3, scale=bfloat16, group=0.
     FP4/FP16: W=float4e2m1, A=float16, scale=bfloat16, group=0.
     FP4/BF16: W=float4e2m1, A=bfloat16, scale=bfloat16, group=0.
     FP4/INT8: W=float4e2m1, A=int8, scale=float8e8m0, group=32.
     FP4/FP8: W=float4e2m1, A=float8e4m3, scale=bfloat16, group=0.
     FP4/FP4: W=float4e2m1, A=float4e2m1, scale=bfloat16, group=0.
