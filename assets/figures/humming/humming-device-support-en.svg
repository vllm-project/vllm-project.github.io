<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1164" viewBox="0 0 1400 1164" role="img" aria-labelledby="title desc">
<title id="title">Humming: Device Support</title>
<desc id="desc">Columns show activation types; rows show device architectures. Checks indicate support; unsupported cells are blank. SM75 (Turing): FP16, INT8, INT4; SM80 (Ampere): FP16, BF16, INT8, INT4; SM86 (Ampere): FP16, BF16, INT8, INT4; SM87 (Ampere): FP16, BF16, INT8, INT4; SM89 (Ada Lovelace): FP16, BF16, INT8, INT4, FP8; SM90 (Hopper): FP16, BF16, INT8, FP8; SM100 (Blackwell): FP16, BF16, INT8, FP8, FP4; SM103 (Blackwell): FP16, BF16, FP8, FP4; SM107 (Rubin): FP16, BF16, FP8, FP4; SM110 (Blackwell): FP16, BF16, INT8, FP8, FP4; SM120 (Blackwell): FP16, BF16, INT8, FP8, FP4; SM121 (Blackwell): FP16, BF16, INT8, FP8, FP4; T-Head PPU: FP16, BF16, INT8. Example devices: SM75: T4 · RTX 2080 Ti; SM80: A100 · CMP 170HX; SM86: A10 · RTX 3090; SM87: Jetson AGX Orin; SM89: L40S · RTX 4090; SM90: H200 · H20; SM100: B200 · GB200; SM103: B300 · GB300; SM107: Vera Rubin NVL72; SM110: Jetson AGX Thor; SM120: RTX 5090 · RTX PRO 6000; SM121: GB10 (DGX Spark); T-Head PPU: Zhenwu 810E</desc>
<!-- Source: device/activation support list supplied by the project maintainer.
     Example device sources:
     https://github.com/Consensus-Protocol/cmp170hx/blob/main/docs/hardware/overview.md
     https://docs.nvidia.com/jetson/agx-thor-devkit/user-guide/latest/
     https://developer.nvidia.com/cuda/gpus
     https://docs.nvidia.com/cutlass/latest/overview.html (Rubin SM107)
     https://www.nvidia.com/en-us/data-center/vera-rubin-nvl72/
     Columns use the same order as humming-quantization-support.svg.
     This is Humming support, not a list of all instructions available on the hardware. -->
