<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Humming — Fast, flexible kernels for quantized inference</title>
<desc id="desc">An open-source library from Ant Group and the vLLM community. Broad GPU and quantization support for dense and MoE workloads. Up to 43% higher end-to-end throughput on H20 with TP8 for DeepSeek-V4.1-Flash, comparing Humming W4A8 with Marlin W4A16 at concurrency 64. Supports NVIDIA architectures from Turing (SM75) onward and Zhenwu 810E. Approximately 500 KB wheel.</desc>
