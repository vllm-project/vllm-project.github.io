<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Model Runner V2 selection oracle</title>
  <desc id="desc">VLLM_USE_V2_MODEL_RUNNER can explicitly select MRV1 or MRV2, or automatically choose using known compatibility constraints.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .title { font-size: 43px; font-weight: 800; letter-spacing: -0.8px; }
      .branch { font-size: 24px; font-weight: 800; }
      .box-title { font-size: 22px; font-weight: 750; }
      .small { font-size: 18px; fill: #64748b; }
      .result { font-size: 25px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1400" height="820" rx="30" fill="#f8fafc"/>
  <text x="700" y="68" text-anchor="middle" class="title">How vLLM Selects a Model Runner</text>

  <g filter="url(#shadow)">
    <rect x="430" y="115" width="540" height="76" rx="20" fill="#fff" stroke="#c7d2fe" stroke-width="3"/>
    <text x="700" y="162" text-anchor="middle" class="box-title">VLLM_USE_V2_MODEL_RUNNER</text>
  </g>

  <path d="M570 192 C500 225, 320 220, 260 266" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M700 192 V266" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M830 192 C900 225, 1080 220, 1140 266" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="260" y="242" text-anchor="middle" class="branch">= 0</text>
  <text x="700" y="242" text-anchor="middle" class="branch">unset</text>
  <text x="1140" y="242" text-anchor="middle" class="branch">= 1</text>

  <g filter="url(#shadow)">
    <rect x="95" y="280" width="330" height="100" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="260" y="325" text-anchor="middle" class="box-title">Select MRV1</text>
    <text x="260" y="357" text-anchor="middle" class="small">where supported</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="510" y="280" width="380" height="100" rx="22" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/>
    <text x="700" y="325" text-anchor="middle" class="box-title">Check Known Constraints</text>
    <text x="700" y="357" text-anchor="middle" class="small">model · features · backend</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="975" y="280" width="330" height="100" rx="22" fill="#fff" stroke="#c7d2fe" stroke-width="3"/>
    <text x="1140" y="325" text-anchor="middle" class="box-title">Select MRV2</text>
    <text x="1140" y="357" text-anchor="middle" class="small">validate known constraints</text>
  </g>

  <path d="M260 380 V485" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M625 380 C590 425, 510 440, 480 485" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M775 380 C810 425, 890 440, 920 485" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1070 380 C1010 420, 970 440, 940 485" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1210 380 V485" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="490" y="443" class="small" style="fill:#b91c1c;font-weight:700">known blocker</text>
  <text x="810" y="443" class="small" style="fill:#15803d;font-weight:700">no known blocker</text>

  <g filter="url(#shadow)">
    <rect x="110" y="500" width="420" height="105" rx="22" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
    <text x="320" y="543" text-anchor="middle" class="result">MRV1</text>
    <text x="320" y="577" text-anchor="middle" class="small">Explicit choice or warned fallback</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="680" y="500" width="420" height="105" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <text x="890" y="543" text-anchor="middle" class="result" style="fill:#15803d">MRV2</text>
    <text x="890" y="577" text-anchor="middle" class="small">No known blocker</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1145" y="500" width="185" height="105" rx="22" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <text x="1237" y="543" text-anchor="middle" class="result" style="fill:#b91c1c">Error</text>
    <text x="1237" y="577" text-anchor="middle" class="small">Known blocker</text>
  </g>
</svg>
