<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Model Runner V2 selection oracle</title>
  <desc id="desc">The VLLM_USE_V2_MODEL_RUNNER environment variable can force Model Runner V1, select automatically, or force and validate Model Runner V2.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .title { font-size: 43px; font-weight: 800; letter-spacing: -0.8px; }
      .subtitle { font-size: 21px; fill: #64748b; }
      .branch { font-size: 24px; font-weight: 800; }
      .box-title { font-size: 22px; font-weight: 750; }
      .copy { font-size: 18px; fill: #475569; }
      .small { font-size: 16px; fill: #64748b; }
      .result { font-size: 25px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1400" height="820" rx="30" fill="#f8fafc"/>
  <text x="700" y="70" text-anchor="middle" class="title">A Capability-Aware, Reversible Selection Oracle</text>
  <text x="700" y="108" text-anchor="middle" class="subtitle">Known blockers remain explicit while the default boundary advances</text>

  <g filter="url(#shadow)">
    <rect x="430" y="150" width="540" height="92" rx="20" fill="#fff" stroke="#c7d2fe" stroke-width="3"/>
    <text x="700" y="190" text-anchor="middle" class="box-title">Read VLLM_USE_V2_MODEL_RUNNER</text>
    <text x="700" y="219" text-anchor="middle" class="copy">Explicit override or automatic capability selection</text>
  </g>

  <path d="M570 243 C500 280, 320 275, 260 326" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M700 243 V326" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M830 243 C900 280, 1080 275, 1140 326" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="260" y="302" text-anchor="middle" class="branch">= 0</text>
  <text x="700" y="302" text-anchor="middle" class="branch">unset</text>
  <text x="1140" y="302" text-anchor="middle" class="branch">= 1</text>

  <g filter="url(#shadow)">
    <rect x="95" y="340" width="330" height="130" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="260" y="392" text-anchor="middle" class="box-title">Force MRV1</text>
    <text x="260" y="425" text-anchor="middle" class="copy">Compatibility and debugging</text>
    <text x="260" y="452" text-anchor="middle" class="small">V1-only validation still applies</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="510" y="340" width="380" height="160" rx="22" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/>
    <text x="700" y="385" text-anchor="middle" class="box-title" style="font-size:19px">Check Known Compatibility Constraints</text>
    <text x="700" y="419" text-anchor="middle" class="copy">Triton and platform support</text>
    <text x="700" y="448" text-anchor="middle" class="copy">Requested model and features</text>
    <text x="700" y="477" text-anchor="middle" class="copy">Known backend exceptions</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="975" y="340" width="330" height="130" rx="22" fill="#fff" stroke="#c7d2fe" stroke-width="3"/>
    <text x="1140" y="392" text-anchor="middle" class="box-title" style="font-size:19px">Explicitly Select + Validate MRV2</text>
    <text x="1140" y="425" text-anchor="middle" class="copy">Run V2 when no blocker is known</text>
    <text x="1140" y="452" text-anchor="middle" class="small">Raise for a known incompatibility</text>
  </g>

  <path d="M260 470 V590" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M625 501 C590 545, 510 550, 480 590" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M775 501 C810 545, 890 550, 920 590" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1070 470 C1010 520, 970 530, 940 590" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1210 470 V590" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="500" y="552" class="small" style="fill:#b91c1c;font-weight:700">known blocker</text>
  <text x="810" y="552" class="small" style="fill:#15803d;font-weight:700">no known blocker</text>

  <g filter="url(#shadow)">
    <rect x="110" y="605" width="420" height="105" rx="22" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
    <text x="320" y="646" text-anchor="middle" class="result">MRV1</text>
    <text x="320" y="676" text-anchor="middle" class="small">Forced explicitly, or selected</text>
    <text x="320" y="699" text-anchor="middle" class="small">automatically with a warning</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="680" y="605" width="420" height="105" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <text x="890" y="652" text-anchor="middle" class="result" style="fill:#15803d">MRV2</text>
    <text x="890" y="683" text-anchor="middle" class="copy">The normal path when no blocker is known</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1145" y="605" width="185" height="105" rx="22" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <text x="1237" y="652" text-anchor="middle" class="result" style="fill:#b91c1c">Error</text>
    <text x="1237" y="683" text-anchor="middle" class="small">Fail loudly</text>
  </g>

  <rect x="350" y="755" width="700" height="42" rx="21" fill="#e2e8f0"/>
  <text x="700" y="783" text-anchor="middle" class="copy" style="font-weight:700">Known unsupported configurations fall back or fail loudly</text>
</svg>
