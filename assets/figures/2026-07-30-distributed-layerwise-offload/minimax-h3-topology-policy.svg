    <text x="837" y="577" class="callout-value">−4.1% throughput · peak 20.03→94.03 GiB</text>
    <text x="76" y="600" class="footnote">Negative P50 change is favorable. The DP8 result is why rank-local DLO, not AllGather, is selected for the high-throughput route.</text>
