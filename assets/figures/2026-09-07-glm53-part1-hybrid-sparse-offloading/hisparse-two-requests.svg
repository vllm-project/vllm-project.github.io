<line x1="918.5" y1="314" x2="918.5" y2="336" class="arrow" marker-end="url(#arr)"/>
<line x1="942.5" y1="314" x2="942.5" y2="336" class="arrow" marker-end="url(#arr)"/>
<line x1="990.5" y1="314" x2="990.5" y2="336" class="arrow" marker-end="url(#arr)"/>
