<rect x="994" y="343" width="5" height="16" rx="2" class="hot"/>
<rect x="1004" y="340" width="21" height="22" rx="4" class="reqB"/>
<text x="1014.5" y="355.0" class="cell-label" text-anchor="middle">B</text>
