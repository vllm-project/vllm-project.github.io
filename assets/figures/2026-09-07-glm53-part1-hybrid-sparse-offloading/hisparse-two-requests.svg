<rect x="1172" y="290" width="21" height="22" rx="4" class="reqA"/>
<text x="900" y="355" class="row-label" text-anchor="end">re-lease</text>
<rect x="908" y="340" width="21" height="22" rx="4" class="reqA"/>
<text x="918.5" y="355.0" class="cell-label" text-anchor="middle">+1</text>
<rect x="932" y="340" width="21" height="22" rx="4" class="reqB"/>
<text x="942.5" y="355.0" class="cell-label" text-anchor="middle">+1</text>
<rect x="956" y="340" width="21" height="22" rx="4" class="reqA"/>
<text x="966.5" y="355.0" class="cell-label" text-anchor="middle">A</text>
<rect x="980" y="340" width="21" height="22" rx="4" class="hot-outline"/>
<rect x="982" y="343" width="5" height="16" rx="2" class="hot"/>
