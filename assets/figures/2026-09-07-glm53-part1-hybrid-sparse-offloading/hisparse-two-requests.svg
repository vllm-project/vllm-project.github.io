<text x="990.5" y="378" class="band-label" text-anchor="middle">hot</text>
<text x="1038.5" y="378" class="band-label" text-anchor="middle">hot</text>
<text x="856" y="386" class="band-label" text-anchor="start">GPU · same pool</text>
<text x="844" y="410" class="note" text-anchor="start">Same slots: freed in place, re-leased in place</text>
<text x="844" y="426" class="note" text-anchor="start">as new tails and hot pages — no shuffling.</text>
<rect x="844" y="438" width="356" height="54" rx="8" class="pool-host"/>
<text x="888" y="463" class="req-label" text-anchor="end">A</text>
<rect x="896" y="448" width="33" height="22" rx="4" class="host"/>
<rect x="932" y="448" width="33" height="22" rx="4" class="host"/>
<text x="1014" y="463" class="req-label" text-anchor="end">B</text>
<rect x="1022" y="448" width="33" height="22" rx="4" class="host"/>
<rect x="1058" y="448" width="33" height="22" rx="4" class="host"/>
<text x="856" y="485" class="band-label" text-anchor="start">Pinned host pool (CPU)</text>
<text x="844" y="510" class="panel-desc" text-anchor="start">Both keep decoding; spilled tokens stream</text>
<text x="844" y="526" class="panel-desc" text-anchor="start">back through the hot pages on top-K hits.</text>
</svg>
