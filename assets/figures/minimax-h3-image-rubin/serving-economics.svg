<svg xmlns="http://www.w3.org/2000/svg" width="760" height="599" viewBox="0 0 760 599"><style>text{font-family:Inter,Arial,sans-serif;fill:#23201e}.t-lab,.t-mut,.t-faint{font-size:13px}.t-lab-b,.t-num{font-size:13px;font-weight:600}.t-head{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:500;letter-spacing:.96px;fill:#605b56}.m-rule{stroke:#e6e1da;stroke-width:1.2;fill:none}.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.pt{stroke:#fff;stroke-width:2}.hit{fill:transparent}.kicker{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:500;letter-spacing:.96px;fill:#605b56}.title{font-size:20px;font-weight:600;letter-spacing:-.3px}.sub{font-size:14px;fill:#605b56}.note{font-family:"JetBrains Mono",monospace;font-size:12px;fill:#605b56}.legend{font-size:13px;fill:#605b56}</style><rect width="760" height="599" fill="#fff"/><text x="0" y="20" class="kicker">MINIMAX H3-IMAGE · NATIVE 4K · FOUR GPUS PER SYSTEM</text><text x="0" y="48" class="title">$105.16 per GPU-hour</text><text x="0" y="72" class="sub">At $0.06879/image and 100% billable utilization. Four GPUs per system.</text><path d="M0 96v-9h9 M751 87h9v9 M0 543.6v9h9 M751 552.6h9v-9" fill="none" stroke="#8f8a84" stroke-width="1.2"/><g transform="translate(12,101)"><title >$105.16 per GPU-hour. gross USD / GPU / hour</title><text x="136" y="15" class="t-head">GROSS USD / GPU / HOUR</text><line x1="136" x2="136" y1="39" y2="300" class="m-rule"></line><text x="136" y="322" class="t-faint" text-anchor="middle">0</text><line x1="266" x2="266" y1="39" y2="300" class="m-rule"></line><text x="266" y="322" class="t-faint" text-anchor="middle">30</text><line x1="396" x2="396" y1="39" y2="300" class="m-rule"></line><text x="396" y="322" class="t-faint" text-anchor="middle">60</text><line x1="526" x2="526" y1="39" y2="300" class="m-rule"></line><text x="526" y="322" class="t-faint" text-anchor="middle">90</text><line x1="656" x2="656" y1="39" y2="300" class="m-rule"></line><text x="656" y="322" class="t-faint" text-anchor="middle">120</text><text x="122" y="74" class="t-lab-b" text-anchor="end">Vera Rubin</text><rect x="136" y="54" width="455.69109758240324" height="32" style="fill:#b5873a;stroke:none" data-bar="Vera Rubin" aria-label="Vera Rubin · SP1×DP4 · MXFP8 DiT. gross USD / GPU / hour: 105.16. p50 4.411 s · p95 4.731 s. 6,114.8 images/hour across four GPUs"></rect><text x="600.6910975824032" y="75" class="t-num">$105.16</text><text x="136" y="105" class="t-mut">SP1×DP4 · C8 · MXFP8 DiT · p50 4.411 s</text><text x="122" y="154" class="t-lab-b" text-anchor="end">GB300</text><rect x="136" y="134" width="208.16975984775195" height="32" style="fill:#6a8a5e;stroke:none" data-bar="GB300" aria-label="GB300 · SP4 · FP8 DiT. gross USD / GPU / hour: 48.04. p50 20.320 s · p95 20.423 s. 2,793.4 images/hour across four GPUs"></rect><text x="353.16975984775195" y="155" class="t-num">$48.04</text><text x="136" y="185" class="t-mut">SP4 · C16 · FP8 DiT · p50 20.320 s</text><text x="122" y="234" class="t-lab-b" text-anchor="end">GB200</text><rect x="136" y="214" width="145.56856136747763" height="32" style="fill:#9a958f;stroke:none" data-bar="GB200" aria-label="GB200 · SP4 · FP8 DiT. gross USD / GPU / hour: 33.59. p50 3.433 s · p95 3.461 s. 1,953.4 images/hour across four GPUs"></rect><text x="290.5685613674776" y="235" class="t-num">$33.59</text><text x="136" y="265" class="t-mut">SP4 · C2 · FP8 DiT · p50 3.433 s</text></g><text x="12" y="485.0" class="note">Revenue = measured images/hour × $0.06879 × billable utilization ÷ 4 GPUs, before operating costs. At</text><text x="12" y="502.4" class="note">75% billable utilization, Rubin earns $78.87/GPU/hour gross. Daily capacity is the peak measured</text><text x="12" y="519.8" class="note">hourly rate × 24, not a 24-hour load test. Peak configurations and response times are shown under each</text><text x="12" y="537.2" class="note">bar.</text><line x1="0" x2="18" y1="576.6" y2="576.6" stroke="#b5873a" stroke-width="2"/><text x="26" y="580.6" class="legend">Vera Rubin · MXFP8</text><line x1="168.28125" x2="186.28125" y1="576.6" y2="576.6" stroke="#6a8a5e" stroke-width="2"/><text x="194.28125" y="580.6" class="legend">GB300 · FP8 reference</text><line x1="354.859375" x2="372.859375" y1="576.6" y2="576.6" stroke="#9a958f" stroke-width="2"/><text x="380.859375" y="580.6" class="legend">GB200 · FP8 reference</text></svg>
