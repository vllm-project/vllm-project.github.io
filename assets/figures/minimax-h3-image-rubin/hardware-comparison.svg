<svg xmlns="http://www.w3.org/2000/svg" width="760" height="564" viewBox="0 0 760 564"><style>text{font-family:Inter,Arial,sans-serif;fill:#23201e}.t-lab,.t-mut,.t-faint{font-size:13px}.t-lab-b,.t-num{font-size:13px;font-weight:600}.t-head{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:500;letter-spacing:.96px;fill:#605b56}.m-rule{stroke:#e6e1da;stroke-width:1.2;fill:none}.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.pt{stroke:#fff;stroke-width:2}.hit{fill:transparent}.kicker{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:500;letter-spacing:.96px;fill:#605b56}.title{font-size:20px;font-weight:600;letter-spacing:-.3px}.sub{font-size:14px;fill:#605b56}.note{font-family:"JetBrains Mono",monospace;font-size:12px;fill:#605b56}.legend{font-size:13px;fill:#605b56}</style><rect width="760" height="564" fill="#fff"/><text x="0" y="20" class="kicker">MINIMAX H3-IMAGE · NATIVE 4K · FOUR GPUS PER SYSTEM</text><text x="0" y="48" class="title">Native 4K in 0.866 seconds</text><text x="0" y="72" class="sub">C1 on SP4: 2.21× faster than GB200 and 1.64× faster than GB300.</text><path d="M0 96v-9h9 M751 87h9v9 M0 508.79999999999995v9h9 M751 517.8h9v-9" fill="none" stroke="#8f8a84" stroke-width="1.2"/><g transform="translate(12,101)"><title >Native 4K in 0.866 seconds. median HTTP latency, seconds · lower is better</title><text x="136" y="15" class="t-head">MEDIAN HTTP LATENCY, SECONDS · LOWER IS BETTER</text><line x1="136" x2="136" y1="39" y2="300" class="m-rule"></line><text x="136" y="322" class="t-faint" text-anchor="middle">0</text><line x1="240" x2="240" y1="39" y2="300" class="m-rule"></line><text x="240" y="322" class="t-faint" text-anchor="middle">0.5</text><line x1="344" x2="344" y1="39" y2="300" class="m-rule"></line><text x="344" y="322" class="t-faint" text-anchor="middle">1</text><line x1="448" x2="448" y1="39" y2="300" class="m-rule"></line><text x="448" y="322" class="t-faint" text-anchor="middle">1.5</text><line x1="552" x2="552" y1="39" y2="300" class="m-rule"></line><text x="552" y="322" class="t-faint" text-anchor="middle">2</text><line x1="656" x2="656" y1="39" y2="300" class="m-rule"></line><text x="656" y="322" class="t-faint" text-anchor="middle">2.5</text><text x="122" y="74" class="t-lab-b" text-anchor="end">Vera Rubin</text><rect x="136" y="54" width="180.07528448244557" height="32" style="fill:#b5873a;stroke:none" data-bar="Vera Rubin" aria-label="Vera Rubin · SP4 · MXFP8 DiT. median HTTP latency, seconds · lower is better: 0.866. p50 0.866 s · p95 0.944 s. 3,364.2 images/hour across four GPUs"></rect><text x="325.07528448244557" y="75" class="t-num">0.866 s</text><text x="136" y="105" class="t-mut">SP4 · C1 · MXFP8 DiT</text><text x="122" y="154" class="t-lab-b" text-anchor="end">GB300</text><rect x="136" y="134" width="294.5860288757831" height="32" style="fill:#6a8a5e;stroke:none" data-bar="GB300" aria-label="GB300 · SP4 · MXFP8 DiT. median HTTP latency, seconds · lower is better: 1.416. p50 1.416 s · p95 1.444 s. 2,150.2 images/hour across four GPUs"></rect><text x="439.5860288757831" y="155" class="t-num">1.416 s</text><text x="136" y="185" class="t-mut">SP4 · C1 · MXFP8 DiT</text><text x="122" y="234" class="t-lab-b" text-anchor="end">GB200</text><rect x="136" y="214" width="397.69400454312563" height="32" style="fill:#9a958f;stroke:none" data-bar="GB200" aria-label="GB200 · SP4 · MXFP8 DiT. median HTTP latency, seconds · lower is better: 1.912. p50 1.912 s · p95 1.926 s. 1,666.6 images/hour across four GPUs"></rect><text x="542.6940045431256" y="235" class="t-num">1.912 s</text><text x="136" y="265" class="t-mut">SP4 · C1 · MXFP8 DiT</text></g><text x="12" y="485.0" class="note">All three C1 runs use SP4 and MXFP8 DiT linears. Native 4096×4096; six steps; 160 measured requests</text><text x="12" y="502.4" class="note">per point. HTTP latency includes PNG encoding and the full base64 response.</text><line x1="0" x2="18" y1="541.8" y2="541.8" stroke