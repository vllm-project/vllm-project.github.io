<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H3-Image · texture and detail</title><link rel="stylesheet" href="figkit.css?v=2c6a73b9af93"><link rel="stylesheet" href="resolution-detail.css?v=3d9a6617d8d9"></head>
<body><main class="fig">
<div class="fig-head"><h1 class="fig-title" id="demo-title">Skin &amp; Hair</h1></div>
<div id="scenes" class="scene-choices" role="group" aria-label="Image scenes"></div>
<p id="detail-hint" class="detail-hint"></p>
<div class="pair-controls"><label>Left <select id="left-resolution"><option>1K</option><option>2K</option><option>4K</option></select></label><button type="button" id="swap" aria-label="Swap left and right resolutions">Swap ⇄</button><label>Right <select id="right-resolution"><option>1K</option><option>2K</option><option>4K</option></select></label></div>
<div class="zoom-controls"><label for="zoom">Zoom <output id="zoom-label">1×</output></label><input id="zoom" type="range" min="1" max="8" step="0.25" value="1" aria-label="Synchronized image zoom"><button type="button" id="detail" aria-label="Replay zoom from overview to detail">Replay</button><button type="button" id="reset">Reset</button></div>
<div id="pair-labels" class="pair-labels"><span id="left-label"></span><span id="right-label"></span></div>
<div id="comparison-stage" class="comparison-stage"><div id="outputs"></div><div id="wipe-divider" class="wipe-divider"><button id="wipe-handle" type="button" role="slider" aria-label="Resolution comparison divider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">↔</button></div></div>
<nav class="scene-navigation" aria-label="Browse image scenes"><button type="button" id="previous-scene" aria-label="Previous scene">←</button><span id="scene-position" aria-live="polite"></span><button type="button" id="next-scene"></button></nav>
<p id="status" class="detail-note" role="status" aria-live="polite"></p>
<p class="detail-note">Same measured 4K image on both sides. Lower sizes are resized in the browser, preserving composition and aspect ratio.</p>
<p id="setup" class="detail-note"></p>
<details id="source-details"><summary>Measured originals and prompt</summary><div id="originals" class="original-links"></div><p class="detail-note">Times are three-seed means after warmup. The 1K API output uses a 2K generation canvas before resizing.</p><pre id="prompt" class="detail-prompt"></pre><div id="reference"></div></details>
<p class="detail-links"><a href="resolution-detail-data.json?v=b2ae6e0911ee">Image sources</a></p>
<noscript><p>JavaScript is required for the image comparison. Source images are linked above.</p></noscript>
</main><script src="resolution-detail.js?v=786e55f764ce"></script></body></html>
