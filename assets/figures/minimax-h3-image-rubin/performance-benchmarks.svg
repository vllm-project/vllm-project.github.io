  <g id="text_34">
   <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111111" x="57.451797" y="33.396094" transform="rotate(-0 57.451797 33.396094)">vLLM-Omni on Vera Rubin</text>
  </g>
  <g id="text_35">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="57.451797" y="57.024" transform="rotate(-0 57.451797 57.024)">MiniMax H3-Image · native 4K · six steps · four GPUs per system</text>
  </g>
  <g id="text_36">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="57.451797" y="83.664" transform="rotate(-0 57.451797 83.664)">Image throughput per GPU against response latency. Up and to the left is better. Point labels show concurrency.</text>
  </g>
  <g id="text_37">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(57.451797 467.784)">Rubin: MXFP8 DiT. GB200 / GB300 references: FP8 DiT. C = total in-flight requests; 160 measured requests per point.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(57.451797 482.184)">Throughput is the measured four-GPU total divided by four. Shading marks median latency ≤ 1 s.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(57.451797 496.584)">Latency includes PNG encoding and loopback delivery; throughput also includes client image validation and saving.</text>
  </g>
