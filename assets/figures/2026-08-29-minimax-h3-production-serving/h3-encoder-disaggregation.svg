<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">MiniMax H3 disaggregated text encoder serving flow</title>
  <desc id="desc">A request enters an independently scalable vLLM-native Qwen3-VL encoder stage, crosses a typed conditioning bridge, and feeds a separately parallelized MiniMax H3 diffusion and VAE stage while original media references bypass the encoder output.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f97316"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 27px; font-weight: 750; fill: #0f172a; }
      .subtitle { font-size: 15px; font-weight: 500; fill: #64748b; }
      .stage-title { font-size: 19px; font-weight: 750; fill: #0f172a; }
      .stage-sub { font-size: 13px; font-weight: 600; fill: #64748b; }
      .node-title { font-size: 15px; font-weight: 720; fill: #0f172a; }
      .node-sub { font-size: 12.5px; font-weight: 500; fill: #475569; }
      .badge { font-size: 11.5px; font-weight: 700; fill: #1e3a8a; }
      .arrow-label { font-size: 12px; font-weight: 650; fill: #475569; }
      .foot { font-size: 12px; font-weight: 550; fill: #64748b; }
      .arrow { stroke: #475569; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .arrow-blue { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrowBlue); }
      .arrow-orange { stroke: #f97316; stroke-width: 2.3; fill: none; marker-end: url(#arrowOrange); }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1280" height="620" fill="#ffffff"/>
  <text x="44" y="50" class="title">Disaggregated H3 encoding: scale the one-shot encoder independently</text>
  <text x="44" y="77" class="subtitle">The diffusion stage consumes typed conditioning instead of loading and maintaining a second local Qwen3-VL encoder.</text>

  <!-- Request -->
  <rect x="40" y="214" width="175" height="122" rx="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="127" y="244" text-anchor="middle" class="node-title">/v1/videos request</text>
  <text x="127" y="272" text-anchor="middle" class="node-sub">prompt</text>
  <text x="127" y="294" text-anchor="middle" class="node-sub">optional image / video</text>
  <text x="127" y="316" text-anchor="middle" class="node-sub">optional audio</text>

  <!-- Stage 0 -->
  <rect x="270" y="120" width="355" height="322" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="298" y="152" class="stage-title">Stage 0 · vLLM encoder</text>
  <text x="298" y="176" class="stage-sub">independent queue · devices · replicas · TP</text>

  <rect x="298" y="207" width="132" height="70" rx="11" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="364" y="235" text-anchor="middle" class="node-title">Qwen3-VL</text>
  <text x="364" y="257" text-anchor="middle" class="node-sub">processor</text>

  <rect x="465" y="207" width="132" height="70" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="531" y="235" text-anchor="middle" class="node-title">H3 encoder</text>
  <text x="531" y="257" text-anchor="middle" class="node-sub">vLLM runner · TP</text>
  <path class="arrow-blue" d="M 430 242 L 451 242"/>

  <rect x="345" y="319" width="205" height="78" rx="11" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="447" y="347" text-anchor="middle" class="node-title">Layer-50 conditioning</text>
  <text x="447" y="370" text-anchor="middle" class="node-sub">BF16 hidden states [S, 5120]</text>
  <text x="447" y="390" text-anchor="middle" class="node-sub">+ token-role tags</text>
  <path class="arrow-blue" d="M 531 277 C 531 300, 500 307, 478 319"/>

  <rect x="298" y="405" width="126" height="24" rx="12" fill="#dbeafe"/>
  <text x="361" y="421" text-anchor="middle" class="badge">prefix cache</text>
  <rect x="436" y="405" width="126" height="24" rx="12" fill="#dbeafe"/>
  <text x="499" y="421" text-anchor="middle" class="badge">encoder replicas</text>

  <!-- Bridge -->
  <rect x="670" y="230" width="170" height="108" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="755" y="261" text-anchor="middle" class="node-title">Condition bridge</text>
  <text x="755" y="285" text-anchor="middle" class="node-sub">hidden states + tags</text>
  <text x="755" y="307" text-anchor="middle" class="node-sub">preserve original media</text>
  <text x="755" y="328" text-anchor="middle" class="node-sub">bounded handoff</text>
  <path class="arrow-orange" d="M 550 358 C 615 358, 615 284, 656 284"/>

  <!-- Stage 1 -->
  <rect x="885" y="120" width="355" height="205" rx="18" fill="#ecfdf5" stroke="#4ade80" stroke-width="1.6"/>
  <text x="913" y="152" class="stage-title">Stage 1 · H3 diffusion</text>
  <text x="913" y="176" class="stage-sub">independent USP/DP + VAE groups</text>

  <rect x="913" y="207" width="132" height="76" rx="11" fill="#ffffff" stroke="#34d399" stroke-width="1.4"/>
  <text x="979" y="235" text-anchor="middle" class="node-title">H3 DiT</text>
  <text x="979" y="258" text-anchor="middle" class="node-sub">joint A/V · USP/DP</text>

  <rect x="1080" y="199" width="132" height="92" rx="11" fill="#d1fae5" stroke="#16a34a" stroke-width="1.4"/>
  <text x="1146" y="227" text-anchor="middle" class="node-title">Video VAE</text>
  <text x="1146" y="248" text-anchor="middle" class="node-sub">tile / patch parallel</text>
  <text x="1146" y="273" text-anchor="middle" class="node-title">Audio VAE</text>
  <path class="arrow" d="M 1045 245 L 1066 245"/>
  <path class="arrow" d="M 840 284 L 871 257"/>

  <rect x="975" y="350" width="165" height="62" rx="11" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <text x="1057" y="375" text-anchor="middle" class="node-title">CPU response path</text>
  <text x="1057" y="396" text-anchor="middle" class="node-sub">H.264 + stereo AAC</text>
  <path class="arrow" d="M 1146 291 C 1146 325, 1105 337, 1080 350"/>

  <!-- Main request and media bypass -->
  <path class="arrow-blue" d="M 215 252 L 284 242"/>
  <text x="246" y="211" text-anchor="middle" class="arrow-label">presentation</text>
  <path class="arrow-orange dash" d="M 127 336 L 127 465 L 840 465 L 935 283"/>
  <text x="610" y="572" text-anchor="middle" class="arrow-label">original media references bypass the Stage 0 output</text>

  <!-- Independent queue callouts -->
  <rect x="270" y="490" width="490" height="58" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="515" y="514" text-anchor="middle" class="node-title">Overlap across requests</text>
  <text x="515" y="536" text-anchor="middle" class="node-sub">encode request N+1 while Stage 1 denoises request N</text>
  <path class="arrow dash" d="M 760 519 L 871 519 L 871 310"/>

  <text x="40" y="596" class="foot">Adapted from vLLM-Omni PR #5885 and RFC #5707. Stage placement and parallelism remain independently configurable.</text>
</svg>
