<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Internal KDA prefix checkpoints before and after optimization</title>
  <desc id="desc">Before, an 8000-token prefill used two model forwards and two FlashKDA calls per KDA layer: one for 7680 tokens and one for the remaining 320. After, each KDA layer makes one FlashKDA call over all 8000 tokens and snapshots checkpoint state at offset 7680 inside the same recurrence.</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="0.42" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="kda-main" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1687ff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 42px; font-weight: 800; fill: #0f172a; letter-spacing: -0.6px; }
      .subtitle { font-size: 21px; font-weight: 500; fill: #64748b; }
      .panel-title { font-size: 30px; font-weight: 790; fill: #172033; }
      .pass-title { font-size: 25px; font-weight: 760; fill: #1e293b; }
      .small { font-size: 17px; font-weight: 600; fill: #64748b; }
      .inside { font-size: 19px; font-weight: 720; fill: #334155; }
      .inside-white { font-size: 19px; font-weight: 760; fill: #ffffff; }
      .badge { font-size: 15px; font-weight: 820; letter-spacing: 1.5px; }
      .chip { font-size: 17px; font-weight: 740; }
    </style>
  </defs>

  <rect width="1600" height="800" fill="url(#page-bg)"/>

  <g class="sans">
    <text x="60" y="70" class="title">Internal KDA prefix checkpoints</text>
    <text x="60" y="108" class="subtitle">An 8K prefill no longer needs a second full-model pass for its 320-token tail</text>

    <g filter="url(#shadow)">
      <rect x="55" y="155" width="710" height="585" rx="24" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5"/>
      <rect x="795" y="155" width="750" height="585" rx="24" fill="#fafdff" stroke="#93c5fd" stroke-width="2"/>
    </g>

    <!-- Before -->
    <g>
      <rect x="90" y="190" width="92" height="31" rx="15.5" fill="#f1f5f9"/>
      <text x="136" y="211" text-anchor="middle" class="badge" fill="#64748b">BEFORE</text>
      <text x="90" y="263" class="panel-title">Two model forwards</text>
      <rect x="495" y="235" width="225" height="35" rx="17.5" fill="#f1f5f9"/>
      <text x="607.5" y="258" text-anchor="middle" class="chip" fill="#475569">2 FlashKDA calls / layer</text>

      <rect x="100" y="295" width="620" height="155" rx="19" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
      <circle cx="136" cy="331" r="18" fill="#e2e8f0"/>
      <text x="136" y="338" text-anchor="middle" font-size="18" font-weight="800" fill="#475569">1</text>
      <text x="170" y="339" class="pass-title">Model forward · 7,680 tokens</text>
      <text x="145" y="376" class="small">Each KDA layer</text>
      <rect x="145" y="391" width="322" height="42" rx="11" fill="#e2e8f0"/>
      <text x="306" y="418" text-anchor="middle" class="inside">FlashKDA call 1 · 7,680 tokens</text>
      <line x1="477" y1="412" x2="507" y2="412" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
      <rect x="520" y="391" width="165" height="42" rx="21" fill="#dbeafe"/>
      <text x="602.5" y="418" text-anchor="middle" class="chip" fill="#1d4ed8">export state</text>

      <line x1="410" y1="462" x2="410" y2="490" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-slate)"/>

      <rect x="100" y="505" width="620" height="170" rx="19" fill="#fffaf2" stroke="#fdba74" stroke-width="1.8"/>
      <circle cx="136" cy="541" r="18" fill="#ffedd5"/>
      <text x="136" y="548" text-anchor="middle" font-size="18" font-weight="800" fill="#c2410c">2</text>
      <text x="170" y="549" class="pass-title">Model forward · 320 tokens</text>
      <text x="145" y="586" class="small">Each KDA layer</text>
      <rect x="145" y="601" width="540" height="42" rx="11" fill="#ffedd5"/>
      <text x="415" y="628" text-anchor="middle" class="inside" fill="#9a3412">FlashKDA call 2 · 320-token tail</text>
      <rect x="178" y="688" width="464" height="31" rx="15.5" fill="#fff1f2"/>
      <text x="410" y="709" text-anchor="middle" class="chip" fill="#be123c">Repeats attention · MoE · routing · TP collectives</text>
    </g>

    <!-- After -->
    <g>
      <rect x="835" y="190" width="86" height="31" rx="15.5" fill="#dbeafe"/>
      <text x="878" y="211" text-anchor="middle" class="badge" fill="#1d4ed8">AFTER</text>
      <text x="835" y="263" class="panel-title">One model forward</text>
      <rect x="1250" y="235" width="250" height="35" rx="17.5" fill="#dbeafe"/>
      <text x="1375" y="258" text-anchor="middle" class="chip" fill="#1d4ed8">1 FlashKDA call / layer</text>

      <rect x="840" y="295" width="660" height="380" rx="20" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8"/>
      <circle cx="880" cy="338" r="21" fill="#dbeafe"/>
      <text x="880" y="345" text-anchor="middle" font-size="20" font-weight="850" fill="#1d4ed8">1</text>
      <text x="918" y="346" class="pass-title">Model forward · 8,000 tokens</text>

      <text x="890" y="405" class="small">FlashKDA · one call · 8,000 tokens</text>
      <rect x="1310" y="382" width="155" height="32" rx="16" fill="#dbeafe"/>
      <text x="1387.5" y="403" text-anchor="middle" font-size="15" font-weight="760" fill="#1d4ed8">last 320 tokens</text>
      <line x1="1418" y1="414" x2="1439" y2="437" stroke="#60a5fa" stroke-width="2.2"/>

      <rect x="890" y="438" width="560" height="76" rx="14" fill="url(#kda-main)"/>
      <text x="1159" y="471" text-anchor="middle" class="inside-white">first 7,680 tokens</text>
      <text x="1159" y="497" text-anchor="middle" font-size="17" font-weight="620" fill="#dbeafe">96% of the input</text>

      <line x1="1428" y1="423" x2="1428" y2="553" stroke="#f59e0b" stroke-width="4"/>
      <circle cx="1428" cy="476" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>
      <rect x="1192" y="552" width="230" height="42" rx="21" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
      <text x="1307" y="579" text-anchor="middle" class="chip" fill="#a16207">export checkpoint state</text>

      <rect x="1000" y="618" width="340" height="38" rx="19" fill="#ecfdf5"/>
      <text x="1170" y="643" text-anchor="middle" class="chip" fill="#047857">No second full-model pass</text>
    </g>
  </g>
</svg>
