<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">Zero-copy mixed KDA batches before and after optimization</title>
  <desc id="desc">Before, packed non-speculative and speculative tokens were gathered with six index select operations, processed by separate KDA paths, and scattered with two index copy operations. After, contiguous token groups are passed as zero-copy views and both KDA paths write directly into slices of the final output.</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="0.42" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1687ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d5ce7"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 42px; font-weight: 800; fill: #0f172a; letter-spacing: -0.6px; }
      .subtitle { font-size: 21px; font-weight: 500; fill: #64748b; }
      .panel-title { font-size: 30px; font-weight: 790; fill: #172033; }
      .section-label { font-size: 17px; font-weight: 650; fill: #64748b; }
      .token { font-size: 17px; font-weight: 800; }
      .box-title { font-size: 20px; font-weight: 780; }
      .box-sub { font-size: 16px; font-weight: 620; }
      .badge { font-size: 15px; font-weight: 820; letter-spacing: 1.5px; }
      .chip { font-size: 17px; font-weight: 760; }
    </style>
  </defs>

  <rect width="1600" height="840" fill="url(#page-bg)"/>

  <g class="sans">
    <text x="60" y="70" class="title">Zero-copy mixed KDA batches</text>
    <text x="60" y="108" class="subtitle">Contiguous token groups remove six gathers and two scatters from every KDA layer</text>

    <g filter="url(#shadow)">
      <rect x="55" y="155" width="710" height="630" rx="24" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5"/>
      <rect x="795" y="155" width="750" height="630" rx="24" fill="#fafdff" stroke="#93c5fd" stroke-width="2"/>
    </g>

    <!-- Before -->
    <g>
      <rect x="90" y="190" width="92" height="31" rx="15.5" fill="#f1f5f9"/>
      <text x="136" y="211" text-anchor="middle" class="badge" fill="#64748b">BEFORE</text>
      <text x="90" y="263" class="panel-title">Gather, run, scatter</text>

      <text x="110" y="310" class="section-label">Packed QKV · gate · beta</text>
      <g>
        <rect x="110" y="328" width="92" height="43" rx="10" fill="#dbeafe"/>
        <rect x="207" y="328" width="92" height="43" rx="10" fill="#dbeafe"/>
        <rect x="309" y="328" width="92" height="43" rx="10" fill="#ede9fe"/>
        <rect x="406" y="328" width="92" height="43" rx="10" fill="#ede9fe"/>
        <rect x="503" y="328" width="92" height="43" rx="10" fill="#ede9fe"/>
        <text x="156" y="355" text-anchor="middle" class="token" fill="#1d4ed8">N0</text>
        <text x="253" y="355" text-anchor="middle" class="token" fill="#1d4ed8">N1</text>
        <text x="355" y="355" text-anchor="middle" class="token" fill="#6d28d9">S0</text>
        <text x="452" y="355" text-anchor="middle" class="token" fill="#6d28d9">S1</text>
        <text x="549" y="355" text-anchor="middle" class="token" fill="#6d28d9">S2</text>
      </g>

      <path d="M 353 384 L 353 404 L 245 404 L 245 424" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
      <path d="M 353 404 L 575 404 L 575 424" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

      <rect x="135" y="428" width="220" height="38" rx="19" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
      <rect x="465" y="428" width="220" height="38" rx="19" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
      <text x="245" y="453" text-anchor="middle" class="chip" fill="#c2410c">index_select × 3</text>
      <text x="575" y="453" text-anchor="middle" class="chip" fill="#c2410c">index_select × 3</text>

      <line x1="245" y1="468" x2="245" y2="489" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
      <line x1="575" y1="468" x2="575" y2="489" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

      <rect x="120" y="495" width="250" height="72" rx="15" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
      <rect x="450" y="495" width="250" height="72" rx="15" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
      <text x="245" y="527" text-anchor="middle" class="box-title" fill="#1d4ed8">Non-spec KDA</text>
      <text x="245" y="551" text-anchor="middle" class="box-sub" fill="#64748b">N0 · N1</text>
      <text x="575" y="527" text-anchor="middle" class="box-title" fill="#6d28d9">Spec KDA</text>
      <text x="575" y="551" text-anchor="middle" class="box-sub" fill="#64748b">S0 · S1 · S2</text>

      <line x1="245" y1="569" x2="245" y2="590" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
      <line x1="575" y1="569" x2="575" y2="590" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

      <rect x="135" y="596" width="220" height="38" rx="19" fill="#fff1f2"/>
      <rect x="465" y="596" width="220" height="38" rx="19" fill="#fff1f2"/>
      <text x="245" y="621" text-anchor="middle" class="chip" fill="#be123c">index_copy_ × 1</text>
      <text x="575" y="621" text-anchor="middle" class="chip" fill="#be123c">index_copy_ × 1</text>

      <path d="M 245 636 L 245 656 L 410 656 L 410 673" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
      <path d="M 575 636 L 575 656 L 410 656" fill="none" stroke="#94a3b8" stroke-width="2.5"/>

      <rect x="145" y="680" width="530" height="42" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
      <text x="410" y="707" text-anchor="middle" class="chip" fill="#475569">Final output assembled by scatter</text>

      <rect x="227" y="739" width="366" height="31" rx="15.5" fill="#fff1f2"/>
      <text x="410" y="760" text-anchor="middle" class="chip" fill="#be123c">6 gathers + 2 scatters / layer</text>
    </g>

    <!-- After -->
    <g>
      <rect x="835" y="190" width="86" height="31" rx="15.5" fill="#dbeafe"/>
      <text x="878" y="211" text-anchor="middle" class="badge" fill="#1d4ed8">AFTER</text>
      <text x="835" y="263" class="panel-title">Slice, run, write in place</text>

      <text x="855" y="310" class="section-label">Same packed storage · groups are contiguous</text>
      <g>
        <rect x="855" y="328" width="106" height="43" rx="10" fill="#dbeafe"/>
        <rect x="966" y="328" width="106" height="43" rx="10" fill="#dbeafe"/>
        <rect x="1082" y="328" width="106" height="43" rx="10" fill="#ede9fe"/>
        <rect x="1193" y="328" width="106" height="43" rx="10" fill="#ede9fe"/>
        <rect x="1304" y="328" width="106" height="43" rx="10" fill="#ede9fe"/>
        <text x="908" y="355" text-anchor="middle" class="token" fill="#1d4ed8">N0</text>
        <text x="1019" y="355" text-anchor="middle" class="token" fill="#1d4ed8">N1</text>
        <text x="1135" y="355" text-anchor="middle" class="token" fill="#6d28d9">S0</text>
        <text x="1246" y="355" text-anchor="middle" class="token" fill="#6d28d9">S1</text>
        <text x="1357" y="355" text-anchor="middle" class="token" fill="#6d28d9">S2</text>
        <line x1="1077" y1="323" x2="1077" y2="376" stroke="#ffffff" stroke-width="5"/>
      </g>

      <path d="M 1019 383 L 1019 418 L 955 418 L 955 437" fill="none" stroke="#60a5fa" stroke-width="2.7" marker-end="url(#arrow)"/>
      <path d="M 1246 383 L 1246 418 L 1325 418 L 1325 437" fill="none" stroke="#a78bfa" stroke-width="2.7" marker-end="url(#arrow)"/>

      <rect x="850" y="443" width="210" height="40" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
      <rect x="1220" y="443" width="210" height="40" rx="20" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.3"/>
      <text x="955" y="469" text-anchor="middle" class="chip" fill="#1d4ed8">zero-copy view [0:2]</text>
      <text x="1325" y="469" text-anchor="middle" class="chip" fill="#6d28d9">zero-copy view [2:5]</text>

      <line x1="955" y1="485" x2="955" y2="510" stroke="#60a5fa" stroke-width="2.7" marker-end="url(#arrow)"/>
      <line x1="1325" y1="485" x2="1325" y2="510" stroke="#a78bfa" stroke-width="2.7" marker-end="url(#arrow)"/>

      <rect x="835" y="516" width="240" height="92" rx="16" fill="url(#blue)"/>
      <rect x="1205" y="516" width="240" height="92" rx="16" fill="url(#violet)"/>
      <text x="955" y="550" text-anchor="middle" class="box-title" fill="#ffffff">Non-spec KDA</text>
      <text x="955" y="579" text-anchor="middle" class="box-sub" fill="#dbeafe">out = final_output[0:2]</text>
      <text x="1325" y="550" text-anchor="middle" class="box-title" fill="#ffffff">Spec KDA</text>
      <text x="1325" y="579" text-anchor="middle" class="box-sub" fill="#ede9fe">out = final_output[2:5]</text>

      <path d="M 955 610 L 955 645 L 1138 645 L 1138 666" fill="none" stroke="#60a5fa" stroke-width="2.7" marker-end="url(#arrow)"/>
      <path d="M 1325 610 L 1325 645 L 1138 645" fill="none" stroke="#a78bfa" stroke-width="2.7"/>

      <g>
        <rect x="875" y="674" width="104" height="43" rx="10" fill="#dbeafe"/>
        <rect x="984" y="674" width="104" height="43" rx="10" fill="#dbeafe"/>
        <rect x="1098" y="674" width="104" height="43" rx="10" fill="#ede9fe"/>
        <rect x="1207" y="674" width="104" height="43" rx="10" fill="#ede9fe"/>
        <rect x="1316" y="674" width="104" height="43" rx="10" fill="#ede9fe"/>
        <text x="927" y="701" text-anchor="middle" class="token" fill="#1d4ed8">N0</text>
        <text x="1036" y="701" text-anchor="middle" class="token" fill="#1d4ed8">N1</text>
        <text x="1150" y="701" text-anchor="middle" class="token" fill="#6d28d9">S0</text>
        <text x="1259" y="701" text-anchor="middle" class="token" fill="#6d28d9">S1</text>
        <text x="1368" y="701" text-anchor="middle" class="token" fill="#6d28d9">S2</text>
      </g>

      <rect x="1004" y="739" width="332" height="31" rx="15.5" fill="#ecfdf5"/>
      <text x="1170" y="760" text-anchor="middle" class="chip" fill="#047857">No gather or scatter copies</text>
    </g>
  </g>
</svg>
