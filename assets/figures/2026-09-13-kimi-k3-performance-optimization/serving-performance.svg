<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="870" viewBox="0 0 1600 870" role="img" aria-labelledby="title desc">
  <title id="title">Kimi K3 serving performance from vLLM v0.27.1 to main on September 13</title>
  <desc id="desc">Three grouped bar charts compare average latency, throughput, and time to first token at concurrency 1, 4, and 16. Main has 55.6 to 60.3 percent lower latency, 2.2 to 2.8 times the throughput, and 72.3 to 85.3 percent lower time to first token.</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="0.34" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="main-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1687ff"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 42px; font-weight: 800; fill: #0f172a; letter-spacing: -0.6px; }
      .subtitle { font-size: 21px; font-weight: 500; fill: #64748b; }
      .metric { font-size: 29px; font-weight: 780; fill: #172033; }
      .metric-sub { font-size: 17px; font-weight: 550; fill: #64748b; }
      .tick { font-size: 15px; fill: #7c899c; }
      .value-base { font-size: 15px; font-weight: 700; fill: #64748b; }
      .value-main { font-size: 15px; font-weight: 800; fill: #1d4ed8; }
      .conc { font-size: 17px; font-weight: 720; fill: #334155; }
      .gain { font-size: 16px; font-weight: 800; fill: #047857; }
      .legend { font-size: 17px; font-weight: 650; fill: #475569; }
      .foot { font-size: 17px; font-weight: 700; fill: #64748b; }
    </style>
  </defs>

  <rect width="1600" height="920" fill="url(#page-bg)"/>

  <g class="sans">
    <text x="60" y="70" class="title">Kimi K3 serving performance</text>
    <text x="60" y="108" class="subtitle">vLLM v0.27.1 → main (Sep 13) · 8K input / 1K output · TP8 · NVIDIA B300</text>

    <g transform="translate(60,153)">
      <rect x="0" y="-11" width="20" height="20" rx="5" fill="#a8b3c3"/>
      <text x="31" y="5" class="legend">v0.27.1</text>
      <rect x="126" y="-11" width="20" height="20" rx="5" fill="url(#main-bar)"/>
      <text x="157" y="5" class="legend">Sep 13 main</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1280" y="37" width="260" height="100" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    </g>
    <text x="1410" y="80" text-anchor="middle" font-size="35" font-weight="850" fill="#1d4ed8">2.2–2.8×</text>
    <text x="1410" y="111" text-anchor="middle" font-size="18" font-weight="720" fill="#3b5f9b">baseline throughput</text>

    <g filter="url(#shadow)">
      <rect x="55" y="205" width="480" height="630" rx="23" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5"/>
      <rect x="560" y="205" width="480" height="630" rx="23" fill="#fafdff" stroke="#93c5fd" stroke-width="2"/>
      <rect x="1065" y="205" width="480" height="630" rx="23" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5"/>
    </g>

    <!-- Average latency -->
    <g>
      <text x="90" y="254" class="metric">Average latency</text>
      <text x="90" y="283" class="metric-sub">Seconds · lower is better</text>

      <g stroke="#edf1f6" stroke-width="1.4">
        <line x1="125" y1="680" x2="500" y2="680"/>
        <line x1="125" y1="568.3" x2="500" y2="568.3"/>
        <line x1="125" y1="456.7" x2="500" y2="456.7"/>
        <line x1="125" y1="345" x2="500" y2="345"/>
      </g>
      <g class="tick" text-anchor="end">
        <text x="113" y="685">0</text>
        <text x="113" y="573.3">20</text>
        <text x="113" y="461.7">40</text>
        <text x="113" y="350">60</text>
      </g>

      <rect x="173" y="610.9" width="30" height="69.1" rx="6" fill="#a8b3c3"/>
      <rect x="207" y="650.4" width="30" height="29.6" rx="6" fill="url(#main-bar)"/>
      <text x="188" y="599" text-anchor="middle" class="value-base">12.37</text>
      <text x="222" y="639" text-anchor="middle" class="value-main">5.30</text>

      <rect x="283" y="547.8" width="30" height="132.2" rx="6" fill="#a8b3c3"/>
      <rect x="317" y="621.4" width="30" height="58.6" rx="6" fill="url(#main-bar)"/>
      <text x="298" y="536" text-anchor="middle" class="value-base">23.67</text>
      <text x="332" y="610" text-anchor="middle" class="value-main">10.50</text>

      <rect x="393" y="367.9" width="30" height="312.1" rx="6" fill="#a8b3c3"/>
      <rect x="427" y="556.2" width="30" height="123.8" rx="6" fill="url(#main-bar)"/>
      <text x="408" y="356" text-anchor="middle" class="value-base">55.90</text>
      <text x="442" y="545" text-anchor="middle" class="value-main">22.17</text>

      <g text-anchor="middle">
        <text x="205" y="714" class="conc">C=1</text>
        <text x="315" y="714" class="conc">C=4</text>
        <text x="425" y="714" class="conc">C=16</text>
        <rect x="169" y="733" width="72" height="32" rx="16" fill="#ecfdf5"/>
        <rect x="279" y="733" width="72" height="32" rx="16" fill="#ecfdf5"/>
        <rect x="389" y="733" width="72" height="32" rx="16" fill="#ecfdf5"/>
        <text x="205" y="755" class="gain">−57%</text>
        <text x="315" y="755" class="gain">−56%</text>
        <text x="425" y="755" class="gain">−60%</text>
      </g>
      <text x="295" y="805" text-anchor="middle" class="foot">Up to 60% lower</text>
    </g>

    <!-- Throughput -->
    <g>
      <text x="595" y="254" class="metric">Throughput</text>
      <text x="595" y="283" class="metric-sub">Tokens / second · higher is better</text>

      <g stroke="#e7effa" stroke-width="1.4">
        <line x1="630" y1="680" x2="1005" y2="680"/>
        <line x1="630" y1="596.3" x2="1005" y2="596.3"/>
        <line x1="630" y1="512.5" x2="1005" y2="512.5"/>
        <line x1="630" y1="428.8" x2="1005" y2="428.8"/>
        <line x1="630" y1="345" x2="1005" y2="345"/>
      </g>
      <g class="tick" text-anchor="end">
        <text x="618" y="685">0</text>
        <text x="618" y="601.3">200</text>
        <text x="618" y="517.5">400</text>
        <text x="618" y="433.8">600</text>
        <text x="618" y="350">800</text>
      </g>

      <rect x="678" y="645.1" width="30" height="34.9" rx="6" fill="#a8b3c3"/>
      <rect x="712" y="603.2" width="30" height="76.8" rx="6" fill="url(#main-bar)"/>
      <text x="693" y="634" text-anchor="middle" class="value-base">83</text>
      <text x="727" y="592" text-anchor="middle" class="value-main">183</text>

      <rect x="788" y="610.2" width="30" height="69.8" rx="6" fill="#a8b3c3"/>
      <rect x="822" y="505.5" width="30" height="174.5" rx="6" fill="url(#main-bar)"/>
      <text x="803" y="599" text-anchor="middle" class="value-base">167</text>
      <text x="837" y="494" text-anchor="middle" class="value-main">417</text>

      <rect x="898" y="571.8" width="30" height="108.2" rx="6" fill="#a8b3c3"/>
      <rect x="932" y="376.4" width="30" height="303.6" rx="6" fill="url(#main-bar)"/>
      <text x="913" y="560" text-anchor="middle" class="value-base">258</text>
      <text x="947" y="365" text-anchor="middle" class="value-main">725</text>

      <g text-anchor="middle">
        <text x="710" y="714" class="conc">C=1</text>
        <text x="820" y="714" class="conc">C=4</text>
        <text x="930" y="714" class="conc">C=16</text>
        <rect x="674" y="733" width="72" height="32" rx="16" fill="#dbeafe"/>
        <rect x="784" y="733" width="72" height="32" rx="16" fill="#dbeafe"/>
        <rect x="894" y="733" width="72" height="32" rx="16" fill="#dbeafe"/>
        <text x="710" y="755" class="gain" fill="#1d4ed8">2.2×</text>
        <text x="820" y="755" class="gain" fill="#1d4ed8">2.5×</text>
        <text x="930" y="755" class="gain" fill="#1d4ed8">2.8×</text>
      </g>
      <text x="800" y="805" text-anchor="middle" class="foot" fill="#1d4ed8">2.2–2.8× throughput</text>
    </g>

    <!-- TTFT -->
    <g>
      <text x="1100" y="254" class="metric">Average TTFT</text>
      <text x="1100" y="283" class="metric-sub">Milliseconds · lower is better</text>

      <g stroke="#edf1f6" stroke-width="1.4">
        <line x1="1135" y1="680" x2="1510" y2="680"/>
        <line x1="1135" y1="596.3" x2="1510" y2="596.3"/>
        <line x1="1135" y1="512.5" x2="1510" y2="512.5"/>
        <line x1="1135" y1="428.8" x2="1510" y2="428.8"/>
        <line x1="1135" y1="345" x2="1510" y2="345"/>
      </g>
      <g class="tick" text-anchor="end">
        <text x="1123" y="685">0</text>
        <text x="1123" y="601.3">2K</text>
        <text x="1123" y="517.5">4K</text>
        <text x="1123" y="433.8">6K</text>
        <text x="1123" y="350">8K</text>
      </g>

      <rect x="1183" y="585.2" width="30" height="94.8" rx="6" fill="#a8b3c3"/>
      <rect x="1217" y="664.2" width="30" height="15.8" rx="6" fill="url(#main-bar)"/>
      <text x="1198" y="574" text-anchor="middle" class="value-base">2,263</text>
      <text x="1232" y="653" text-anchor="middle" class="value-main">376</text>

      <rect x="1293" y="583.1" width="30" height="96.9" rx="6" fill="#a8b3c3"/>
      <rect x="1327" y="653.2" width="30" height="26.8" rx="6" fill="url(#main-bar)"/>
      <text x="1308" y="572" text-anchor="middle" class="value-base">2,315</text>
      <text x="1342" y="642" text-anchor="middle" class="value-main">641</text>

      <rect x="1403" y="361.7" width="30" height="318.3" rx="6" fill="#a8b3c3"/>
      <rect x="1437" y="633.1" width="30" height="46.9" rx="6" fill="url(#main-bar)"/>
      <text x="1418" y="350" text-anchor="middle" class="value-base">7,601</text>
      <text x="1452" y="622" text-anchor="middle" class="value-main">1,121</text>

      <g text-anchor="middle">
        <text x="1215" y="714" class="conc">C=1</text>
        <text x="1325" y="714" class="conc">C=4</text>
        <text x="1435" y="714" class="conc">C=16</text>
        <rect x="1179" y="733" width="72" height="32" rx="16" fill="#ecfdf5"/>
        <rect x="1289" y="733" width="72" height="32" rx="16" fill="#ecfdf5"/>
        <rect x="1399" y="733" width="72" height="32" rx="16" fill="#ecfdf5"/>
        <text x="1215" y="755" class="gain">−83%</text>
        <text x="1325" y="755" class="gain">−72%</text>
        <text x="1435" y="755" class="gain">−85%</text>
      </g>
      <text x="1305" y="805" text-anchor="middle" class="foot">Up to 85% lower</text>
    </g>
  </g>
</svg>
