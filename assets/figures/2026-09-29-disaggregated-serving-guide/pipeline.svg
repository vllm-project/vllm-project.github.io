<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" width="960" height="412" role="img" aria-labelledby="dsgt dsgd" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id="dsgt">Collocated vLLM serving versus disaggregated serving</title>
<desc id="dsgd">Top: a single vllm serve process runs chat templating and tokenization, prefill, decode, and detokenization and parsing on one GPU node. Bottom: the same pipeline split into four tiers — a GPU-less render tier, a prefill instance, a decode instance connected to prefill by a KV cache transfer over RDMA, and a GPU-less derender tier.</desc>

  <style>
    .bg-panel  { fill: #f6f6fb; stroke: #d9d9e8; }
    .t         { fill: #16162a; font-family: ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; }
    .t-mut     { fill: #5c5c78; font-family: ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; }
    .mono      { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .ln-div    { stroke: #d2d2e2; fill: none; }
    .acc-f     { fill: #6C5CE7; }
    .acc-soft  { fill: #ece9fd; stroke: #6C5CE7; }
    .acc-mid   { fill: #d8d2fb; stroke: #6C5CE7; }
    .acc2-f    { fill: #0E8A7D; }
    .acc2-soft { fill: #e2f4f1; stroke: #0E8A7D; }
    .acc2-mid  { fill: #c6e9e3; stroke: #0E8A7D; }
    .warn-f    { fill: #C2410C; }
    .warn-s    { stroke: #C2410C; fill: none; }
    .ah        { fill: #9a9ab4; }
    .ah-warn   { fill: #C2410C; }
    .ln        { stroke: #9a9ab4; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg-panel  { fill: #1b1b2b; stroke: #34344a; }
      .t         { fill: #e9e9f2; }
      .t-mut     { fill: #a2a2bd; }
      .ln-div    { stroke: #3a3a52; }
      .acc-f     { fill: #A29BFE; }
      .acc-soft  { fill: #2e2b52; stroke: #A29BFE; }
      .acc-mid   { fill: #423a78; stroke: #A29BFE; }
      .acc2-f    { fill: #4ECDC4; }
      .acc2-soft { fill: #1d3a3a; stroke: #4ECDC4; }
      .acc2-mid  { fill: #27514e; stroke: #4ECDC4; }
      .warn-f    { fill: #FB923C; }
      .warn-s    { stroke: #FB923C; }
      .ah        { fill: #6a6a86; }
      .ah-warn   { fill: #FB923C; }
      .ln        { stroke: #6a6a86; }
    }
  </style>

  <text x="20" y="30" class="t" font-size="17" font-weight="700">Two cuts through the vLLM serving path</text>
  <rect x="700" y="20" width="15" height="11" rx="2.5" class="acc2-mid" stroke-width="1.1"/>
  <text x="721" y="29.5" class="t-mut" font-size="12.5">CPU only</text>
  <rect x="800" y="20" width="15" height="11" rx="2.5" class="acc-mid" stroke-width="1.1"/>
  <text x="821" y="29.5" class="t-mut" font-size="12.5">GPU</text>

  <text x="20" y="70" class="t" font-size="15" font-weight="600">Today — one process, one GPU node</text>

  <rect x="79" y="82" width="802" height="76" rx="6" class="bg-panel" stroke-width="1.2"/>
  <rect x="93" y="98" width="184" height="44" rx="4" class="acc2-soft" stroke-width="1.1"/>
  <text x="185" y="117" class="acc2-f" font-size="12" text-anchor="middle" font-weight="600">chat template</text>
  <text x="185" y="132" class="acc2-f" font-size="12" text-anchor="middle" font-weight="600">+ tokenize</text>
  <rect x="290" y="98" width="184" height="44" rx="4" class="acc-soft" stroke-width="1.1"/>
  <text x="382" y="125" class="acc-f" font-size="12.5" text-anchor="middle" font-weight="600">prefill</text>
  <rect x="487" y="98" width="184" height="44" rx="4" class="acc-soft" stroke-width="1.1"/>
  <text x="579" y="125" class="acc-f" font-size="12.5" text-anchor="middle" font-weight="600">decode</text>
  <rect x="684" y="98" width="184" height="44" rx="4" class="acc2-soft" stroke-width="1.1"/>
  <text x="776" y="117" class="acc2-f" font-size="12" text-anchor="middle" font-weight="600">detokenize</text>
  <text x="776" y="132" class="acc2-f" font-size="12" text-anchor="middle" font-weight="600">+ tool parse</text>

  <text x="79" y="180" class="t-mut" font-size="12.5">Prefill blocks decode under load, and the tokenizer runs on hardware you rent for its accelerators.</text>

  <line x1="20" y1="205" x2="940" y2="205" class="ln-div" stroke-width="1"/>

  <text x="20" y="236" class="t" font-size="15" font-weight="600">Disaggregated — four tiers, two cuts</text>

  <text x="79" y="256" class="t-mut" font-size="11.5">OpenAI request</text>
  <text x="881" y="256" class="t-mut" font-size="11.5" text-anchor="end">OpenAI response</text>

  <rect x="79" y="266" width="160" height="90" rx="6" class="acc2-soft" stroke-width="1.4"/>
  <text x="159" y="296" class="acc2-f mono" font-size="14" text-anchor="middle" font-weight="700">/render</text>
  <text x="159" y="318" class="t-mut" font-size="11" text-anchor="middle">chat template,</text>
  <text x="159" y="333" class="t-mut" font-size="11" text-anchor="middle">tokenize, MM prep</text>

  <rect x="293" y="266" width="160" height="90" rx="6" class="acc-soft" stroke-width="1.4"/>
  <text x="373" y="296" class="acc-f" font-size="14" text-anchor="middle" font-weight="700">Prefill</text>
  <text x="373" y="318" class="t-mut" font-size="11" text-anchor="middle">compute-bound</text>
  <text x="373" y="333" class="t-mut" font-size="11" text-anchor="middle">size for TTFT</text>

  <rect x="507" y="266" width="160" height="90" rx="6" class="acc-soft" stroke-width="1.4"/>
  <text x="587" y="296" class="acc-f" font-size="14" text-anchor="middle" font-weight="700">Decode</text>
  <text x="587" y="318" class="t-mut" font-size="11" text-anchor="middle">bandwidth-bound</text>
  <text x="587" y="333" class="t-mut" font-size="11" text-anchor="middle">size for ITL</text>

  <rect x="721" y="266" width="160" height="90" rx="6" class="acc2-soft" stroke-width="1.4"/>
  <text x="801" y="296" class="acc2-f mono" font-size="14" text-anchor="middle" font-weight="700">/derender</text>
  <text x="801" y="318" class="t-mut" font-size="11" text-anchor="middle">detokenize, reasoning</text>
  <text x="801" y="333" class="t-mut" font-size="11" text-anchor="middle">+ tool-call parse</text>

  <text x="266" y="302" class="t-mut" font-size="10.5" text-anchor="middle">tokens</text>
  <line x1="241" y1="311" x2="283" y2="311" class="ln" stroke-width="1.4"/>
  <polygon points="283,306.5 291,311 283,315.5" class="ah"/>

  <text x="480" y="302" class="warn-f" font-size="10.5" text-anchor="middle" font-weight="700">KV cache</text>
  <line x1="455" y1="311" x2="497" y2="311" class="warn-s" stroke-width="1.6"/>
  <polygon points="497,306.5 505,311 497,315.5" class="ah-warn"/>
  <text x="480" y="328" class="t-mut" font-size="10" text-anchor="middle">RDMA</text>

  <text x="694" y="302" class="t-mut" font-size="10.5" text-anchor="middle">tokens</text>
  <line x1="669" y1="311" x2="711" y2="311" class="ln" stroke-width="1.4"/>
  <polygon points="711,306.5 719,311 711,315.5" class="ah"/>

  <text x="159" y="374" class="t-mut" font-size="10.5" text-anchor="middle" letter-spacing="0.6">NO GPU</text>
  <text x="373" y="374" class="t-mut" font-size="10.5" text-anchor="middle" letter-spacing="0.6">GPU</text>
  <text x="587" y="374" class="t-mut" font-size="10.5" text-anchor="middle" letter-spacing="0.6">GPU</text>
  <text x="801" y="374" class="t-mut" font-size="10.5" text-anchor="middle" letter-spacing="0.6">NO GPU</text>

  <text x="79" y="398" class="t-mut" font-size="12">Both CPU tiers are the same <tspan class="mono">vllm launch render</tspan> server. The engine between them never sees text.</text>
</svg>
