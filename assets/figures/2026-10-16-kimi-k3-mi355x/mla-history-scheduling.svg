<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Split the history across workgroups on one GPU</title>
<desc id="desc">A comparison within one GPU for TP8, one request, one new token, BF16 ordinary decode without DCP. Both panels show the same full KV history. In the audited historical Gluon caller path, a conservative length hint limits the split count to one; one workgroup processes the whole history. After the query adapter enables AMD AITER assembly, different workgroups process different history partitions and a reduction combines partial attention with its normalization information. Four partitions are illustrative; source heuristic replay selected sixteen for the audited 1K and 32K contexts. This is not a measured workgroup trace, runtime scale, occupancy measurement or speedup. The adapter copies four of twelve useful query heads to supply sixteen backend inputs and retains twelve outputs. It does not expand the stored KV cache. Gluon also supports split KV; this diagram concerns the audited historical caller and metadata policy.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#526677" stroke-width="1.8"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="1200" height="640" fill="white"/>
