" width="1152" height="50" rx="8" fill="#f4f7f9" stroke="#bdcbd6" stroke-width="1.5"/><text x="44" y="562" font-size="21" font-weight="700" fill="#16324b" text-anchor="start">Query adapter:</text><text x="207" y="562" font-size="22" font-weight="400" fill="#16324b" text-anchor="start">12 useful heads + 4 copies → 16 backend inputs → keep 12 outputs</text><text x="26" y="611" font-size="22" font-weight="400" fill="#526677" text-anchor="start">Same total history and cache size. Four partitions shown for illustration.</text>
