<svg xmlns="http://www.w3.org/2000/svg" width="900" height="443" viewBox="0 0 900 443" role="img" aria-labelledby="title desc">
<title id="title">A small storage increase can remove a block slot</title><desc id="desc">An LDS capacity illustration. With 160 KiB available per compute unit, a 79.5 KiB request rounds to 80 KiB in 1,280-byte allocation units. Two such blocks fit. Increasing the request by one KiB to 80.5 KiB rounds to 81.25 KiB. One block leaves 78.75 KiB, too little for a second block. This is capacity arithmetic, not a measurement of occupancy or speedup.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#526677" stroke-width="1.8"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="900" height="443" fill="white"/>
<text x="26" y="39" font-size="28" font-weight="700" fill="#16324b" text-anchor="start">A small storage increase can remove a block slot</text><text x="26" y="77" font-size="21" fill="#526677" text-anchor="start">LDS = shared scratch memory on each AMD compute unit.</text><text x="26" y="118" font-size="22" font-weight="700" fill="#16324b" text-anchor="start">160 KiB available</text><text x="26" y="159" font-size="23" font-weight="700" fill="#16324b" text-anchor="start">79.5 KiB requested → 80 KiB allocated per block</text><rect x="26" y="179" width="424.0" height="83" rx="8" fill="#e8f4ff" stroke="#30a2ff" stroke-width="1.5"/><text x="238.0" y="214" font-size="25" font-weight="700" fill="#16324b" text-anchor="middle">Block 1</text><text x="238.0" y="245" font-size="23" fill="#16324b" text-anchor="middle">80 KiB</text><rect x="450" y="179" width="424.0" height="83" rx="8" fill="#e8f4ff" stroke="#30a2ff" stroke-width="1.5"/><text x="662.0" y="214" font-size="25" font-weight="700" fill="#16324b" text-anchor="middle">Block 2</text><text x="662.0" y="245" font-size="23" fill="#16324b" text-anchor="middle">80 KiB</text><text x="26" y="312" font-size="23" font-weight="700" fill="#16324b" text-anchor="start">80.5 KiB requested → 81.25 KiB allocated per block</text><rect x="26" y="332" width="430.625" height="83" rx="8" fill="#fff3ce" stroke="#fdb515" stroke-width="1.5"/><rect x="456.625" y="332" width="417.375" height="83" rx="8" fill="#f5f7f8" stroke="#bdcbd6" stroke-width="1.5"/><text x="241.3125" y="367" font-size="25" font-weight="700" fill="#16324b" text-anchor="middle">Block 1</text><text x="241.3125" y="398" font-size="23" fill="#16324b" text-anchor="middle">81.25 KiB</text><text x="665.3125" y="367" font-size="25" font-weight="700" fill="#16324b" text-anchor="middle">78.75 KiB left</text><text x="665.3125" y="398" font-size="23" fill="#16324b" text-anchor="middle">Block 2 no longer fits</text></svg>
