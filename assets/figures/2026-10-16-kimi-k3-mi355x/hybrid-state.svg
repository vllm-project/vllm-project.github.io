<svg xmlns="http://www.w3.org/2000/svg" width="900" height="670" viewBox="0 0 900 670" role="img" aria-labelledby="title desc">
<title id="title">Resume the history; compute the new positions</title>
<desc id="desc">A resumed turn recovers compatible saved state and prefills the new suffix. Attention layers are alternatives: an MLA layer reads old KV history and extends it with new entries; a KDA layer updates a fixed-dimension state. Attention is followed by experts using model weights. Subsequent decode or verification steps repeat the model using updated state.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#526677" stroke-width="1.7"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#16324b;font-size:18px}.title{font-size:27px;font-weight:700}.heading{font-size:21px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:16px}.muted{fill:#526677}.mobile-title{font-size:24px;font-weight:700}</style>
