<text x="303" y="91" class="label" text-anchor="middle" style="fill:#16324b">Already processed conversation</text>
<text x="303" y="114" class="small" text-anchor="middle" style="fill:#16324b">Recover compatible saved state</text>
<rect x="600" y="65" width="276" height="61" rx="7" fill="#e8f4ff" stroke="#30a2ff" stroke-width="1.5"/>
<text x="738" y="91" class="label" text-anchor="middle" style="fill:#16324b">New suffix → prefill</text>
<text x="738" y="114" class="small" text-anchor="middle" style="fill:#16324b">Only the remaining input positions</text>
<path d="M303 127V157H155V192" fill="none" stroke="#71849a" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M738 127V158H738V192" fill="none" stroke="#30a2ff" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="24" y="194" width="852" height="246" rx="10" fill="#f7f9fb" stroke="#bdcbd6" stroke-width="1.5"/>
