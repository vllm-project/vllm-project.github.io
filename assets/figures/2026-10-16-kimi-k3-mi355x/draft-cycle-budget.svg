<svg xmlns="http://www.w3.org/2000/svg" width="900" height="478" viewBox="0 0 900 478" role="img" aria-labelledby="title desc">
<title id="title">Can the fourth draft pay for itself?</title><desc id="desc">Illustrative comparison under the controlled acceptance reference: three drafts give 3.00 expected committed tokens per cycle; four give 3.36, an increase of 12 percent. The fourth draft improves useful token rate only when the complete draft, verify and commit cycle takes less than 12 percent longer. Actual cycle growth is not measured here.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#526677" stroke-width="1.8"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="900" height="478" fill="white"/>
<text x="26" y="40" font-size="29" font-weight="700" fill="#16324b" text-anchor="start">Can the fourth draft pay for itself?</text><text x="26" y="77" font-size="22" fill="#526677" text-anchor="start">Expected committed tokens per complete cycle</text><rect x="26" y="99" width="402" height="133" rx="8" fill="#f4f7f9" stroke="#bdcbd6" stroke-width="1.5"/><text x="48" y="133" font-size="23" font-weight="700" fill="#16324b" text-anchor="start">3 draft tokens</text><text x="48" y="204" font-size="52" font-weight="700" fill="#16324b" text-anchor="start">3.00</text><rect x="472" y="99" width="402" height="133" rx="8" fill="#e8f4ff" stroke="#30a2ff" stroke-width="1.5"/><text x="494" y="133" font-size="23" font-weight="700" fill="#16324b" text-anchor="start">4 draft tokens</text><text x="494" y="204" font-size="52" font-weight="700" fill="#16324b" text-anchor="start">3.36</text><text x="667" y="199" font-size="24" font-weight="700" fill="#16324b" text-anchor="start">+12% output</text><text x="26" y="276" font-size="22" font-weight="700" fill="#16324b" text-anchor="start">Measure the whole cycle:</text><rect x="26" y="295" width="246" height="55" rx="8" fill="white" stroke="#bdcbd6" stroke-width="1.5"/><text x="149" y="331" font-size="24" font-weight="700" fill="#16324b" text-anchor="middle">Draft</text><rect x="327" y="295" width="246" height="55" rx="8" fill="white" stroke="#bdcbd6" stroke-width="1.5"/><text x="450" y="331" font-size="24" font-weight="700" fill="#16324b" text-anchor="middle">Verify</text><rect x="628" y="295" width="246" height="55" rx="8" fill="white" stroke="#bdcbd6" stroke-width="1.5"/><text x="751" y="331" font-size="24" font-weight="700" fill="#16324b" text-anchor="middle">Commit</text><path d="M282 323H317" stroke="#526677" stroke-width="2" marker-end="url(#arrow)"/><path d="M583 323H618" stroke="#526677" stroke-width="2" marker-end="url(#arrow)"/><rect x="26" y="378" width="848" height="74" rx="8" fill="#f2f8ff" stroke="#93c9f2" stroke-width="1.5"/><text x="450" y="409" font-size="24" font-weight="700" fill="#16324b" text-anchor="middle">The fourth draft helps only if</text><text x="450" y="438" font-size="24" font-weight="700" fill="#16324b" text-anchor="middle">complete cycle time grows by less than 12%.</text></svg>
