<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="755" viewBox="0 0 1200 755" role="img" aria-labelledby="title desc">
<title id="title">The same KDA state can expose more independent work</title>
<desc id="desc">One sequence has twelve local KDA heads. Enlarge one head state with 128 key rows and 128 value columns. A 32-value-column workgroup tile partitions a head into 4 stripes and launches 48 workgroups across 12 heads. A 4-value-column tile partitions it into 32 stripes and launches 384 workgroups. The state dimensions and mathematical update remain the same. These are launch-grid counts, not occupancy or a predicted speedup.</desc>
<defs><marker id="arrow-muted" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#526677" stroke-width="2.4"/></marker><marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#30a2ff" stroke-width="2.4"/></marker><marker id="arrow-amber" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#fdb515" stroke-width="2.4"/></marker></defs>
