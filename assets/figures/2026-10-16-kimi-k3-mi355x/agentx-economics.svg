<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="855" viewBox="0 0 1200 855" role="img" aria-labelledby="title desc">
<title id="title">Kimi K3 on AgentX: throughput and modeled economics</title>
<desc id="desc">Side-by-side bar charts compare AMD Instinct MI355X with NVIDIA HGX B300 at 30, 50 and 150 tokens per second per user. Each NVIDIA bar is normalized to 1.0 on the same zero-to-2.1 scale. At 50 the AMD curve has 24.4 percent more total-token throughput per GPU and 87.4 percent more total tokens per modeled dollar. Values interpolate separately scoped public vLLM curves; no gap is extrapolated.</desc>
<defs><marker id="arrow-muted" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#526677" stroke-width="2.4"/></marker><marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#087f77" stroke-width="2.4"/></marker><marker id="arrow-amber" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#945c00" stroke-width="2.4"/></marker></defs>
