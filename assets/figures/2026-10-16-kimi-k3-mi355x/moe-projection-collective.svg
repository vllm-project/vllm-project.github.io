<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Divide the projection, keep the same all-reduce</title>
<desc id="desc">Before: GPU A and GPU B each compute the entire routed projection [10,20,30,40]. The existing shared-expert all-reduce sums A's [1,1,1,1] and B's [3,3,3,3] to [4,4,4,4] on each GPU; each GPU then locally adds its full routed result. The routed vectors bypass this collective. After: A computes routed coordinates 1–2, [10,20], and B computes coordinates 3–4, [30,40]. They add these owned coordinates to their local shared partials, making [11,21,1,1] and [3,3,33,43]. The same existing all-reduce sums the combined partials. Both paths return [14,24,34,44] on both GPUs. Boxes show data and operations, not hardware lanes or measured timing.</desc>
