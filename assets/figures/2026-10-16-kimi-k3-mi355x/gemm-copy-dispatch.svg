<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc">
<title id="title">Prepare an input only on the path that uses it</title>
<desc id="desc">Before: a contiguous copy runs before checking skinny-kernel eligibility. If the fallback is selected, it reads the original strided input and the copy is unused. After: check eligibility first and make the copy only within the eligible skinny-kernel branch. Blue marks the same fallback execution in both panels. Arrows show dispatch order, not elapsed time.</desc>
<defs><marker id="arrow-muted" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#526677" stroke-width="2.4"/></marker><marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#30a2ff" stroke-width="2.4"/></marker><marker id="arrow-amber" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#fdb515" stroke-width="2.4"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#16324b} .title{font-size:36px;font-weight:700}.heading{font-size:28px;font-weight:700}.label{font-size:24px;font-weight:700}.small{font-size:21px}.tiny{font-size:19px}.number{font-size:48px;font-weight:700}</style>
