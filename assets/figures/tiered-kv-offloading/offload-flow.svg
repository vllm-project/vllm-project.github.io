<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" font-family="Arial, sans-serif">
  <defs>
    <filter id="shadow3" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow3" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="390" fill="#FAFBFC" rx="8"/>

  <!-- Timeline axis -->
  <line x1="100" y1="310" x2="750" y2="310" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="425" y="340" text-anchor="middle" font-size="12" fill="#6B7280">time &gt;</text>

  <!-- Swim lanes labels -->
  <text x="30" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="#4338CA" transform="rotate(-90,30,85)">Accelerator</text>
  <text x="30" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="#065F46" transform="rotate(-90,30,180)">Host</text>
  <text x="30" y="265" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E" transform="rotate(-90,30,265)">Secondary</text>

  <!-- Lane separators -->
  <line x1="60" y1="125" x2="780" y2="125" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4"/>
  <line x1="60" y1="220" x2="780" y2="220" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4"/>

  <!-- Phase 1: GPU compute -->
  <rect x="100" y="55" width="120" height="50" rx="6" fill="#EEF2FF" stroke="#818CF8" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="160" y="78" text-anchor="middle" font-size="11" font-weight="500" fill="#4338CA">KV compute</text>
  <text x="160" y="93" text-anchor="middle" font-size="10" fill="#6366F1">(inference step)</text>

  <!-- Phase 2: DMA to host -->
  <rect x="230" y="55" width="100" height="50" rx="6" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="280" y="78" text-anchor="middle" font-size="11" font-weight="500" fill="#1E40AF">DMA copy</text>
  <text x="280" y="93" text-anchor="middle" font-size="10" fill="#2563EB">to host</text>

  <!-- GPU FREED marker -->
  <line x1="340" y1="45" x2="340" y2="115" stroke="#DC2626" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="345" y="45" width="135" height="22" rx="4" fill="#FEE2E2" stroke="#FECACA" stroke-width="1"/>
  <text x="412" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">HBM freed here</text>

  <!-- Phase 3: Data in host cache -->
  <rect x="230" y="145" width="520" height="55" rx="6" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="490" y="168" text-anchor="middle" font-size="11" font-weight="500" fill="#065F46">Block cached in host (available for lookups)</text>
  <text x="490" y="185" text-anchor="middle" font-size="10" fill="#047857">Remains until evicted by LRU/ARC policy</text>

  <!-- Phase 4: Secondary tier writes (start after DMA completes) -->
  <rect x="350" y="235" width="270" height="50" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="485" y="258" text-anchor="middle" font-size="11" font-weight="500" fill="#92400E">Async cascade to secondary tiers</text>
  <text x="485" y="273" text-anchor="middle" font-size="10" fill="#A16207">FS write / S3 upload / RDMA send</text>

  <!-- Arrows -->
  <line x1="220" y1="80" x2="228" y2="80" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="280" y1="105" x2="280" y2="143" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="400" y1="200" x2="400" y2="233" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Time markers on axis -->
  <line x1="100" y1="305" x2="100" y2="315" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="230" y1="305" x2="230" y2="315" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="340" y1="305" x2="340" y2="315" stroke="#DC2626" stroke-width="1.5"/>
  <line x1="620" y1="305" x2="620" y2="315" stroke="#9CA3AF" stroke-width="1.5"/>

  <text x="100" y="328" text-anchor="middle" font-size="9" fill="#6B7280">t₀</text>
  <text x="230" y="328" text-anchor="middle" font-size="9" fill="#6B7280">t₁</text>
  <text x="340" y="328" text-anchor="middle" font-size="9" fill="#DC2626">t₂</text>
  <text x="620" y="328" text-anchor="middle" font-size="9" fill="#6B7280">t₃</text>
</svg>
