<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" font-family="Arial, sans-serif">
  <defs>
    <filter id="shadow2" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="450" fill="#FAFBFC" rx="8"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">Consolidated I/O: Many Accelerators &gt; One Host Region &gt; Secondary Tiers</text>

  <!-- Accelerator boxes -->
  <rect x="60" y="55" width="110" height="55" rx="8" fill="#EEF2FF" stroke="#818CF8" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="115" y="80" text-anchor="middle" font-size="12" font-weight="500" fill="#4338CA">GPU 0</text>
  <text x="115" y="96" text-anchor="middle" font-size="10" fill="#6366F1">KV shard 0</text>

  <rect x="195" y="55" width="110" height="55" rx="8" fill="#EEF2FF" stroke="#818CF8" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="250" y="80" text-anchor="middle" font-size="12" font-weight="500" fill="#4338CA">GPU 1</text>
  <text x="250" y="96" text-anchor="middle" font-size="10" fill="#6366F1">KV shard 1</text>

  <rect x="395" y="55" width="110" height="55" rx="8" fill="#EEF2FF" stroke="#818CF8" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="450" y="80" text-anchor="middle" font-size="12" font-weight="500" fill="#4338CA">GPU 6</text>
  <text x="450" y="96" text-anchor="middle" font-size="10" fill="#6366F1">KV shard 6</text>

  <rect x="530" y="55" width="110" height="55" rx="8" fill="#EEF2FF" stroke="#818CF8" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="585" y="80" text-anchor="middle" font-size="12" font-weight="500" fill="#4338CA">GPU 7</text>
  <text x="585" y="96" text-anchor="middle" font-size="10" fill="#6366F1">KV shard 7</text>

  <!-- Ellipsis -->
  <text x="350" y="87" text-anchor="middle" font-size="20" fill="#9CA3AF">. . .</text>

  <!-- Arrows from GPUs to host -->
  <line x1="115" y1="110" x2="350" y2="170" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="250" y1="110" x2="350" y2="170" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="450" y1="110" x2="350" y2="170" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="585" y1="110" x2="350" y2="170" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Fan-in label -->
  <text x="530" y="148" font-size="11" fill="#6B7280" font-style="italic">fan-in (PCIe)</text>

  <!-- Shared Host Region -->
  <rect x="150" y="175" width="400" height="65" rx="10" fill="#ECFDF5" stroke="#34D399" stroke-width="2" filter="url(#shadow2)"/>
  <text x="350" y="203" text-anchor="middle" font-size="14" font-weight="600" fill="#065F46">Shared Host Region</text>
  <text x="350" y="225" text-anchor="middle" font-size="11" fill="#047857">All shards consolidated | mmap-backed | shared across workers</text>

  <!-- Arrow from host to secondary tiers -->
  <line x1="350" y1="240" x2="350" y2="290" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Comparison box -->
  <rect x="75" y="295" width="270" height="100" rx="8" fill="#FEE2E2" stroke="#F87171" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="210" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#991B1B">Without consolidation</text>
  <text x="210" y="342" text-anchor="middle" font-size="11" fill="#B91C1C">8 accelerators x N blocks each</text>
  <text x="210" y="360" text-anchor="middle" font-size="11" fill="#B91C1C">= 8N small I/O operations</text>
  <text x="210" y="380" text-anchor="middle" font-size="11" fill="#991B1B">High IOPS, small transfer sizes</text>

  <rect x="355" y="295" width="270" height="100" rx="8" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="490" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">With consolidation</text>
  <text x="490" y="342" text-anchor="middle" font-size="11" fill="#047857">1 region x N blocks (all shards merged)</text>
  <text x="490" y="360" text-anchor="middle" font-size="11" fill="#047857">= N larger I/O operations</text>
  <text x="490" y="380" text-anchor="middle" font-size="11" fill="#047857">Fewer ops, better throughput</text>
</svg>
