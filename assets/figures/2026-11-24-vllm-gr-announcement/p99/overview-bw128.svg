<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="617" viewBox="0 0 1040 617" font-family="Open Sans, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">P99 latency at batch sizes 1, 4 and 8</title><desc id="d">Each bar shows the reported P99 latency in milliseconds at 1,024 input tokens and beam width 128. L20 values come from the per-backend L20 P99 measurement CSVs. RTX PRO 6000 values are from the November 21–22, 2026 OneRec-1.7B run (48 timed batches per configuration). A2 values come from the per-backend P99 benchmark summaries. Other batch size 1 values use the accelerator slides in the P99 benchmark deck. Other historical values are from candanzg/vllm-gr-doc at a6e4c5f9c2ce0ed95f8c1db9333bb7251f604645. The batch-1 axis spans 0 to 300 ms. Both larger batches span 0 to 1,800 ms. On the Ascend NPU platforms (A2 and A5), vLLM-GR and xLLM used a catalog constraint table.</desc><rect x="0" y="0" width="1040" height="617" fill="white"/><text x="24" y="43" font-size="30" fill="#192F3D" font-weight="700">P99 latency at batch sizes 1, 4 and 8</text><text x="25" y="72" font-size="17" fill="#465B69">1,024 input tokens   ·   Beam width 128   ·   P99 in milliseconds, lower is better</text><rect x="26" y="95" width="18" height="8" fill="#AD2876"/><text x="52" y="104" font-size="14" fill="#192F3D">vLLM-GR</text><rect x="129" y="95" width="18" height="8" fill="#165ED6"/><text x="155" y="104" font-size="14" fill="#192F3D">SGLang</text><rect x="227" y="95" width="18" height="8" fill="#008A7D"/><text x="253" y="104" font-size="14" fill="#192F3D">NVIDIA SID-GR</text><rect x="384" y="95" width="18" height="8" fill="#343A40"/><text x="410" y="104" font-size="14" fill="#192F3D">xLLM</text><text x="1016" y="104" font-size="12.5" fill="#465B69" text-anchor="end">On the Ascend NPU platforms (A2 and A5), vLLM-GR and xLLM used a catalog constraint table.</text><text x="143" y="143" font-size="18" fill="#192F3D" font-weight="700">Batch size 1</text><t