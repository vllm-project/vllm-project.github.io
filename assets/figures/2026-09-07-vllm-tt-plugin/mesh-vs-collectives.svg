<text x="660" y="580" class="t" font-size="13" text-anchor="middle">32 Wormhole chips. The fabric moves</text>
<text x="660" y="601" class="t" font-size="13" text-anchor="middle">data between chips as part of the</text>
<text x="660" y="622" class="t" font-size="13" text-anchor="middle">program, not as a host-issued call.</text>
<text x="480" y="742" class="t-mut" font-size="13.5" text-anchor="middle">So there are no TP or PP ranks to configure: the mesh shape is the parallelism,</text>
<text x="480" y="762" class="t-mut" font-size="13.5" text-anchor="middle">and the model code picks the layout that fits a given (model, mesh) pair.</text>
