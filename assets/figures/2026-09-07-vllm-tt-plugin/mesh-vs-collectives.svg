<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" width="960" height="780" role="img" aria-labelledby="f1t f1d">
<title id="f1t">Host-issued collectives versus a compiled mesh program</title>
<desc id="f1d">Top: a host issues all-reduce and all-gather collectives to four GPUs on every layer. Bottom: a Tenstorrent Galaxy of 32 chips is one compiled and traced mesh program; the fabric moves data between chips inside the program, and the host only submits and reads once per step.</desc>

  <style>
