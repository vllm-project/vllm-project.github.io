<text x="385.0" y="119.0" class="acc-f" font-size="12" text-anchor="middle" font-weight="600">chunk 2</text>
<rect x="341" y="129" width="88" height="35" rx="4" class="acc2-mid" stroke-width="1.1"/>
<text x="385.0" y="151.0" class="acc2-f" font-size="12" text-anchor="middle" font-weight="600">decode</text>
<rect x="435" y="100" width="88" height="29" rx="4" class="acc-mid" stroke-width="1.1"/>
<text x="479.0" y="119.0" class="acc-f" font-size="12" text-anchor="middle" font-weight="600">chunk 3</text>
<rect x="435" y="129" width="88" height="35" rx="4" class="acc2-mid" stroke-width="1.1"/>
<text x="479.0" y="151.0" class="acc2-f" font-size="12" text-anchor="middle" font-weight="600">decode</text>
<rect x="529" y="100" width="88" height="29" rx="4" class="acc-mid" stroke-width="1.1"/>
<text x="573.0" y="119.0" class="acc-f" font-size="12" text-anchor="middle" font-weight="600">chunk 4</text>
<rect x="529" y="129" width="88" height="35" rx="4" class="acc2-mid" stroke-width="1.1"/>
<text x="573.0" y="151.0" class="acc2-f" font-size="12" text-anchor="middle" font-weight="600">decode</text>
<rect x="623" y="100" width="70" height="64" rx="4" class="acc2-mid" stroke-width="1.1"/><text x="658.0" y="136.2" class="acc2-f" font-size="12" text-anchor="middle" font-weight="600">decode</text>
<rect x="699" y="100" width="70" height="64" rx="4" class="acc2-mid" stroke-width="1.1"/><text x="734.0" y="136.2" class="acc2-f" font-size="12" text-anchor="middle" font-weight="600">decode</text>
<rect x="775" y="100" width="70" height="64" rx="4" class="acc2-mid" stroke-width="1.1"/><text x="810.0" y="136.2" class="acc2-f" font-size="12" text-anchor="middle" font-weight="600">decode</text>
<text x="20" y="182" class="t-mut" font-size="13" text-anchor="start">Prompt B is chunked over four steps, and requests A and C keep decoding inside those same steps.</text>
<text x="20" y="212" class="t" font-size="15" text-anchor="start" font-weight="600">Tenstorrent — each step is all-prefill or all-decode</text>
<rect x="95" y="224" width="70" height="64" rx="4" class="acc2-mid" stroke-width="1.1"/><text x="130.0" y="260.2" class="acc2-f" font-size="12" text-anchor="middle" font-weight="600">decode</text>
<rect x="171" y="224" width="70" height="64" rx="4" class="acc2-mid" stroke-width="1.1"/><text x="206.0" y="260.2" class="acc2-f" font-size="12" text-anchor="middle" font-weight="600">decode</text>
<rect x="247" y="224" width="64" height="64" rx="4" class="acc-mid" stroke-width="1.1"/><text x="279.0" y="260.2" class="acc-f" font-size="12" text-anchor="middle" font-weight="600">chunk 1</text>
<rect x="317" y="224" width="70" height="64" rx="4" class="acc2-mid" stroke-width="1.1"/><text x="352.0" y="260.2" class="acc2-f" font-size="12" text-anchor="middle" font-weight="600">decode</text>
<rect x="393" y="224" width="64" height="64" rx="4" class="acc-mid" stroke-width="1.1"/><text x="425.0" y="260.2" class="acc-f" font-size="12" text-anchor="middle" font-weight="600">chunk 2</text>
<rect x="463" y="224" width="70" height="64" rx="4" class="acc2-mid" stroke-width="1.1"/><text x="498.0" y="260.2" class="acc2-f" font-size="12" text-anchor="middle" font-weight="600">decode</text>
<rect x="539" y="224" width="64" height="64" rx="4" class="acc-mid" stroke-width="1.1"/><text x="571.0" y="260.2" class="acc-f" font-size="12" text-anchor="middle" font-weight="600">chunk 3</text>
<rect x="609" y="224" width="70" height="64" rx="4" class="acc2-mid" stroke-width="1.1"/><text x="644.0" y="260.2" class="acc2-f" font-size="12" text-anchor="middle" font-weight="600">decode</text>
<rect x="685" y="224" width="64" height="64" rx="4" class="acc-mid" stroke-width="1.1"/><text x="717.0" y="260.2" class="acc-f" font-size="12" text-anchor="middle" font-weight="600">chunk 4</text>
<rect x="755" y="224" width="70" height="64" rx="4" class="acc2-mid" stroke-width="1.1"/><text x="790.0" y="260.2" class="acc2-f" font-size="12" text-anchor="middle" font-weight="600">decode</text>
<rect x="831" y="224" width="70" height="64" rx="4" class="acc2-mid" stroke-width="1.1"/><text x="866.0" y="260.2" class="acc2-f" font-size="12" text-anchor="middle" font-weight="600">decode</text>
<path d="M247,293 L247,299 L749,299 L749,293" class="acc2-s" stroke-width="1.3" fill="none"/><text x="498.0" y="312" class="acc2-f" font-size="12.5" text-anchor="middle" font-weight="600">requests A and C keep decoding between chunks</text>
<line x1="247" y1="94" x2="247" y2="293" class="ln" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="254" y="72" class="t-mut" font-size="12" text-anchor="start">long prompt B arrives</text>
<text x="901" y="72" class="t-mut" font-size="12" text-anchor="end">time →</text>
<text x="20" y="346" class="t" font-size="13.5" text-anchor="start">The constraint buys a stable, traceable shape for every step; versus upstream, prefill and decode interleave at whole-step granularity.</text>
<text x="20" y="368" class="t-mut" font-size="13" text-anchor="start">Step widths and the interleave cadence are schematic.</text>
</svg>