<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 388" width="960" height="388" role="img" aria-labelledby="f3t f3d">
<title id="f3t">Token-budget steps versus phase-homogeneous steps</title>
<desc id="f3d">Upstream vLLM spreads a long prompt across four chunked steps while other requests keep decoding in those same steps. The Tenstorrent scheduler runs the same chunks as prefill-only steps and interleaves decode-only steps between them, so in-flight requests keep advancing.</desc>

  <style>
    .bg-panel  { fill: #f6f6fb; stroke: #d9d9e8; }
    .bg-box    { fill: #ffffff; stroke: #c3c3d6; }
    .idle      { fill: #eeeef4; stroke: #b6b6c8; }
    .t         { fill: #16162a; font-family: ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; }
    .t-mut     { fill: #5c5c78; font-family: ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; }
    .ln        { stroke: #9a9ab4; fill: none; }
    .ln-div    { stroke: #d2d2e2; fill: none; }
    .acc-s     { stroke: #6C5CE7; fill: none; }
    .acc-f     { fill: #6C5CE7; }
    .acc-soft  { fill: #ece9fd; stroke: #6C5CE7; }
    .acc-mid   { fill: #d8d2fb; stroke: #6C5CE7; }
    .fab       { stroke: #6C5CE7; opacity: 0.8; fill: none; }
    .acc2-s    { stroke: #0E8A7D; fill: none; }
    .acc2-f    { fill: #0E8A7D; }
    .acc2-soft { fill: #e2f4f1; stroke: #0E8A7D; }
    .acc2-mid  { fill: #c6e9e3; stroke: #0E8A7D; }
    .warn-f    { fill: #C2410C; }
    .warn-s    { stroke: #C2410C; fill: none; }
    .warn-soft { fill: #fdeee4; stroke: #C2410C; }
    .ah        { fill: #9a9ab4; }
    .ah-acc    { fill: #6C5CE7; }
    .ah-acc2   { fill: #0E8A7D; }
    .ah-warn   { fill: #C2410C; }
    @media (prefers-color-scheme: dark) {
      .bg-panel  { fill: #1b1b2b; stroke: #34344a; }
      .bg-box    { fill: #23233a; stroke: #45455e; }
      .idle      { fill: #26263a; stroke: #4b4b62; }
      .t         { fill: #e9e9f2; }
      .t-mut     { fill: #a2a2bd; }
      .ln        { stroke: #6a6a86; }
      .ln-div    { stroke: #3a3a52; }
      .acc-s     { stroke: #A29BFE; }
      .acc-f     { fill: #A29BFE; }
      .acc-soft  { fill: #2e2b52; stroke: #A29BFE; }
      .acc-mid   { fill: #423a78; stroke: #A29BFE; }
      .fab       { stroke: #A29BFE; opacity: 1; }
      .acc2-s    { stroke: #4ECDC4; }
      .acc2-f    { fill: #4ECDC4; }
      .acc2-soft { fill: #1d3a3a; stroke: #4ECDC4; }
      .acc2-mid  { fill: #27514e; stroke: #4ECDC4; }
      .warn-f    { fill: #FB923C; }
      .warn-s    { stroke: #FB923C; }
      .warn-soft { fill: #3a2a1c; stroke: #FB923C; }
      .ah        { fill: #6a6a86; }
      .ah-acc    { fill: #A29BFE; }
      .ah-acc2   { fill: #4ECDC4; }
      .ah-warn   { fill: #FB923C; }
    }
  </style>

<text x="20" y="30" class="t" font-size="17" text-anchor="start" font-weight="700">One long prompt, two scheduling models</text>
<rect x="600" y="19" width="15" height="11" rx="2.5" class="acc-mid" stroke-width="1.1"/><text x="621" y="28.5" class="t-mut" font-size="12.5" text-anchor="start">prefill work</text>
<rect x="736" y="19" width="15" height="11" rx="2.5" class="acc2-mid" stroke-width="1.1"/><text x="757" y="28.5" class="t-mut" font-size="12.5" text-anchor="start">decode work</text>
<text x="20" y="88" class="t" font-size="15" text-anchor="start" font-weight="600">Upstream vLLM — token-budget steps</text>
<rect x="95" y="100" width="70" height="64" rx="4" class="acc2-mid" stroke-width="1.1"/><text x="130.0" y="136.2" class="acc2-f" font-size="12" text-anchor="middle" font-weight="600">decode</text>
<rect x="171" y="100" width="70" height="64" rx="4" class="acc2-mid" stroke-width="1.1"/><text x="206.0" y="136.2" class="acc2-f" font-size="12" text-anchor="middle" font-weight="600">decode</text>
