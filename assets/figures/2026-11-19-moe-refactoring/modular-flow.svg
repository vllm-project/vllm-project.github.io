<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The modular MoE execution path</title>
  <desc id="desc">The router provides top-k expert IDs and weights. Inside FusedMoEKernel, prepare handles activations and dispatch, experts perform feed-forward computation, and finalize completes delegated aggregation and combine. Routing weights are applied exactly once; cross-rank reduction is a separate contract.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="630" rx="20" fill="#f8fafc"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="60" y="58" font-size="32" font-weight="700" fill="#0f172a">The modular execution path</text>
    <rect x="70" y="104" width="310" height="88" rx="14" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/>
    <text x="225" y="142" text-anchor="middle" font-size="27" font-weight="700" fill="#312e81">Router</text>
    <text x="225" y="174" text-anchor="middle" font-size="18" fill="#3730a3">Select experts for each token</text>
    <path d="M225 192 V307" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="248" y="224" font-size="18" fill="#475569">Top-k IDs + weights</text>
    <rect x="40" y="254" width="1120" height="275" rx="18" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="1130" y="286" text-anchor="end" font-size="21" font-weight="700" fill="#475569">FusedMoEKernel</text>
    <rect x="70" y="320" width="310" height="154" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="225" y="365" text-anchor="middle" font-size="29" font-weight="700" fill="#0c4a6e">Prepare</text>
    <text x="225" y="404" text-anchor="middle" font-size="17" fill="#0c4a6e">Activations + dispatch metadata</text>
    <text x="225" y="435" text-anchor="middle" font-size="17" fill="#0c4a6e">Dispatch; quantize if owned here</text>
    <path d="M380 397 H431" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="445" y="320" width="310" height="154" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="600" y="365" text-anchor="middle" font-size="29" font-weight="700" fill="#9a3412">Experts</text>
    <text x="600" y="404" text-anchor="middle" font-size="17" fill="#9a3412">Expert feed-forward computation</text>
    <text x="600" y="435" text-anchor="middle" font-size="17" fill="#9a3412">Layout and workspace contracts</text>
    <path d="M755 397 H806" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="820" y="320" width="310" height="154" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="975" y="365" text-anchor="middle" font-size="29" font-weight="700" fill="#0c4a6e">Finalize</text>
    <text x="975" y="404" text-anchor="middle" font-size="17" fill="#0c4a6e">Weight / reduce if delegated</text>
    <text x="975" y="435" text-anchor="middle" font-size="17" fill="#0c4a6e">Combine token results</text>
    <text x="600" y="568" text-anchor="middle" font-size="21" fill="#334155">Apply routing weights exactly once.</text>
    <text x="600" y="601" text-anchor="middle" font-size="19" fill="#475569">Cross-rank reduction is a separate contract.</text>
  </g>
</svg>
