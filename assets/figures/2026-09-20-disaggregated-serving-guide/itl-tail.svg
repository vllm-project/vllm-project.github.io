<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="tailt taild" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id="tailt">p99 inter-token latency against offered load, collocated versus P/D</title>
<desc id="taild">Lines of p99 and median ITL in milliseconds against offered load from 0.2 to 2 req/s. Collocated p99 is 23 ms at 0.2 req/s, jumps to 169 ms at 0.4 req/s and climbs to 263 ms at 2 req/s. P/D p99 is 25 ms at 0.2 req/s, 29 ms at 0.4 req/s and stays under 52 ms across the sweep. Median ITL is 21 to 24 ms for both setups up to 1 req/s. Above that collocated rises to 41 ms and P/D to 30 ms at 2 req/s.</desc>

  <style>
    .bg     { fill: #ffffff; }
    .t      { fill: #16162a; }
    .t-mut  { fill: #5c5c78; }
    .grid   { stroke: #e6e6f0; fill: none; }
    .axis   { stroke: #9a9ab4; fill: none; }
    .ref    { stroke: #9a9ab4; fill: none; stroke-dasharray: 5 4; }
    .c-f    { fill: #6C5CE7; }
    .c-s    { stroke: #6C5CE7; fill: none; }
    .p-f    { fill: #0D9488; }
    .p-s    { stroke: #0D9488; fill: none; }
    .ring   { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg     { fill: #161622; }
      .t      { fill: #e9e9f2; }
      .t-mut  { fill: #a2a2bd; }
      .grid   { stroke: #2a2a3e; }
      .axis   { stroke: #6a6a86; }
      .ref    { stroke: #6a6a86; }
      .c-f    { fill: #8B82F0; }
      .c-s    { stroke: #8B82F0; }
      .p-f    { fill: #1FA89C; }
      .p-s    { stroke: #1FA89C; }
      .ring   { stroke: #161622; }
    }
  </style>
  <rect width="960" height="420" class="bg"/>
  <text x="20.0" y="34.0" class="t" font-size="18" text-anchor="start" font-weight="700">Similar median, very different tail</text>
  <text x="20.0" y="58.0" class="t-mut" font-size="14" text-anchor="start">Inter-token latency (ms) · Qwen2.5-7B-Instruct, 8K-token prompts, 256 output tokens, 2× L40S</text>
  <rect x="20" y="78" width="12" height="12" rx="2" class="c-f"/>
  <text x="38.0" y="88.0" class="t-mut" font-size="14" text-anchor="start">Collocated (DP=2)</text>
  <rect x="180" y="78" width="12" height="12" rx="2" class="p-f"/>
  <text x="198.0" y="88.0" class="t-mut" font-size="14" text-anchor="start">P/D (1P + 1D, NIXL)</text>
  <line x1="380" y1="83" x2="404" y2="83" class="axis" stroke-width="2"/>
  <text x="410.0" y="88.0" class="t-mut" font-size="14" text-anchor="start">p99</text>
  <line x1="460" y1="83" x2="484" y2="83" class="ref" stroke-width="2"/>
  <text x="490.0" y="88.0" class="t-mut" font-size="14" text-anchor="start">median</text>
  <line x1="80" y1="340.0" x2="890" y2="340.0" class="axis"/>
  <text x="70.0" y="345.0" class="t-mut" font-size="13" text-anchor="end">0</text>
  <line x1="80" y1="263.3" x2="890" y2="263.3" class="grid"/>
  <text x="70.0" y="268.3" class="t-mut" font-size="13" text-anchor="end">100</text>
  <line x1="80" y1="186.7" x2="890" y2="186.7" class="grid"/>
  <text x="70.0" y="191.7" class="t-mut" font-size="13" text-anchor="end">200</text>
  <line x1="80" y1="110.0" x2="890" y2="110.0" class="grid"/>
  <text x="70.0" y="115.0" class="t-mut" font-size="13" text-anchor="end">300</text>
  <text x="282.5" y="362.0" class="t-mut" font-size="13" text-anchor="middle">0.5</text>
