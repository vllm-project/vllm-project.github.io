<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="tailt taild" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id="tailt">p99 inter-token latency, collocated versus P/D</title>
<desc id="taild">Grouped bars of p99 ITL in milliseconds. At 0.2 req/s: collocated 23, P/D 25. At 0.4 req/s: collocated 169, P/D 29. At 0.6 req/s: collocated 182, P/D 30. Median ITL is 21 to 24 ms for both setups at every rate.</desc>

  <style>
    .bg     { fill: #ffffff; }
    .t      { fill: #16162a; }
    .t-mut  { fill: #5c5c78; }
    .grid   { stroke: #e6e6f0; fill: none; }
    .axis   { stroke: #9a9ab4; fill: none; }
    .ref    { stroke: #9a9ab4; fill: none; stroke-dasharray: 5 4; }
    .c-f    { fill: #6C5CE7; }
    .c-s    { stroke: #6C5CE7; fill: none; }
    .p-f    { fill: #0D9488; }
    .p-s    { stroke: #0D9488; fill: none; }
    .ring   { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg     { fill: #161622; }
      .t      { fill: #e9e9f2; }
      .t-mut  { fill: #a2a2bd; }
      .grid   { stroke: #2a2a3e; }
      .axis   { stroke: #6a6a86; }
      .ref    { stroke: #6a6a86; }
      .c-f    { fill: #8B82F0; }
      .c-s    { stroke: #8B82F0; }
      .p-f    { fill: #1FA89C; }
      .p-s    { stroke: #1FA89C; }
      .ring   { stroke: #161622; }
    }
  </style>
  <rect width="960" height="400" class="bg"/>
  <text x="20.0" y="34.0" class="t" font-size="18" text-anchor="start" font-weight="700">Same median, very different tail</text>
  <text x="20.0" y="58.0" class="t-mut" font-size="14" text-anchor="start">p99 inter-token latency (ms) · Qwen2.5-7B-Instruct, 8K-token prompts, 256 output tokens, 2× L40S</text>
  <rect x="20" y="78" width="12" height="12" rx="2" class="c-f"/>
  <text x="38.0" y="88.0" class="t-mut" font-size="14" text-anchor="start">Collocated (DP=2)</text>
  <rect x="180" y="78" width="12" height="12" rx="2" class="p-f"/>
  <text x="198.0" y="88.0" class="t-mut" font-size="14" text-anchor="start">P/D (1P + 1D, NIXL)</text>
  <line x1="80" y1="340.0" x2="940" y2="340.0" class="axis"/>
  <text x="70.0" y="345.0" class="t-mut" font-size="13" text-anchor="end">0</text>
  <line x1="80" y1="282.5" x2="940" y2="282.5" class="grid"/>
  <text x="70.0" y="287.5" class="t-mut" font-size="13" text-anchor="end">50</text>
  <line x1="80" y1="225.0" x2="940" y2="225.0" class="grid"/>
  <text x="70.0" y="230.0" class="t-mut" font-size="13" text-anchor="end">100</text>
  <line x1="80" y1="167.5" x2="940" y2="167.5" class="grid"/>
  <text x="70.0" y="172.5" class="t-mut" font-size="13" text-anchor="end">150</text>
  <line x1="80" y1="110.0" x2="940" y2="110.0" class="grid"/>
  <text x="70.0" y="115.0" class="t-mut" font-size="13" text-anchor="end">200</text>
  <line x1="80" y1="314.7" x2="940" y2="314.7" class="ref" stroke-width="1.5"/>
  <text x="940.0" y="304.7" class="t-mut" font-size="13" text-anchor="end">median ITL, both setups</text>
  <text x="940.0" y="286.7" class="t" font-size="13" text-anchor="end" font-weight="600">21–24 ms</text>
  <path d="M128.3,340.0 V317.6 Q128.3,313.6 132.3,313.6 H188.3 Q192.3,313.6 192.3,317.6 V340.0 Z" class="c-f"/>
  <text x="160.3" y="305.6" class="t" font-size="14" text-anchor="middle" font-weight="600">23</text>
  <path d="M194.3,340.0 V315.2 Q194.3,311.2 198.3,311.2 H254.3 Q258.3,311.2 258.3,315.2 V340.0 Z" class="p-f"/>
  <text x="226.3" y="303.2" class="t" font-size="14" text-anchor="middle" font-weight="600">25</text>
  <text x="193.3" y="364.0" class="t-mut" font-size="14" text-anchor="middle">0.2 req/s</text>
  <path d="M355.0,340.0 V149.7 Q355.0,145.7 359.0,145.7 H415.0 Q419.0,145.7 419.0,149.7 V340.0 Z" class="c-f"/>
  <text x="387.0" y="137.7" class="t" font-size="14" text-anchor="middle" font-weight="600">169</text>
  <path d="M421.0,340.0 V310.6 Q421.0,306.6 425.0,306.6 H481.0 Q485.0,306.6 485.0,310.6 V340.0 Z" class="p-f"/>
  <text x="453.0" y="298.6" class="t" font-size="14" text-anchor="middle" font-weight="600">29</text>
  <text x="420.0" y="364.0" class="t-mut" font-size="14" text-anchor="middle">0.4 req/s</text>
  <path d="M581.7,340.0 V134.7 Q581.7,130.7 585.7,130.7 H641.7 Q645.7,130.7 645.7,134.7 V340.0 Z" class="c-f"/>
  <text x="613.7" y="122.7" class="t" font-size="14" text-anchor="middle" font-weight="600">182</text>
  <path d="M647.7,340.0 V309.5 Q647.7,305.5 651.7,305.5 H707.7 Q711.7,305.5 711.7,309.5 V340.0 Z" class="p-f"/>
  <text x="679.7" y="297.5" class="t" font-size="14" text-anchor="middle" font-weight="600">30</text>
  <text x="646.7" y="364.0" class="t-mut" font-size="14" text-anchor="middle">0.6 req/s</text>
</svg>
