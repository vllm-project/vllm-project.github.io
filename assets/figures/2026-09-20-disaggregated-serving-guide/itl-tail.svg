  <circle cx="890.0" cy="302.1" r="4" class="p-f ring" stroke-width="2"/>
  <text x="242.0" y="200.7" class="t" font-size="14" text-anchor="middle" font-weight="600">169</text>
  <text x="242.0" y="307.5" class="t" font-size="14" text-anchor="middle" font-weight="600">29</text>
  <text x="902.0" y="143.1" class="t" font-size="14" text-anchor="start" font-weight="600">263</text>
  <text x="902.0" y="307.1" class="t" font-size="14" text-anchor="start" font-weight="600">50</text>
