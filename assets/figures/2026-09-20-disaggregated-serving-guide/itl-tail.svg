  <circle cx="890.0" cy="138.1" r="4" class="c-f ring" stroke-width="2"/>
  <polyline points="161.0,321.0 242.0,317.5 323.0,317.4 404.0,311.9 485.0,306.3 566.0,301.4 647.0,300.3 728.0,302.2 890.0,302.1" class="p-s" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="161.0" cy="321.0" r="4" class="p-f ring" stroke-width="2"/>
  <circle cx="242.0" cy="317.5" r="4" class="p-f ring" stroke-width="2"/>
