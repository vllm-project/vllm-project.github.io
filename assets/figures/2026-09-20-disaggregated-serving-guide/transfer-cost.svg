  <circle cx="308.0" cy="280.7" r="4" class="c-f ring" stroke-width="2"/>
  <circle cx="341.0" cy="264.2" r="4" class="c-f ring" stroke-width="2"/>
  <circle cx="374.0" cy="249.4" r="4" class="c-f ring" stroke-width="2"/>
  <circle cx="440.0" cy="233.7" r="4" class="c-f ring" stroke-width="2"/>
  <text x="450.0" y="238.7" class="t" font-size="13" text-anchor="start" font-weight="600">Collocated</text>
  <polyline points="143.0,378.8 176.0,358.1 209.0,339.9 242.0,327.7 275.0,323.8 308.0,323.4 341.0,322.6 374.0,322.2 440.0,323.0" class="p-s" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="143.0" cy="378.8" r="4" class="p-f ring" stroke-width="2"/>
  <circle cx="176.0" cy="358.1" r="4" class="p-f ring" stroke-width="2"/>
  <circle cx="209.0" cy="339.9" r="4" class="p-f ring" stroke-width="2"/>
  <circle cx="242.0" cy="327.7" r="4" class="p-f ring" stroke-width="2"/>
  <circle cx="275.0" cy="323.8" r="4" class="p-f ring" stroke-width="2"/>
  <circle cx="308.0" cy="323.4" r="4" class="p-f ring" stroke-width="2"/>
  <circle cx="341.0" cy="322.6" r="4" class="p-f ring" stroke-width="2"/>
  <circle cx="374.0" cy="322.2" r="4" class="p-f ring" stroke-width="2"/>
  <circle cx="440.0" cy="323.0" r="4" class="p-f ring" stroke-width="2"/>
  <text x="450.0" y="328.0" class="t" font-size="13" text-anchor="start" font-weight="600">P/D ~182</text>
  <text x="540.0" y="136.0" class="t" font-size="15" text-anchor="start" font-weight="700">Goodput</text>
  <text x="540.0" y="156.0" class="t-mut" font-size="13" text-anchor="start">req/s meeting TTFT &lt; 2 s and TPOT &lt; 30 ms</text>
  <line x1="590" y1="400.0" x2="920" y2="400.0" class="axis"/>
  <text x="580.0" y="405.0" class="t-mut" font-size="13" text-anchor="end">0.0</text>
  <line x1="590" y1="356.0" x2="920" y2="356.0" class="grid"/>
  <text x="580.0" y="361.0" class="t-mut" font-size="13" text-anchor="end">0.1</text>
  <line x1="590" y1="312.0" x2="920" y2="312.0" class="grid"/>
  <text x="580.0" y="317.0" class="t-mut" font-size="13" text-anchor="end">0.2</text>
  <line x1="590" y1="268.0" x2="920" y2="268.0" class="grid"/>
  <text x="580.0" y="273.0" class="t-mut" font-size="13" text-anchor="end">0.3</text>
  <line x1="590" y1="224.0" x2="920" y2="224.0" class="grid"/>
  <text x="580.0" y="229.0" class="t-mut" font-size="13" text-anchor="end">0.4</text>
  <line x1="590" y1="180.0" x2="920" y2="180.0" class="grid"/>
  <text x="580.0" y="185.0" class="t-mut" font-size="13" text-anchor="end">0.5</text>
  <text x="672.5" y="422.0" class="t-mut" font-size="13" text-anchor="middle">0.5</text>
  <text x="755.0" y="422.0" class="t-mut" font-size="13" text-anchor="middle">1</text>
  <text x="837.5" y="422.0" class="t-mut" font-size="13" text-anchor="middle">1.5</text>
  <text x="920.0" y="422.0" class="t-mut" font-size="13" text-anchor="middle">2</text>
  <text x="755.0" y="444.0" class="t-mut" font-size="13" text-anchor="middle">offered load (req/s)</text>
