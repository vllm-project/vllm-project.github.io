  <circle cx="854.0" cy="386.8" r="4" class="c-f ring" stroke-width="2"/>
  <circle cx="920.0" cy="400.0" r="4" class="c-f ring" stroke-width="2"/>
  <text x="782.0" y="196.8" class="t" font-size="13" text-anchor="end" font-weight="600">Collocated 0.43</text>
  <polyline points="623.0,386.8 656.0,382.4 689.0,391.2 722.0,395.6 755.0,400.0 788.0,400.0 821.0,400.0 854.0,400.0 920.0,400.0" class="p-s" stroke-width="2" stroke-linejoin="round"/>
