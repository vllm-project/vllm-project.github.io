<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="costt costd" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id="costt">Output throughput and goodput, collocated versus P/D</title>
<desc id="costd">Left: output tokens per second against offered load from 0.2 to 2 req/s. Collocated tracks the offered load up to 393 tok/s at 2 req/s. P/D flattens at about 182 tok/s from 0.8 req/s, about 0.7 req/s of requests. Right: goodput with TTFT under 2 s and TPOT under 30 ms. Collocated peaks at 0.43 req/s at 0.6 to 0.8 req/s and falls to zero by 2 req/s. P/D never exceeds 0.04 req/s.</desc>

  <style>
    .bg     { fill: #ffffff; }
    .t      { fill: #16162a; }
    .t-mut  { fill: #5c5c78; }
    .grid   { stroke: #e6e6f0; fill: none; }
    .axis   { stroke: #9a9ab4; fill: none; }
    .ref    { stroke: #9a9ab4; fill: none; stroke-dasharray: 5 4; }
    .c-f    { fill: #6C5CE7; }
    .c-s    { stroke: #6C5CE7; fill: none; }
    .p-f    { fill: #0D9488; }
    .p-s    { stroke: #0D9488; fill: none; }
    .ring   { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg     { fill: #161622; }
      .t      { fill: #e9e9f2; }
      .t-mut  { fill: #a2a2bd; }
      .grid   { stroke: #2a2a3e; }
      .axis   { stroke: #6a6a86; }
      .ref    { stroke: #6a6a86; }
      .c-f    { fill: #8B82F0; }
      .c-s    { stroke: #8B82F0; }
      .p-f    { fill: #1FA89C; }
      .p-s    { stroke: #1FA89C; }
      .ring   { stroke: #161622; }
    }
  </style>
  <rect width="960" height="470" class="bg"/>
  <text x="20.0" y="34.0" class="t" font-size="18" text-anchor="start" font-weight="700">A slow KV transfer caps P/D</text>
  <text x="20.0" y="58.0" class="t-mut" font-size="14" text-anchor="start">Same setup · every P/D request moves ~470 MB of KV cache through host memory (~1.3 s each)</text>
  <rect x="20" y="78" width="12" height="12" rx="2" class="c-f"/>
  <text x="38.0" y="88.0" class="t-mut" font-size="14" text-anchor="start">Collocated (DP=2)</text>
  <rect x="180" y="78" width="12" height="12" rx="2" class="p-f"/>
  <text x="198.0" y="88.0" class="t-mut" font-size="14" text-anchor="start">P/D (1P + 1D, NIXL)</text>
  <text x="60.0" y="136.0" class="t" font-size="15" text-anchor="start" font-weight="700">Output throughput</text>
  <text x="60.0" y="156.0" class="t-mut" font-size="13" text-anchor="start">tokens/s</text>
  <line x1="110" y1="400.0" x2="440" y2="400.0" class="axis"/>
  <text x="100.0" y="405.0" class="t-mut" font-size="13" text-anchor="end">0</text>
  <line x1="110" y1="357.7" x2="440" y2="357.7" class="grid"/>
  <text x="100.0" y="362.7" class="t-mut" font-size="13" text-anchor="end">100</text>
  <line x1="110" y1="315.4" x2="440" y2="315.4" class="grid"/>
  <text x="100.0" y="320.4" class="t-mut" font-size="13" text-anchor="end">200</text>
  <line x1="110" y1="273.1" x2="440" y2="273.1" class="grid"/>
  <text x="100.0" y="278.1" class="t-mut" font-size="13" text-anchor="end">300</text>
  <line x1="110" y1="230.8" x2="440" y2="230.8" class="grid"/>
  <text x="100.0" y="235.8" class="t-mut" font-size="13" text-anchor="end">400</text>
  <line x1="110" y1="188.5" x2="440" y2="188.5" class="grid"/>
  <text x="100.0" y="193.5" class="t-mut" font-size="13" text-anchor="end">500</text>
