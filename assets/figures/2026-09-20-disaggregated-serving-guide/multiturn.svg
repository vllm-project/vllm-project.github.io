<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" width="960" height="344" role="img" aria-labelledby="mtt mtd" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id="mtt">Bidirectional KV transfer across conversation turns</title>
<desc id="mtd">On turn 1 the proxy has no cached blocks, so prefill computes the full prompt and decode pulls the KV cache from it. On turn 2 and later the proxy looks up the conversation, prefill pulls the prior turns' KV cache back from decode over RDMA and computes only the new tokens, then decode pulls those new blocks.</desc>

  <style>
    .bg-panel  { fill: #f6f6fb; stroke: #d9d9e8; }
    .bg-box    { fill: #ffffff; stroke: #c3c3d6; }
    .t         { fill: #16162a; }
    .t-mut     { fill: #5c5c78; }
    .mono      { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .acc-f     { fill: #6C5CE7; }
    .acc-soft  { fill: #ece9fd; stroke: #6C5CE7; }
    .warn-f    { fill: #C2410C; }
    .warn-s    { stroke: #C2410C; fill: none; }
    .ah-warn   { fill: #C2410C; }
    .ln        { stroke: #9a9ab4; fill: none; }
    .ah        { fill: #9a9ab4; }
    @media (prefers-color-scheme: dark) {
      .bg-panel  { fill: #1b1b2b; stroke: #34344a; }
      .bg-box    { fill: #23233a; stroke: #45455e; }
      .t         { fill: #e9e9f2; }
      .t-mut     { fill: #a2a2bd; }
      .acc-f     { fill: #A29BFE; }
      .acc-soft  { fill: #2e2b52; stroke: #A29BFE; }
      .warn-f    { fill: #FB923C; }
      .warn-s    { stroke: #FB923C; }
      .ah-warn   { fill: #FB923C; }
      .ln        { stroke: #6a6a86; }
      .ah        { fill: #6a6a86; }
    }
  </style>

  <text x="20" y="30" class="t" font-size="17" font-weight="700">Multi-turn: let prefill pull the conversation back from decode</text>

  <text x="20" y="66" class="t" font-size="14" font-weight="600">Turn 1 — cache miss</text>
  <rect x="20" y="78" width="450" height="212" rx="6" class="bg-panel" stroke-width="1.2"/>

  <rect x="160" y="96" width="170" height="40" rx="5" class="bg-box" stroke-width="1.2"/>
  <text x="245" y="113" class="t" font-size="12" text-anchor="middle" font-weight="700">Proxy</text>
  <text x="245" y="128" class="t-mut" font-size="10" text-anchor="middle">no cached blocks</text>

  <path d="M245,136 V162 H123 V182" class="ln" stroke-width="1.3"/>
  <path d="M245,162 H367 V182" class="ln" stroke-width="1.3"/>
  <polygon points="118.5,182 127.5,182 123,189" class="ah"/>
  <polygon points="362.5,182 371.5,182 367,189" class="ah"/>

  <rect x="48" y="192" width="150" height="66" rx="5" class="acc-soft" stroke-width="1.4"/>
  <text x="123" y="216" class="acc-f" font-size="13" text-anchor="middle" font-weight="700">Prefill</text>
  <text x="123" y="234" class="t-mut" font-size="10.5" text-anchor="middle">computes the</text>
  <text x="123" y="247" class="t-mut" font-size="10.5" text-anchor="middle">whole prompt</text>

  <rect x="292" y="192" width="150" height="66" rx="5" class="acc-soft" stroke-width="1.4"/>
  <text x="367" y="216" class="acc-f" font-size="13" text-anchor="middle" font-weight="700">Decode</text>
  <text x="367" y="234" class="t-mut" font-size="10.5" text-anchor="middle">keeps its blocks</text>
  <text x="367" y="247" class="t-mut" font-size="10.5" text-anchor="middle">for next turn</text>

  <text x="245" y="218" class="warn-f" font-size="10.5" text-anchor="middle" font-weight="700">all blocks</text>
  <line x1="200" y1="228" x2="282" y2="228" class="warn-s" stroke-width="1.6"/>
  <polygon points="282,223.5 290,228 282,232.5" class="ah-warn"/>

  <text x="490" y="66" class="t" font-size="14" font-weight="600">Turn 2+ — cache hit</text>
  <rect x="490" y="78" width="450" height="212" rx="6" class="bg-panel" stroke-width="1.2"/>

  <rect x="630" y="96" width="170" height="40" rx="5" class="bg-box" stroke-width="1.2"/>
  <text x="715" y="113" class="t" font-size="12" text-anchor="middle" font-weight="700">Proxy</text>
  <text x="715" y="128" class="t-mut mono" font-size="10" text-anchor="middle">conversation_id</text>

  <path d="M715,136 V162 H593 V182" class="ln" stroke-width="1.3"/>
  <path d="M715,162 H837 V182" class="ln" stroke-width="1.3"/>
  <polygon points="588.5,182 597.5,182 593,189" class="ah"/>
  <polygon points="832.5,182 841.5,182 837,189" class="ah"/>

  <rect x="518" y="192" width="150" height="66" rx="5" class="acc-soft" stroke-width="1.4"/>
  <text x="593" y="216" class="acc-f" font-size="13" text-anchor="middle" font-weight="700">Prefill</text>
  <text x="593" y="234" class="t-mut" font-size="10.5" text-anchor="middle">computes only</text>
  <text x="593" y="247" class="t-mut" font-size="10.5" text-anchor="middle">the new tokens</text>

  <rect x="762" y="192" width="150" height="66" rx="5" class="acc-soft" stroke-width="1.4"/>
  <text x="837" y="216" class="acc-f" font-size="13" text-anchor="middle" font-weight="700">Decode</text>
  <text x="837" y="234" class="t-mut" font-size="10.5" text-anchor="middle">still holds every</text>
  <text x="837" y="247" class="t-mut" font-size="10.5" text-anchor="middle">prior turn</text>

  <text x="715" y="208" class="warn-f" font-size="10.5" text-anchor="middle" font-weight="700">prior turns</text>
  <line x1="752" y1="218" x2="678" y2="218" class="warn-s" stroke-width="1.6"/>
  <polygon points="678,213.5 670,218 678,222.5" class="ah-warn"/>

  <text x="715" y="238" class="warn-f" font-size="10.5" text-anchor="middle" font-weight="700">new tokens</text>
  <line x1="670" y1="248" x2="752" y2="248" class="warn-s" stroke-width="1.6"/>
  <polygon points="752,243.5 760,248 752,252.5" class="ah-warn"/>

  <text x="20" y="316" class="t-mut" font-size="12">A stateful proxy keys the cached <tspan class="mono">kv_transfer_params</tspan> by conversation. Under <tspan class="mono">kv_recompute_threshold</tspan> (64 tokens) prefill just recomputes locally.</text>
</svg>
