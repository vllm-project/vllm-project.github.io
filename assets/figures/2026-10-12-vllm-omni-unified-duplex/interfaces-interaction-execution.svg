<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="568" viewBox="0 0 1000 568" role="img" aria-labelledby="diagram-title diagram-desc"><style>text {font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#242321} .label{font-size:19px;font-weight:700} .small,.meta{font-size:14px;fill:#615e59} .meta{fill:#426f99;font-weight:700} .node rect{fill:#f7f6f3;stroke:#8a8986;stroke-width:1.25} .edge{stroke:#8a8986;stroke-width:1.5;fill:none}</style><rect width="1000" height="568" fill="white"/>
    <title id="diagram-title">Interfaces, interaction modes and model execution</title>
    <desc id="diagram-desc">Chat Completions uses request-response interaction. Realtime Duplex provides a live duplex session with either native duplex execution or turn-based execution. Model examples appear beneath each path. Select a path to see how the layers differ.</desc>
    <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="context-stroke"/></marker></defs>
    <text x="18" y="60" class="meta">INTERFACE</text>
    <text x="18" y="169" class="meta">INTERACTION</text>
    <text x="18" y="300" class="meta">EXECUTION</text>
    <text x="18" y="461" class="meta">EXAMPLES</text>
    <g id="chat-api" class="node" aria-label="Chat Completions interface">
      <rect x="142" y="20" width="224" height="84" rx="4"/><text x="254" y="53" class="label" text-anchor="middle">Chat Completions</text><text x="254" y="81" text-anchor="middle">/v1/chat/completions</text>
    </g>
    <g id="duplex-api" class="node" aria-label="Realtime Duplex interface">
      <rect x="396" y="20" width="580" height="84" rx="4"/><text x="686" y="51" class="label" text-anchor="middle">Realtime / Duplex</text><text x="686" y="79" text-anchor="middle">/v1/duplex  or  /v1/realtime?duplex=1</text>
    </g>
    <g id="request" class="node" aria-label="Request-response interaction">
      <rect x="142" y="137" width="224" height="58" rx="4"/><text x="254" y="172" class="label" text-anchor="middle">Request–response</text>
    </g>
    <g id="session" class="node" aria-label="Duplex session interaction">
      <rect x="396" y="137" width="580" height="58" rx="4"/><text x="686" y="172" class="label" text-anchor="middle">Duplex session</text>
    </g>
    <g id="request-execution" class="node" aria-label="Generate a response from an input snapshot">
      <rect x="142" y="257" width="224" height="118" rx="4"/><text x="254" y="290" text-anchor="middle">One input snapshot</text><text x="254" y="318" text-anchor="middle">→ one response</text><text x="254" y="350" class="small" text-anchor="middle">Output may stream.</text>
    </g>
    <g id="native" class="node" aria-label="Native duplex execution">
      <rect x="396" y="257" width="270" height="118" rx="4"/><text x="531" y="287" class="label" text-anchor="middle">Native duplex execution</text><text x="531" y="320" text-anchor="middle">Continuing input updates</text><text x="531" y="345" text-anchor="middle">ongoing model computation.</text>
    </g>
    <g id="turn" class="node" aria-label="Turn-based execution within a duplex session">
      <rect x="706" y="257" width="270" height="118" rx="4"/><text x="841" y="287" class="label" text-anchor="middle">Turn-based execution</text><text x="841" y="320" text-anchor="middle">Each response: a new request</text><text x="841" y="345" text-anchor="middle">from current input and history.</text>
    </g>
    <g id="chat-models" class="node" aria-label="Request-response examples: Qwen3-Omni and MiniCPM-o 4.5 in turn mode">
      <rect x="142" y="415" width="224" height="117" rx="4"/><text x="254" y="446" class="label" text-anchor="middle">Qwen3-Omni</text><text x="254" y="474" class="label" text-anchor="middle">MiniCPM-o 4.5</text><text x="254" y="501" class="small" text-anchor="middle">(turn mode)</text>
    </g>
    <g id="native-models" class="node" aria-label="Native duplex examples: PersonaPlex, MiniCPM-o 4.5, and Nemotron VoiceChat">
      <rect x="396" y="415" width="270" height="117" rx="4"/><text x="531" y="446" class="label" text-anchor="middle">PersonaPlex</text><text x="531" y="475" class="label" text-anchor="middle">MiniCPM-o 4.5</text><text x="531" y="504" class="label" text-anchor="middle">Nemotron VoiceChat</text>
    </g>
    <g id="turn-models" class="node" aria-label="Turn-based duplex examples: Qwen3-Omni with Server VAD and AURA">
      <rect x="706" y="415" width="270" height="117" rx="4"/><text x="841" y="446" class="label" text-anchor="middle">Qwen3-Omni</text><text x="841" y="472" class="small" text-anchor="middle">+ Server VAD</text><text x="841" y="504" class="label" text-anchor="middle">AURA</text>
    </g>
    <g marker-end="url(#arrow)">
      <path id="chat-a" class="edge" d="M254 104V135"/><path id="chat-b" class="edge" d="M254 195V255"/><path id="chat-c" class="edge" d="M254 375V413"/>
      <path id="duplex-a" class="edge" d="M686 104V135"/>
      <path id="native-a" class="edge" d="M686 195V226H531V255"/><path id="turn-a" class="edge" d="M686 195V226H841V255"/>
      <path id="native-b" class="edge" d="M531 375V413"/><path id="turn-b" class="edge" d="M841 375V413"/>
    </g>
    <text x="142" y="554" class="small">Model names identify example serving profiles, not an exhaustive list of supported interfaces.</text>
  </svg>
