<text x="733" y="89" font-size="11" font-weight="700" fill="#9aa0ab">splits by sequence, not by head</text>
<text x="733" y="111" font-size="11.5" font-weight="600" fill="#444b57">Each GPU keeps 1/N of the cache.</text>
