<text x="383" y="89" font-size="11" font-weight="700" fill="#9aa0ab">ex. DeepSeek, Kimi</text>
<text x="383" y="111" font-size="11.5" font-weight="600" fill="#444b57">One shared latent, duplicated on every rank.</text>
