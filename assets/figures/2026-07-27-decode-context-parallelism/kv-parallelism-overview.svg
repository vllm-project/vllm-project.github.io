<text x="33" y="73" font-size="16.5" font-weight="800" fill="#1a1d24">Grouped Query Attention</text>
<text x="33" y="89" font-size="11" font-weight="700" fill="#9aa0ab">ex. Qwen</text>
<text x="33" y="111" font-size="11.5" font-weight="600" fill="#444b57">When TP &gt; KV heads, the extra ranks duplicate.</text>
