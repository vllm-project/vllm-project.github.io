<text x="150" y="213" class="t-mut" font-size="11.5" text-anchor="middle">no device access</text>
<rect x="54" y="230" width="192" height="40" rx="5" class="idle" stroke-width="1.25"/>
<text x="150" y="247" class="t" font-size="13" text-anchor="middle" font-weight="600">Engine proc 2</text>
<text x="150" y="263" class="t-mut" font-size="11.5" text-anchor="middle">no device access</text>
<rect x="54" y="280" width="192" height="40" rx="5" class="idle" stroke-width="1.25"/>
<text x="150" y="297" class="t" font-size="13" text-anchor="middle" font-weight="600">Engine proc 3</text>
<text x="150" y="313" class="t-mut" font-size="11.5" text-anchor="middle">no device access</text>
