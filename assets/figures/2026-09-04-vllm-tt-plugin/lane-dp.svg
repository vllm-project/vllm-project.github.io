<rect x="343.36" y="58" width="293.28" height="19" rx="9.5" class="warn-soft" stroke-width="1.1"/><text x="490" y="71.82" class="warn-f" font-size="12" text-anchor="middle" font-weight="600">What we tried first: multi-process DP</text>
