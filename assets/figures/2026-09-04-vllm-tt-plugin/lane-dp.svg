<text x="375" y="208" class="warn-f" font-size="12.5" text-anchor="middle" font-weight="600">gather to proc 0</text>
<text x="375" y="226" class="warn-f" font-size="12.5" text-anchor="middle" font-weight="600">every step</text>
<line x1="450" y1="214" x2="484" y2="214" class="warn-s" stroke-width="1.5"/><path d="M484,209.8 L484,218.2 L490,214 Z" class="ah-warn"/>
<rect x="490" y="182" width="150" height="64" rx="6" class="bg-box" stroke-width="1.25"/>
