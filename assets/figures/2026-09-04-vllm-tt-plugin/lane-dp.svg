<text x="490" y="408" class="warn-f" font-size="13" text-anchor="middle">Only rank 0 can touch the mesh, so every step pays a gather and a scatter,</text>
<text x="490" y="426" class="warn-f" font-size="13" text-anchor="middle">and coordinating that needed changes inside vLLM core, well past the plugin API.</text>
