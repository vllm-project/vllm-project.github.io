      .t         { fill: #e9e9f2; }
      .t-mut     { fill: #a2a2bd; }
      .ln        { stroke: #6a6a86; }
      .ln-div    { stroke: #3a3a52; }
      .acc-s     { stroke: #A29BFE; }
      .acc-f     { fill: #A29BFE; }
      .acc-soft  { fill: #2e2b52; stroke: #A29BFE; }
      .acc-mid   { fill: #423a78; stroke: #A29BFE; }
      .fab       { stroke: #A29BFE; opacity: 1; }
      .acc2-s    { stroke: #4ECDC4; }
      .acc2-f    { fill: #4ECDC4; }
      .acc2-soft { fill: #1d3a3a; stroke: #4ECDC4; }
      .acc2-mid  { fill: #27514e; stroke: #4ECDC4; }
      .warn-f    { fill: #FB923C; }
      .warn-s    { stroke: #FB923C; }
      .warn-soft { fill: #3a2a1c; stroke: #FB923C; }
      .ah        { fill: #6a6a86; }
      .ah-acc    { fill: #A29BFE; }
