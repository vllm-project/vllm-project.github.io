<rect x="335.91999999999996" y="470" width="308.16" height="19" rx="9.5" class="acc-soft" stroke-width="1.1"/><text x="490" y="483.82" class="acc-f" font-size="12" text-anchor="middle" font-weight="600">What we shipped: single-process lane-DP</text>
