<text x="96.0" y="657" class="acc2-f" font-size="11" text-anchor="middle" font-weight="600">local blocks</text>
<rect x="138" y="604" width="68" height="64" rx="6" class="bg-box" stroke-width="1.25"/>
<text x="172.0" y="626" class="t" font-size="12.5" text-anchor="middle" font-weight="600">Lane 1</text>
<text x="172.0" y="642" class="t-mut" font-size="11" text-anchor="middle">TTScheduler</text>
<text x="172.0" y="657" class="acc2-f" font-size="11" text-anchor="middle" font-weight="600">local blocks</text>
<rect x="214" y="604" width="68" height="64" rx="6" class="bg-box" stroke-width="1.25"/>
<text x="248.0" y="626" class="t" font-size="12.5" text-anchor="middle" font-weight="600">Lane 2</text>
<text x="248.0" y="642" class="t-mut" font-size="11" text-anchor="middle">TTScheduler</text>
<text x="248.0" y="657" class="acc2-f" font-size="11" text-anchor="middle" font-weight="600">local blocks</text>
<rect x="290" y="604" width="68" height="64" rx="6" class="bg-box" stroke-width="1.25"/>
<text x="324.0" y="626" class="t" font-size="12.5" text-anchor="middle" font-weight="600">Lane 3</text>
<text x="324.0" y="642" class="t-mut" font-size="11" text-anchor="middle">TTScheduler</text>
<text x="324.0" y="657" class="acc2-f" font-size="11" text-anchor="middle" font-weight="600">local blocks</text>
<text x="210" y="694" class="t-mut" font-size="11.5" text-anchor="middle">each lane: own queues,</text>
<text x="210" y="710" class="t-mut" font-size="11.5" text-anchor="middle">own KV cache, local block IDs</text>
