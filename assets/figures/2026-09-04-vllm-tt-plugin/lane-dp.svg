<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 900" width="980" height="900" role="img" aria-labelledby="f2t f2d">
<title id="f2t">Multi-process data parallelism versus single-process lane data parallelism</title>
<desc id="f2d">Top, the rejected design: four engine processes each with their own scheduler gather to rank 0, which alone submits to the mesh and reads the output back, then scatters results to every rank, so there is inter-process traffic twice per step. Bottom, the shipped design: one engine process holds a coordinator and four independent schedulers; the worker submits and reads back and the runner splits the output by lane, with no process-level collectives.</desc>

  <style>
