<text x="490" y="844" class="acc-f" font-size="13" text-anchor="middle">One process owns the mesh and all four schedulers, so submit, readout and split are local calls.</text>
<text x="490" y="862" class="acc-f" font-size="13" text-anchor="middle">No process-level collectives anywhere.</text>
