<rect x="62" y="544" width="296" height="48" rx="6" class="acc-soft" stroke-width="1.25"/>
<text x="210" y="567" class="acc-f" font-size="13.5" text-anchor="middle" font-weight="700">TTLaneCoordinator</text>
