    <rect class="blue" x="252" y="176" width="30" height="12" rx="2"/>
    <rect class="blue" x="286" y="176" width="30" height="12" rx="2"/>
  <text class="s cnt" x="199" y="300" text-anchor="middle">~hundreds of rows / expert</text>
  <rect class="card" x="396" y="104" width="330" height="214" rx="10"/>
  <text class="s phase" x="561" y="134" text-anchor="middle">Decode</text>
  <text class="s sched" x="561" y="156" text-anchor="middle">MMA operands swapped</text>
    <rect class="blue" x="444" y="256" width="30" height="12" rx="2"/>
    <rect class="blue" x="478" y="256" width="30" height="12" rx="2"/>
    <rect class="blue" x="512" y="256" width="30" height="12" rx="2"/>
    <rect class="blue" x="546" y="256" width="30" height="12" rx="2"/>
