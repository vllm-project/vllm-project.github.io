    <rect class="blue" x="252" y="240" width="30" height="12" rx="2"/>
    <rect class="blue" x="286" y="240" width="30" height="12" rx="2"/>
    <rect class="blue" x="82" y="224" width="30" height="12" rx="2"/>
    <rect class="blue" x="116" y="224" width="30" height="12" rx="2"/>
    <rect class="blue" x="150" y="224" width="30" height="12" rx="2"/>
    <rect class="blue" x="184" y="224" width="30" height="12" rx="2"/>
    <rect class="blue" x="218" y="224" width="30" height="12" rx="2"/>
