    <rect class="blue" x="252" y="208" width="30" height="12" rx="2"/>
    <rect class="blue" x="286" y="208" width="30" height="12" rx="2"/>
    <rect class="blue" x="82" y="192" width="30" height="12" rx="2"/>
    <rect class="blue" x="116" y="192" width="30" height="12" rx="2"/>
    <rect class="blue" x="150" y="192" width="30" height="12" rx="2"/>
    <rect class="blue" x="184" y="192" width="30" height="12" rx="2"/>
    <rect class="blue" x="218" y="192" width="30" height="12" rx="2"/>
