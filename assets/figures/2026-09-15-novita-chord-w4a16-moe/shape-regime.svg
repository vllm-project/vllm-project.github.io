    <rect class="blue" x="648" y="240" width="30" height="12" rx="2"/>
  <text class="s cnt" x="561" y="300" text-anchor="middle">~9–15 rows / expert</text>
  <text class="s mut" x="34" y="352">Within the prefill profile, 80 routed tokens per expert is the block-M heuristic threshold: below it the</text>
  <text class="s mut" x="34" y="370">resolver keeps its baseline block-count search, above it block-M is sized around each expert’s padded rows.</text>
</svg>
