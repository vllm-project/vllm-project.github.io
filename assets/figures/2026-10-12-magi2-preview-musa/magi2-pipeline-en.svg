<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" viewBox="0 0 1240 636" width="1240" height="636" role="img" aria-label="MAGI-2 inference pipeline: the Preview DiT produces 540p video and audio, and the 1080p tier runs a separate 6.7B dense refiner over the upsampled Preview video latent">
<title>MAGI-2 inference pipeline, Preview stage and 1080p refiner tier</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<rect width="1240" height="636" fill="#ffffff"/>
<text x="24" y="28" font-size="18" fill="#1f2937" text-anchor="start" font-weight="600">MAGI-2 inference pipeline</text>
<text x="24" y="46" font-size="11.5" fill="#4b5563" text-anchor="start" font-weight="normal">Preview DiT produces the 540p output; the 1080p tier refines its video latent with a separate refiner</text>
<rect x="16" y="60" width="1208" height="268" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="28" y="79" font-size="12" fill="#2563eb" font-weight="600">Preview stage  ·  the only stage this post measures</text>
<text x="40" y="100" font-size="11.5" fill="#4b5563" text-anchor="start" font-weight="600">Inputs</text>
<rect x="40" y="108" width="170" height="42" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
<text x="125.0" y="133.5" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="normal">Text prompt</text>
<rect x="40" y="158" width="170" height="42" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
<text x="125.0" y="183.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">First frame (I2V, optional)</text>
<text x="232" y="100" font-size="11.5" fill="#4b5563" text-anchor="start" font-weight="600">Encoders</text>
<rect x="232" y="108" width="196" height="42" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
<text x="330.0" y="133.5" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="normal">Qwen3.5-27B text encoder</text>
<rect x="232" y="158" width="196" height="42" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
<text x="330.0" y="183.5" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="normal">Wan2.2 VAE encoder</text>
<line x1="210" y1="129" x2="230" y2="129" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="210" y1="179" x2="230" y2="179" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="452" y="92" width="404" height="212" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<text x="654" y="112" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="600">Single-stream DiT  ·  100 steps  ·  2 CFG branches</text>
<rect x="466" y="122" width="376" height="28" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
<text x="654.0" y="140.5" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="normal">One packed sequence: video | audio | text tokens</text>
<rect x="466" y="156" width="376" height="30" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
<text x="654.0" y="175.5" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="normal">Layers 0–1  ·  dense, per-modality weights</text>
<rect x="466" y="192" width="376" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="654.0" y="211.5" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="normal">Layers 2–37  ·  MoE: 12 heads × 256 experts, top-6</text>
<rect x="466" y="228" width="376" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="654.0" y="247.5" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="normal">mHC residual: 4 streams, Sinkhorn-normalized</text>
<rect x="466" y="264" width="376" height="30" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
<text x="654.0" y="283.5" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="normal">Layers 38–39  ·  dense, per-modality weights</text>
<line x1="430" y1="129" x2="450" y2="150" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="430" y1="179" x2="450" y2="196" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
<text x="880" y="100" font-size="11.5" fill="#4b5563" text-anchor="start" font-weight="600">Decoders</text>
<rect x="880" y="108" width="190" height="42" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
<text x="975.0" y="133.5" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="normal">TurboVAE (video)</text>
<rect x="880" y="158" width="190" height="42" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
<text x="975.0" y="183.5" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="normal">Stable Audio Open (audio)</text>
<line x1="856" y1="150" x2="878" y2="129" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="856" y1="190" x2="878" y2="179" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
<text x="1092" y="100" font-size="11.5" fill="#4b5563" text-anchor="start" font-weight="600">540p tier</text>
<rect x="1092" y="108" width="120" height="42" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="1152.0" y="133.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">540p video</text>
<rect x="1092" y="158" width="120" height="42" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="1152.0" y="183.5" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">audio</text>
<line x1="1070" y1="129" x2="1090" y2="129" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="1070" y1="179" x2="1090" y2="179" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
<text x="1092" y="226" font-size="10.5" fill="#b45309" text-anchor="start" font-weight="600">video latent</text>
<text x="1092" y="240" font-size="10.5" fill="#b45309" text-anchor="start" font-weight="normal">before decoding</text>
<text x="1092" y="254" font-size="10.5" fill="#b45309" text-anchor="start" font-weight="normal">feeds the refiner</text>
<rect x="16" y="352" width="1208" height="210" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="28" y="371" font-size="12" fill="#b45309" font-weight="600">1080p tier  ·  Sand AI's default output, in review as #8915</text>
<rect x="40" y="400" width="186" height="50" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="133.0" y="423.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">Preview video latent</text>
<text x="133.0" y="438.0" font-size="10.5" fill="#4b5563" text-anchor="middle" font-weight="normal">540p, taken before decode</text>
<rect x="252" y="400" width="150" height="50" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
<text x="327.0" y="423.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">Upsample</text>
<text x="327.0" y="438.0" font-size="10.5" fill="#4b5563" text-anchor="middle" font-weight="normal">+ renoise</text>
<line x1="226" y1="425" x2="250" y2="425" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
<rect x="428" y="386" width="440" height="78" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
<text x="648" y="406" font-size="12" fill="#b45309" text-anchor="middle" font-weight="600">Refiner DiT  ·  6.7B dense  ·  30 layers</text>
<text x="648" y="424" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal">block-window local attention, 8 KV heads</text>
<text x="648" y="442" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="normal">5 guided steps (refiner_num_inference_steps)</text>
<text x="648" y="458" font-size="10.5" fill="#4b5563" text-anchor="middle" font-weight="normal">separately checkpointed, built on the first 1080p request</text>
<line x1="402" y1="425" x2="426" y2="425" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
<rect x="894" y="400" width="126" height="50" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
<text x="957.0" y="423.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">TurboVAE</text>
<text x="957.0" y="438.0" font-size="10.5" fill="#4b5563" text-anchor="middle" font-weight="normal">video decode</text>
<line x1="868" y1="425" x2="892" y2="425" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
<rect x="1044" y="400" width="168" height="50" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="1128.0" y="423.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">1920×1088 · 25 fps</text>
<text x="1128.0" y="438.0" font-size="10.5" fill="#4b5563" text-anchor="middle" font-weight="normal">249 frames</text>
<line x1="1020" y1="425" x2="1042" y2="425" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
<text x="24" y="496" font-size="10.5" fill="#4b5563" text-anchor="start" font-weight="normal">audio: the Preview stage decodes it once and the 1080p tier reuses it unchanged</text>
<text x="24" y="600" font-size="11.5" fill="#4b5563" text-anchor="start" font-weight="normal">Speeds in this post: per denoising step of the Preview DiT. The refiner's 5 steps are a separate stage and are not measured here.</text>
<text x="24" y="618" font-size="11.5" fill="#4b5563" text-anchor="start" font-weight="normal">Sources: the Sand AI blog, the model card, and the vLLM-Omni implementation in vllm_omni/diffusion/models/magi2/ (refiner: PR #8915).</text>
</svg>
