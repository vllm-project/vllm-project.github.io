<main class="page">

<div class="fig" id="fig-tpot">
  <div class="fig-head">
    <p class="fig-kicker">Figure 6 · Fused low-latency decode</p>
    <h1 class="fig-title">The fused decode path makes decode 1.2–1.6× faster</h1>
    <p class="fig-sub">Time per output token (TPOT) on 8× GB300 with TP8 and a 1K-token input, in ms; lower is better.</p>
  </div>
  <div class="mlegend" aria-hidden="true">
    <span><i class="s-gen"></i>Default path</span>
    <span><i class="s-ex"></i>Fused decode path</span>
  </div>
  <div class="mchart" id="chart" role="img" aria-label="Grouped bars of time per output token for batch 1, 4, 8, 32 and 64, default path versus fused decode path; each bar is labelled with its value."></div>
  <div class="mtip" id="tip" role="tooltip"></div>
</div>

</main>

  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  function tween(el, to, ms) {
    ms = reduced() ? 0 : ms == null ? 520 : ms;
    if (el._fkRaf) cancelAnimationFrame(el._fkRaf);
    const from = {};
    for (const k in to) from[k] = parseFloat(el.getAttribute(k)) || 0;
    return new Promise((res) => {
      if (!ms) { for (const k in to) el.setAttribute(k, to[k]); return res(); }
      const t0 = performance.now();
      const tick = (now) => {
        const t = Math.max(0, Math.min(1, (now - t0) / ms)), e = ease(t);
        for (const k in to) el.setAttribute(k, from[k] + (to[k] - from[k]) * e);
        if (t < 1) el._fkRaf = requestAnimationFrame(tick); else { el._fkRaf = 0; res(); }
      };
      el._fkRaf = requestAnimationFrame(tick);
    });
  }
  const ICON_PLAY = '<svg viewBox="0 0 12 12"><path d="M2 1.2v9.6L10.4 6z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 12 12"><path d="M2 1h3v10H2zM7 1h3v10H7z"/></svg>';
  const ICON_PREV = '<svg viewBox="0 0 12 12"><path d="M8.5 1.5 3.5 6l5 4.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
  const ICON_NEXT = '<svg viewBox="0 0 12 12"><path d="M3.5 1.5 8.5 6l-5 4.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
  function player(host, opts) {
    const steps = opts.steps, n = steps.length;
    const dwell = (i) => steps[i].ms || opts.ms || 4200;
    host.classList.add("fig-player");
    host.innerHTML =
      '<div class="fig-controls">' +
      '<button class="fig-btn play" type="button"></button>' +
      '<button class="fig-btn prev" type="button" aria-label="Previous step">' + ICON_PREV + "</button>" +
      '<button class="fig-btn next" type="button" aria-label="Next step">' + ICON_NEXT + "</button>" +
      '<div class="fig-pills" role="tablist"></div><span class="fig-count"></span></div>' +
      '<div class="fig-explain" aria-live="polite"><h3></h3><p></p></div>';
    const $ = (s) => host.querySelector(s);
    const grouped = steps.some((s) => s.group);
    const groups = {};
    if (grouped) $(".fig-pills").classList.add("grouped");
    const pills = steps.map((s, i) => {
      const b = document.createElement("button");
      b.className = "fig-pill"; b.type = "button"; b.setAttribute("role", "tab");
      b.setAttribute("aria-label", (s.group ? s.group + ", " : "") + "step " + (i + 1) + ": " + s.label);
      b.innerHTML = '<span class="fill"></span><span class="lbl">' + s.label + "</span>";
      b.onclick = () => { stop(); go(i); };
      let parent = $(".fig-pills");
      if (grouped) {
        const key = s.group || "";
        if (!groups[key]) {
          const g = document.createElement("div");
          g.className = "fig-pgroup";
          g.innerHTML = '<button type="button" class="fig-pglabel"></button><div class="fig-pgpills"></div>';
          g.querySelector(".fig-pglabel").textContent = key;
          g.querySelector(".fig-pglabel").onclick = () => { stop(); go(i); };
          $(".fig-pills").appendChild(g);
          groups[key] = { el: g, n: 0 };
        }
        groups[key].n++;
        groups[key].el.style.flex = String(groups[key].n);
        parent = groups[key].el.querySelector(".fig-pgpills");
      }
      parent.appendChild(b);
      return b;
    });
    let cur = -1, playing = false, timer = 0, started = false;
    function setPlayBtn() {
      $(".play").innerHTML = playing ? ICON_PAUSE + '<span class="t">Pause</span>'
        : ICON_PLAY + '<span class="t">' + (cur === n - 1 ? "Replay" : "Play") + "</span>";
      $(".play").setAttribute("aria-label", playing ? "Pause" : "Play");
    }
    function go(i) {
      const prev = cur;
      cur = (i + n) % n;
      pills.forEach((p, k) => {
        p.classList.toggle("on", k === cur); p.classList.toggle("done", k < cur);
        p.setAttribute("aria-selected", k === cur);
        const f = p.querySelector(".fill"); f.style.transition = "none"; f.style.width = k < cur ? "100%" : "0";
      });
      if (grouped) for (const k in groups) groups[k].el.classList.toggle("on", k === (steps[cur].group || ""));
      $(".fig-explain h3").innerHTML = steps[cur].title;
      $(".fig-explain p").innerHTML = steps[cur].text;
      const pad = (k) => String(k).padStart(2, "0");
      $(".fig-count").textContent = pad(cur + 1) + " / " + pad(n);
      opts.render(cur, prev);
      if (playing) schedule();
      setPlayBtn();
    }
    function schedule() {
      clearTimeout(timer);
      const f = pills[cur].querySelector(".fill");
      requestAnimationFrame(() => requestAnimationFrame(() => { f.style.transition = "width " + dwell(cur) + "ms linear"; f.style.width = "100%"; }));
      timer = setTimeout(() => {
        if (cur === n - 1) { playing = false; setPlayBtn(); return; }
        go(cur + 1);
      }, dwell(cur));
    }
    function play() { playing = true; started = true; if (cur === n - 1) go(0); else { schedule(); setPlayBtn(); } }
    function stop() {
      playing = false; clearTimeout(timer);
      const f = pills[cur] && pills[cur].querySelector(".fill");
      if (f) { f.style.transition = "none"; f.style.width = "0"; }
      setPlayBtn();
    }
    $(".play").onclick = () => (playing ? stop() : play());
    $(".prev").onclick = () => { stop(); go(Math.max(0, cur - 1)); };
    $(".next").onclick = () => { stop(); go(Math.min(n - 1, cur + 1)); };
    host.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") { stop(); go(Math.min(n - 1, cur + 1)); }
      if (e.key === "ArrowLeft") { stop(); go(Math.max(0, cur - 1)); }
    });
    go(0);
    const auto = opts.autoplay !== false && !reduced();
    if ("IntersectionObserver" in window) {
      new IntersectionObserver((es) => {
        const visible = es[0].isIntersecting;
        if (visible && auto && !started) play();
        if (!visible && playing) { stop(); started = false; }
      }, { threshold: 0.5 }).observe(host.parentElement || host);
    } else if (auto) play();
    return { go, play, stop, get step() { return cur; } };
  }
  window.FK = { svg, text, defs, tween, player, reduced };
})();

/* text with _{sub} and ^{sup} */
function TX(parent, x, y, s, cls, attrs) {
  const t = FK.svg("text", Object.assign({ x, y, class: cls || "t-lab" }, attrs || {}), parent);
  const re = /([_^])\{([^}]*)\}/g; let last = 0, m, shift = 0;
  const add = (txt, dy, small) => { const ts = FK.svg("tspan", {}, t); ts.textContent = txt; if (dy) ts.setAttribute("dy", dy); if (small) ts.setAttribute("font-size", "0.75em"); };
  while ((m = re.exec(s))) {
    if (m.index > last) { add(s.slice(last, m.index), -shift, false); shift = 0; }
    const d = m[1] === "_" ? 3.5 : -5; add(m[2], d - shift, true); shift = d; last = re.lastIndex;
  }
  if (last < s.length) add(s.slice(last), -shift, false);
  return t;
}

/* ── Figure: TPOT, default path vs fused decode path ───────────────── */
(function () {
  const ROWS = [["Batch 1", 9.03, 5.55], ["Batch 4", 11.91, 7.66], ["Batch 8", 13.62, 8.66], ["Batch 32", 21.51, 17.07], ["Batch 64", 29.85, 25.26]];
  const SERIES = [["gen", "Default path"], ["ex", "Fused decode path"]];
  const NS = "http://www.w3.org/2000/svg";
  const el = (t, a, p) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); if (p) p.appendChild(n); return n; };
  const W = 736, LX = 92, RX = W - 150, BH = 18, GAP = 2, GROUP = 2 * BH + GAP + 22, TOP = 22;
  const MAX = 32, x = (v) => LX + ((RX - LX) * v) / MAX;
  const H = TOP + ROWS.length * GROUP + 4;
  const svg = el("svg", { viewBox: "0 0 " + W + " " + H }, document.getElementById("chart"));
  for (let v = 0; v <= MAX; v += 4) {
    el("line", { x1: x(v), y1: TOP - 6, x2: x(v), y2: H - 4, class: "grid" }, svg);
    const t = el("text", { x: x(v), y: 12, class: "axis", "text-anchor": "middle" }, svg); t.textContent = v + (v === MAX ? " ms" : "");
  }
  const tip = document.getElementById("tip"), chart = document.getElementById("chart");
  const barPath = (x0, y, w, h) => { const r = Math.min(4, w, h / 2);
    return "M" + x0 + " " + y + " H" + (x0 + w - r) + " Q" + (x0 + w) + " " + y + " " + (x0 + w) + " " + (y + r) + " V" + (y + h - r) +
      " Q" + (x0 + w) + " " + (y + h) + " " + (x0 + w - r) + " " + (y + h) + " H" + x0 + " Z"; };
  ROWS.forEach(([name, base, fused], gi) => {
    const y0 = TOP + gi * GROUP;
    const g = el("text", { x: 0, y: y0 + BH + 4, class: "grp" }, svg); g.textContent = name;
    [base, fused].forEach((v, si) => {
      const y = y0 + si * (BH + GAP), key = SERIES[si][0];
      const b = el("path", { d: barPath(x(0), y, x(v) - x(0), BH), class: "bar", fill: "var(--s-" + key + ")" }, svg);
      const t = el("text", { x: x(v) + 6, y: y + BH - 5, class: "val" + (si === 1 ? " hero" : "") }, svg);
      t.textContent = si === 1 ? v.toFixed(2) + " ms · " + (base / fused).toFixed(2) + "× faster" : v.toFixed(2) + " ms";
      const hit = el("rect", { x: 0, y: y - 1, width: W, height: BH + 2, class: "hit" }, svg);
      hit.addEventListener("mousemove", (e) => {
        chart.classList.add("hovering"); b.classList.add("on");
        tip.innerHTML = "<b>" + name + "</b><br>" + SERIES[si][1] + ": <b>" + v.toFixed(2) + " ms</b>" +
          (si === 1 ? '<br><span class="m">' + (base / fused).toFixed(2) + "× faster than the default path</span>" : "");
        tip.style.opacity = 1; tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 270) + "px"; tip.style.top = e.clientY + 14 + "px";
      });
      hit.addEventListener("mouseleave", () => { chart.classList.remove("hovering"); b.classList.remove("on"); tip.style.opacity = 0; });
    });
  });
})();

<script>
/* Embedding: posts the content height to the parent ('vllm-embed-resize'). */
(function () {
  if (window.self === window.top) return;
  document.documentElement.style.overflow = "hidden";
  var last = 0;
  function report() {
    var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h && h !== last) { last = h; window.parent.postMessage({ type: "vllm-embed-resize", height: h }, "*"); }
  }
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.body);
  window.addEventListener("load", report);
  window.addEventListener("resize", report);
  setTimeout(report, 300); setTimeout(report, 1500);
  report();
})();
</script>
