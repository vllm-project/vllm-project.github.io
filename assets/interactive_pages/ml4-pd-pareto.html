<script>
(function () {
  "use strict";
  const NS = "http://www.w3.org/2000/svg";
  const D = window.PD, S = document.getElementById("stage"), tip = document.getElementById("tip");
  const $ = (id) => document.getElementById(id);
  const ISL = Object.keys(D.isl);
  // dark mode swaps each series to its own dark step (validated separately), as figkit does
  const root = document.documentElement.dataset.theme;
  if (root === "dark" || (root !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
    D.configs.forEach((c) => { c.color = c.dark; });
  const CFG = Object.fromEntries(D.configs.map((c) => [c.id, c]));
  const hidden = new Set();
  let cur = 0, narrow = null;

  function el(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs || {}) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function text(parent, x, y, s, cls, attrs) {
    const t = el("text", Object.assign({ x, y, class: cls }, attrs || {}), parent);
    t.textContent = s;
    return t;
  }
  // marker shapes, matching the static PNG: o s D v ^
  function marker(parent, m, x, y, r, attrs) {
    if (m === "o") return el("circle", Object.assign({ cx: x, cy: y, r }, attrs), parent);
    const k = r * 1.1;
    const d = {
      s: `M${x - k * .85} ${y - k * .85}h${k * 1.7}v${k * 1.7}h${-k * 1.7}z`,
      D: `M${x} ${y - k * 1.15}L${x + k} ${y}L${x} ${y + k * 1.15}L${x - k} ${y}z`,
      v: `M${x - k} ${y - k * .7}L${x + k} ${y - k * .7}L${x} ${y + k}z`,
      "^": `M${x - k} ${y + k * .7}L${x + k} ${y + k * .7}L${x} ${y - k}z`,
    }[m];
    return el("path", Object.assign({ d }, attrs), parent);
  }
  function nice(max) {
    const step0 = max / 5, mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 2.5, 5, 10].map((f) => f * mag).find((s) => s >= step0);
    const top = Math.ceil(max / step) * step, ticks = [];
    for (let v = 0; v <= top + 1e-9; v += step) ticks.push(+v.toFixed(6));
    return { max: top, ticks };
  }
  const f1 = (v) => v.toFixed(1), f2 = (v) => v.toFixed(2);
  const intf = (v) => Math.round(v).toLocaleString("en-US");

  function show(r, cx, cy) {
    const c = CFG[r.cfg];
    const sweep = r.mode === "conc" ? "concurrency " + r.c : r.rate + " req/s (QPS sweep)";
    const rows = [
      ["Sweep", sweep],
      ["Interactivity", f1(r.user) + " tok/s/user"],
      ["Throughput", f1(r.gpu) + " tok/s/GPU"],
      ["TPOT p50", f2(r.tpot) + " ms"],
      ["TTFT p50", f2(r.ttft) + " s"],
      ["AL", r.al == null ? "–" : f2(r.al)],
      ["Requests", intf(r.n)],
    ];
    tip.innerHTML = '<div class="tip-k">' + swatchSvg(c, r.mode === "qps") + c.num + " · " + c.name + "</div>" +
      rows.map((k) => '<div class="tip-row">' + k[0] + "<b>" + k[1] + "</b></div>").join("");
    tip.classList.add("show");
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let left = cx + 14, top = cy - h - 12;
    if (left + w > innerWidth - 8) left = cx - w - 14;
    if (top < 8) top = cy + 14;
    tip.style.left = Math.max(8, left) + "px";
    tip.style.top = top + "px";
  }
  function hide() { tip.classList.remove("show"); S.querySelectorAll(".ring").forEach((n) => n.remove()); }

  function swatchSvg(c, qps) {
    const s = document.createElementNS(NS, "svg");
    s.setAttribute("viewBox", "0 0 26 12");
    el("line", { x1: 1, x2: 25, y1: 6, y2: 6, class: qps ? "s-qps" : "s-line", style: "stroke:" + c.color }, s);
    marker(s, c.marker, 13, 6, qps ? 3.2 : 4, qps ? { class: "s-hollow", style: "stroke:" + c.color }
      : { class: "s-dot", style: "fill:" + c.color });
    s.setAttribute("width", 26); s.setAttribute("height", 12);
    return s.outerHTML;
  }

  function draw() {
    S.replaceChildren();
    narrow = S.getBoundingClientRect().width < 520;
    const W = narrow ? 420 : 736, H = narrow ? 360 : 380;
    S.setAttribute("viewBox", "0 0 " + W + " " + H);
    const rows = D.isl[ISL[cur]];
    const vis = rows.filter((r) => !hidden.has(r.cfg));
    const xs = nice(Math.max(110, ...rows.map((r) => r.user)) * 1.04);
    const ys = nice(Math.max(...rows.map((r) => r.gpu)) * 1.05);
    const X0 = narrow ? 44 : 52, X1 = W - 12, T = 22, B = H - 46;
    const X = (v) => X0 + v / xs.max * (X1 - X0), Y = (v) => B - v / ys.max * (B - T);
    S.setAttribute("aria-label", "Output tok/s per GPU vs tok/s per user at " + ISL[cur] +
      " input for " + D.configs.length + " P/D configurations.");

    el("rect", { x: X(40), y: T, width: X(100) - X(40), height: B - T, class: "band" }, S);
    text(S, (X(40) + X(100)) / 2, T + 14, "target 40–100", "t-faint", { "text-anchor": "middle", "font-size": 12 });
    for (const v of ys.ticks) {
      el("line", { x1: X0, x2: X1, y1: Y(v), y2: Y(v), class: "m-rule" }, S);
      text(S, X0 - 8, Y(v) + 4.5, String(v), "t-faint", { "text-anchor": "end" });
    }
    text(S, X0 - 8, T - 10, "out tok/s/GPU", "t-mut", { "text-anchor": "start", x: 0 });
    for (const v of narrow ? xs.ticks.filter((_, i) => i % 2 === 0) : xs.ticks) {
      el("line", { x1: X(v), x2: X(v), y1: B, y2: B + 5, class: "m-line" }, S);
      text(S, X(v), B + 20, String(v), "t-faint", { "text-anchor": "middle" });
    }
    text(S, X1, B + 38, "tok/s per user (1000 / TPOT p50)", "t-mut", { "text-anchor": "end" });

    const hits = [];
    for (const c of D.configs) {
      const g = el("g", { class: "series" + (hidden.has(c.id) ? " off" : ""), "data-cfg": c.id }, S);
      for (const mode of ["qps", "conc"]) {
        const p = rows.filter((r) => r.cfg === c.id && r.mode === mode);
        if (!p.length) continue;
        const d = p.map((r, i) => (i ? "L" : "M") + X(r.user).toFixed(1) + " " + Y(r.gpu).toFixed(1)).join("");
        el("path", { d, class: mode === "conc" ? "s-line" : "s-qps", stroke: c.color,
          "stroke-dasharray": mode === "conc" && !c.id.includes("spec") ? "6 4" : null }, g);
        for (const r of p) {
          marker(g, c.marker, X(r.user), Y(r.gpu), mode === "conc" ? 4.2 : 3.4,
            mode === "conc" ? { class: "s-dot", fill: c.color } : { class: "s-hollow", stroke: c.color });
          if (mode === "conc" && D.label_c.includes(r.c) && !narrow)
            text(g, X(r.user) + 6, Y(r.gpu) - 6, "c" + r.c, "t-clab");
          if (!hidden.has(c.id)) hits.push(r);
        }
      }
    }
    for (const r of hits) {
      const c = CFG[r.cfg], lvl = r.mode === "conc" ? "concurrency " + r.c : r.rate + " req/s";
      const hit = el("circle", { cx: X(r.user), cy: Y(r.gpu), r: 9, class: "hit", tabindex: "0", role: "img",
        "aria-label": c.name + ", " + lvl + ": " + f1(r.gpu) + " tok/s/GPU at " + f1(r.user) + " tok/s/user" }, S);
      const on = (cx, cy) => { hide(); el("circle", { cx: X(r.user), cy: Y(r.gpu), r: 8, class: "ring" }, S); show(r, cx, cy); };
      hit.addEventListener("mouseenter", (e) => on(e.clientX, e.clientY));
      hit.addEventListener("mousemove", (e) => show(r, e.clientX, e.clientY));
      hit.addEventListener("focus", () => { const b = hit.getBoundingClientRect(); on(b.left + b.width / 2, b.top); });
      hit.addEventListener("mouseleave", hide);
      hit.addEventListener("blur", hide);
    }
    if (!vis.length) text(S, (X0 + X1) / 2, (T + B) / 2, "All configurations hidden", "t-mut", { "text-anchor": "middle" });
  }

  function legend() {
    const L = $("legend");
    L.innerHTML = "";
    for (const c of D.configs) {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-pressed", String(!hidden.has(c.id)));
      b.innerHTML = swatchSvg(c, false) + c.num + " · " + c.name;
      b.onclick = () => {
        hidden.has(c.id) ? hidden.delete(c.id) : hidden.add(c.id);
        b.setAttribute("aria-pressed", String(!hidden.has(c.id)));
        hide(); draw();
      };
      L.appendChild(b);
    }
    const q = document.createElement("span");
    q.innerHTML = swatchSvg({ color: "var(--muted)", marker: "o" }, true) + "QPS sweep";
    L.appendChild(q);
    const band = document.createElement("span");
    band.innerHTML = '<i class="band"></i>Target 40–100 tok/s/user';
    L.appendChild(band);
  }

  const tabs = ISL.map((k, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.id = "tab-" + k; b.textContent = k + " in";
    b.setAttribute("role", "tab"); b.setAttribute("aria-controls", "panel");
    b.onclick = () => select(i);
    $("tabs").appendChild(b);
    return b;
  });
  $("tabs").addEventListener("keydown", (e) => {
    const n = ISL.length, k = { ArrowRight: cur + 1, ArrowLeft: cur - 1, Home: 0, End: n - 1 }[e.key];
    if (k == null) return;
    e.preventDefault();
    select((k + n) % n, true);
  });
  function select(k, focus) {
    cur = k;
    tabs.forEach((b, j) => { b.setAttribute("aria-selected", j === k); b.tabIndex = j === k ? 0 : -1; });
    if (focus) tabs[k].focus();
    $("sub").innerHTML = "<b>Input " + ISL[k] + " tokens, output 1k.</b> Output tok/s per GPU (8 GPUs) vs tok/s per user. Up and right is better.";
    $("panel").setAttribute("aria-labelledby", tabs[k].id);
    hide(); draw();
  }

  // ?isl=32k opens a given tab, for screenshots and deep links
  const m = /[?&]isl=(\w+)/.exec(location.search);
  legend();
  select(Math.max(0, ISL.indexOf(m && m[1])));
  addEventListener("resize", () => { if ((S.getBoundingClientRect().width < 520) !== narrow) draw(); });
  addEventListener("scroll", hide, { passive: true });

  // embedding: report the content height to the parent post ('vllm-embed-resize'), as figkit.js does
  (function reportHeight() {
    if (window.self === window.top) return;
    document.documentElement.style.overflow = "hidden";
    let last = 0;
    const report = () => {
      const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
      if (h && h !== last) { last = h; window.parent.postMessage({ type: "vllm-embed-resize", height: h }, "*"); }
    };
    if (window.ResizeObserver) new ResizeObserver(report).observe(document.body);
    addEventListener("load", report);
    addEventListener("resize", report);
    setTimeout(report, 300); setTimeout(report, 1500);
    report();
  })();
})();
</script>
