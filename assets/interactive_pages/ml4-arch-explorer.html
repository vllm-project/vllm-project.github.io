    $("p-layer").textContent = i + (i === 0 ? " (first)" : i === N - 1 ? " (last)" : "");
    const P = $("p-props"); P.replaceChildren();
    row(P, "Attention", l.nope ? '<b class="k-gold">NoPE</b>: MLA with zero RoPE dims' : "<b>RoPE</b>: MLA, YaRN + LeRoPE");
    row(P, "Indexer", ownIdx(i)
      ? "<b>own</b>: top-" + D.topk + ", " + D.idx_heads + " heads" + (l.nope && D.match_nope ? ", NoPE" : "")
      : '<b class="k-green">reuses layer ' + l.idx + "'s top-k</b>");
    row(P, "KV cache", ownKv(i) ? "<b>own</b> latent cache" + (i === kvSrc ? ", also read by " + shareKv.length + " layers" : "")
      : '<b class="k-blue">reads layer ' + l.kv + "'s latent KV</b>, writes none");
    row(P, "FFN", l.moe ? "<b>MoE</b>: " + D.experts + " experts, top-" + D.topk_experts + " + " + D.shared_experts + " shared"
      : "<b>dense</b> (hidden " + intf(D.dense_hidden) + ")");
    const B = $("p-bytes"); B.replaceChildren();
    const parts = "latent " + (ownKv(i) ? D.mla_row : 0) + " + indexer " + (ownIdx(i) ? D.idx_row : 0);
    row(B, "This layer", "<span style='color:var(--muted)'>" + parts + " = </span><b>" + intf(bytes(i)) + " B</b>", "num");
    row(B, "Layers 0–" + i + ", ML4", "<b>" + intf(cum[i]) + " B</b>", "num");
    const d = cumH[i] - cum[i];
    row(B, "Hypothetical: every layer owns KV", intf(cumH[i]) + " B" + (d ? " <span class='k-blue'>(−" + intf(d) + ")</span>" : ""), "num");
    mini(i);
  }

  function mini(i) {
    M.replaceChildren();
    const W = 330, H = 112, X0 = 34, X1 = W - 6, T = 8, Bt = H - 22, top = 55000;
    const X = (v) => X0 + v / (N - 1) * (X1 - X0), Y = (v) => Bt - v / top * (Bt - T);
    for (const v of [0, 20000, 40000]) {
      el("line", { x1: X0, x2: X1, y1: Y(v), y2: Y(v), class: "m-rule" }, M);
      text(M, X0 - 5, Y(v) + 3.5, v ? v / 1000 + "k" : "0", "", { "text-anchor": "end" });
    }
    for (const v of [0, 17, 35, 53, 71]) text(M, X(v), H - 6, String(v), "", { "text-anchor": "middle" });
    const path = (a) => a.map((v, j) => (j ? "L" : "M") + X(j).toFixed(1) + " " + Y(v).toFixed(1)).join("");
    el("path", { d: path(cumH), class: "l-hyp" }, M);
    el("path", { d: path(cum), class: "l-ml4" }, M);
    el("line", { x1: X(i), x2: X(i), y1: T, y2: Bt, class: "cur" }, M);
    el("circle", { cx: X(i), cy: Y(cumH[i]), r: 3.2, class: "dot-h" }, M);
    el("circle", { cx: X(i), cy: Y(cum[i]), r: 4, class: "dot" }, M);
    text(M, X1, Y(cumH[N - 1]) - 6, intf(cumH[N - 1]), "", { "text-anchor": "end" });
    text(M, X1, Y(cum[N - 1]) + 15, intf(cum[N - 1]), "", { "text-anchor": "end", style: "fill:var(--blue-text);font-weight:600" });
    M.setAttribute("aria-label", "Cumulative KV bytes per token through layer " + i + ": " + intf(cum[i]) +
      " B for ML4 vs " + intf(cumH[i]) + " B if every layer kept its own KV");
  }

  function select(i, focus) {
    sel = Math.max(0, Math.min(N - 1, i));
    S.querySelectorAll(".hit").forEach((h) => h.setAttribute("tabindex", +h.dataset.i === sel ? "0" : "-1"));
    if (focus) S.querySelector('.hit[data-i="' + sel + '"]').focus();
    overlay(); panel();
  }
  S.addEventListener("keydown", (e) => {
    const k = { ArrowRight: sel + 1, ArrowLeft: sel - 1, ArrowDown: sel + geom.per, ArrowUp: sel - geom.per, Home: 0, End: N - 1 }[e.key];
    if (k == null) return;
    e.preventDefault();
    hov = null;
    select(k, true);
  });

  FILTERS.forEach(([key, lab]) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = lab; b.dataset.k = key;
    b.onclick = () => setFilter(key);
    $("filters").appendChild(b);
  });
  function setFilter(key) {
    filt = key;
    S.dataset.f = key;
    $("filters").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.k === key)));
    $("sum").textContent = FILTERS.find((f) => f[0] === key)[2];
  }

  const leg = [["r-def", "default (RoPE / own indexer / own KV / MoE)"]].concat(TRACKS.map((t) => ["r-" + t.role, t.on]))
    .concat([["r-def", "layer " + kvSrc + ": KV source", "stroke:var(--blue-line);stroke-width:2.2px"]]);
  $("legend").innerHTML = leg.map(([c, s, st]) => '<span><svg viewBox="0 0 14 10" style="width:14px;height:10px"><rect x=".6" y=".6" width="12.8" height="8.8" class="' +
    c + '" style="' + (st || "stroke-width:1.2px") + '"/></svg>' + s + "</span>").join("") +
    '<span><svg viewBox="0 0 26 12"><path d="M1 6H25" stroke="var(--blue-line)" stroke-width="2.2"/></svg>ML4 cumulative bytes</span>' +
    '<span><svg viewBox="0 0 26 12"><path d="M1 6H25" stroke="var(--blue-line)" stroke-width="1.4" stroke-dasharray="4 3"/></svg>if every layer kept its own KV (hypothetical)</span>';
  $("kicker").textContent = "Architecture · params.json " + D.snap;
  $("note").textContent = "From params.json (HF " + D.snap + "): nope, dsa.sharing, kv_sharing.source_layers_str, moe. " +
    "Bytes per token per GPU with fp8_ds_mla: latent " + D.mla_row + " B (512 fp8 + 16 B scales + 64 bf16 RoPE; NoPE layers " +
    "store zero RoPE), indexer " + D.idx_row + " B (128 fp8 + 4 B scale). All " + N + " layers: " + intf(cum[N - 1]) +
    " B vs " + intf(cumH[N - 1]) + " B hypothetical (−" + ((1 - cum[N - 1] / cumH[N - 1]) * 100).toFixed(1) + "%).";

  // ?layer=17&hl=idx for screenshots and deep links
  const q = new URLSearchParams(location.search);
  if (q.has("layer")) sel = Math.max(0, Math.min(N - 1, +q.get("layer") || 0));
  setFilter(FILTERS.some((f) => f[0] === q.get("hl")) ? q.get("hl") : "all");
  draw(); panel();
  addEventListener("resize", () => { if ((S.getBoundingClientRect().width < 520) !== narrow) draw(); });

  // embedding: report the content height to the parent post ('vllm-embed-resize'), as figkit.js does
  (function reportHeight() {
    if (window.self === window.top) return;
    document.documentElement.style.overflow = "hidden";
    let last = 0;
    const report = () => {
      const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
      if (h && h !== last) { last = h; window.parent.postMessage({ type: "vllm-embed-resize", height: h }, "*"); }
    };
    if (window.ResizeObserver) new ResizeObserver(report).observe(document.body);
    addEventListener("load", report);
    addEventListener("resize", report);
    setTimeout(report, 300); setTimeout(report, 1500);
    report();
  })();
})();
</script>
</body>
</html>
