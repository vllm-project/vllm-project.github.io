  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed="true"],
  [aria-selected="true"],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type="file"]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type="color"] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type="date"],
    [type="datetime-local"],
    [type="month"],
    [type="time"],
    [type="week"]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: "";
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget > svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
  const root = document.getElementById('vllm-model-pareto');
  const data = [
    {
      id: 'dsv4', name: 'DeepSeek V4 Pro 1.6T', hardware: 'GB300', color: 'var(--viz-series-1)',
      points: [[38.8,202.7],[46.5,176.6],[58.3,129.9],[65.5,118.5],[77.6,81.5],[89.3,44.0],[101.5,10.9],[126.4,9.4],[136.2,5.9],[158.7,5.3],[186.9,2.9],[198.0,1.1]],
      focus: [38.8,202.7], callout: ['Top cost efficiency','DeepSeek V4 Pro · GB300'], calloutAt: [69,208], narrowCalloutAt: [55,207], anchor: 'start'
    },
    {
      id: 'm3', name: 'MiniMax M3 428B', hardware: 'B300', color: 'var(--viz-series-2)',
      points: [[74.2,111.3],[98.9,75.6],[157.2,55.7],[194.9,36.0],[248.8,27.3],[265.3,14.6],[353.4,8.9],[375.9,4.6]],
      focus: [375.9,4.6], callout: ['Best high-interactivity','MiniMax M3 · B300'], calloutAt: [390,84], narrowCalloutAt: [385,96], anchor: 'end'
    },
    {
      id: 'k3', name: 'Kimi K3 2.8T', hardware: 'GB300', color: 'var(--viz-series-3)',
      points: [[8.2,20.0],[62.7,18.5],[87.9,15.0],[104.4,12.0],[113.8,12.0],[141.8,9.5],[194.2,5.0],[226.2,3.3],[246.3,0.8]],
      focus: [62.7,18.5], callout: ['Large model · High intelligence','Kimi K3 · GB300'], narrowCallout: ['Large model','High intelligence','Kimi K3 · GB300'], calloutAt: [250,95], narrowCalloutAt: [145,145], anchor: 'end', narrowAnchor: 'start', narrowNoConnector: true
    }
  ];
  const visible = new Set(data.map(d => d.id));
  let selectedKey = null;
  const detailShell = root.querySelector('.point-detail-shell');

  function updatePointDetail(series, point, index) {
    const key = `${series.id}:${index}`;
    if (selectedKey === key) {
      selectedKey = null;
      detailShell.hidden = true;
      draw();
      return;
    }
    selectedKey = key;
    detailShell.hidden = false;
    detailShell.style.setProperty('--selected-swatch', series.color);
    detailShell.querySelector('.point-detail-name').textContent = series.name;
    detailShell.querySelector('.point-detail-hardware').textContent = series.hardware;
    detailShell.querySelector('.point-detail-x').textContent = `${point[0].toFixed(1)} tokens/s/user`;
    detailShell.querySelector('.point-detail-y').textContent = `${point[1].toFixed(1)}M tokens/$1 TCO`;
    draw();
  }

  const legend = d3.select(root).select('.legend');
  legend.selectAll('button').data(data).join('button')
    .attr('type','button').attr('aria-pressed','true')
    .html(d => `<span class="swatch" style="--swatch:${d.color}"></span><span>${d.name} · ${d.hardware}</span>`)
    .on('click', function(event,d) {
      if (visible.has(d.id)) visible.delete(d.id); else visible.add(d.id);
      if (!visible.has(d.id) && selectedKey?.startsWith(`${d.id}:`)) {
        selectedKey = null;
        detailShell.hidden = true;
      }
      d3.select(this).attr('aria-pressed', visible.has(d.id) ? 'true' : 'false');
      draw();
    });

  const svg = d3.select(root).select('svg');

  function draw() {
    const width = Math.max(320, root.getBoundingClientRect().width);
    const narrow = width < 520;
    const height = narrow ? 480 : 520;
    const margin = narrow ? {top:24,right:18,bottom:66,left:66} : {top:24,right:28,bottom:64,left:76};
    const innerW = width - margin.left - margin.right;
    const innerH = height - margin.top - margin.bottom;
    svg.attr('viewBox', `0 0 ${width} ${height}`).attr('height', height);
    svg.selectAll('*').remove();
    svg.append('title').attr('id','pareto-title').text('Agentic serving cost efficiency versus interactivity');
    svg.append('desc').attr('id','pareto-desc').text('DeepSeek V4 Pro reaches the highest tokens per dollar, MiniMax M3 reaches the highest P90 interactivity, and Kimi K3 is highlighted as a large intelligence-first model.');
    const g = svg.append('g').attr('transform',`translate(${margin.left},${margin.top})`);
    g.append('rect').attr('class','frame').attr('data-chart-frame','').attr('width',innerW).attr('height',innerH);
    const x = d3.scaleLinear().domain([0,400]).nice().range([0,innerW]);
    const y = d3.scaleLinear().domain([0,220]).nice().range([innerH,0]);
    const xTicks = narrow ? 4 : 6;
    g.append('g').attr('class','grid').attr('transform',`translate(0,${innerH})`).call(d3.axisBottom(x).ticks(xTicks).tickSize(-innerH).tickFormat(''));
    g.append('g').attr('class','grid').call(d3.axisLeft(y).ticks(5).tickSize(-innerW).tickFormat(''));
    g.append('g').attr('class','axis').attr('transform',`translate(0,${innerH})`).call(d3.axisBottom(x).ticks(xTicks));
    g.append('g').attr('class','axis').call(d3.axisLeft(y).ticks(5).tickFormat(d => `${d}M`));
    g.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',innerW/2).attr('y',innerH+48).attr('text-anchor','middle').text('P90 interactivity (tokens/s/user)');
    g.append('text').attr('class','axis-title').attr('data-axis','y').attr('transform','rotate(-90)').attr('x',-innerH/2).attr('y',-55).attr('text-anchor','middle').text('Total tokens per $1 TCO (millions)');

    const line = d3.line().x(d=>x(d[0])).y(d=>y(d[1])).curve(d3.curveMonotoneX);
    const shown = data.filter(d => visible.has(d.id));
    shown.forEach(series => {
      const sg = g.append('g').attr('data-series',series.id);
      sg.append('path').datum(series.points).attr('class','series-line').attr('stroke',series.color).attr('d',line);
      const point = sg.selectAll('g.data-point').data(series.points).join('g').attr('class','data-point');
      point.append('circle').attr('class','series-point').attr('cx',d=>x(d[0])).attr('cy',d=>y(d[1])).attr('r',4.5).attr('fill',series.color);
      point.append('circle').attr('class','click-ring').attr('cx',d=>x(d[0])).attr('cy',d=>y(d[1])).attr('r',9).attr('stroke',series.color)
        .attr('display',(d,i)=>selectedKey===`${series.id}:${i}`?null:'none');
      const pointLabel = d => `${series.name} · ${series.hardware}  |  P90 interactivity: ${d[0].toFixed(1)} tokens/s/user  |  Cost efficiency: ${d[1].toFixed(1)}M total tokens per $1 TCO`;
      point.append('circle').attr('class','point-hit').attr('data-chart-hit','')
        .attr('role','button').attr('data-tooltip',pointLabel).attr('data-tooltip-placement','top').attr('aria-label',pointLabel)
        .attr('aria-pressed',(d,i)=>selectedKey===`${series.id}:${i}`?'true':'false')
        .attr('cx',d=>x(d[0])).attr('cy',d=>y(d[1])).attr('r',narrow?22:18)
        .on('click',(event,d)=>updatePointDetail(series,d,series.points.indexOf(d)))
        .append('title').text(pointLabel);
      sg.append('circle').attr('class','focus-ring').attr('cx',x(series.focus[0])).attr('cy',y(series.focus[1])).attr('r',7).attr('stroke',series.color);
      {
        const calloutAt=narrow ? series.narrowCalloutAt : series.calloutAt;
        const lines=narrow && series.narrowCallout ? series.narrowCallout : series.callout;
        const ax=x(calloutAt[0]), ay=y(calloutAt[1]), fx=x(series.focus[0]), fy=y(series.focus[1]);
        const anchor=narrow && series.narrowAnchor ? series.narrowAnchor : series.anchor;
        const a=sg.append('g').attr('class','annotation');
        const labelNodes=[];
        lines.forEach((label,i) => {
          const emphasized=i===0 || (narrow && series.id==='k3' && i===1);
          const labelNode=a.append('text').attr('x',ax).attr('y',ay+i*17).attr('text-anchor',anchor).attr('class',emphasized?'headline':'detail').text(label).node();
          labelNodes.push(labelNode);
        });
        const widestLabel=d3.max(labelNodes,node=>node.getComputedTextLength());
        const x2=series.id==='k3' && !narrow ? ax-widestLabel-8 : (anchor==='end'?ax+5:ax-5), y2=ay+4;
        if (narrow && series.narrowNoConnector) {
          a.append('circle').attr('cx',anchor==='end'?ax+10:ax-10).attr('cy',ay-5).attr('r',4).attr('fill',series.color);
        } else {
          if (series.id==='k3') {
            a.insert('line','text').attr('class','leader-underlay').attr('x1',fx).attr('y1',fy).attr('x2',x2).attr('y2',y2);
          }
          a.insert('line','text').attr('x1',fx).attr('y1',fy).attr('x2',x2).attr('y2',y2);
        }
      }
    });

  }

  draw();
  new ResizeObserver(draw).observe(root);
})();
</script>

<script src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"></script>
<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =>
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest("[data-tooltip]")
      : null;
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) => {
    lastPointerWasTouch =
      event.type === "pointerdown" && event.pointerType === "touch";
  };
  const handleTouchClick = (event) => {
    const isTouch = event.pointerType === "touch" || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch && activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() => {
      if (activeTrigger === trigger && !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) => {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () => {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerdown", handlePointer);
    document.removeEventListener("pointercancel", handlePointer);
    document.removeEventListener("click", handleTouchClick);
    document.removeEventListener("pointerout", handleLeave);
    document.removeEventListener("focusin", handleFocusIn);
    document.removeEventListener("focusout", handleLeave);
    document.removeEventListener("keydown", handleKeyDown);
    document.removeEventListener("contextmenu", handleContextMenu);
    tooltip = null;
  };

  document.addEventListener("pointerover", handlePointerOpen);
  document.addEventListener("pointerdown", handlePointer);
  document.addEventListener("pointercancel", handlePointer);
  document.addEventListener("click", handleTouchClick);
  document.addEventListener("pointerout", handleLeave);
  document.addEventListener("focusin", handleFocusIn);
  document.addEventListener("focusout", handleLeave);
  document.addEventListener("keydown", handleKeyDown);
  document.addEventListener("contextmenu", handleContextMenu);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-tabs">
(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();
</script>

<script>
(function () {
  // Report content height to the embedding page so the frame can fit without inner scrollbars.
  if (window.self === window.top) return;
  document.documentElement.style.overflow = 'hidden';
  document.documentElement.style.height = 'auto';
  document.body.style.height = 'auto';
  var last = 0;
  function report() {
    var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h && h !== last) {
      last = h;
      window.parent.postMessage({ type: 'vllm-embed-resize', height: h }, '*');
    }
  }
  if (window.ResizeObserver) {
    new ResizeObserver(report).observe(document.body);
  }
  window.addEventListener('load', report);
  window.addEventListener('resize', report);
  setTimeout(report, 300);
  setTimeout(report, 1500);
  report();
})();
</script>
