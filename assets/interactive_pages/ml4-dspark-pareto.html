<script>
(function () {
  "use strict";
  const NS = "http://www.w3.org/2000/svg";
  const D = window.DS, S = document.getElementById("stage"), tip = document.getElementById("tip");
  const $ = (id) => document.getElementById(id);
  const TABS = D.tabs;
  // dark mode swaps each config to its own dark step (validated separately), as figkit does
  const root = document.documentElement.dataset.theme;
  if (root === "dark" || (root !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
    D.configs.forEach((c) => { c.color = c.dark; });
  const CFG = Object.fromEntries(D.configs.map((c) => [c.id, c]));
  const hidden = new Set();
  let cur = 0, narrow = null;

  function el(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs || {}) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function text(parent, x, y, s, cls, attrs) {
    const t = el("text", Object.assign({ x, y, class: cls }, attrs || {}), parent);
    t.textContent = s;
    return t;
  }
  function marker(parent, m, x, y, r, attrs) {
    if (m === "o") return el("circle", Object.assign({ cx: x, cy: y, r }, attrs), parent);
    const k = r * 1.1;
    const d = {
      s: `M${x - k * .85} ${y - k * .85}h${k * 1.7}v${k * 1.7}h${-k * 1.7}z`,
      D: `M${x} ${y - k * 1.15}L${x + k} ${y}L${x} ${y + k * 1.15}L${x - k} ${y}z`,
    }[m];
    return el("path", Object.assign({ d }, attrs), parent);
  }
  function nice(max) {
    const step0 = max / 5, mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 2.5, 5, 10].map((f) => f * mag).find((s) => s >= step0);
    const top = Math.ceil(max / step) * step, ticks = [];
    for (let v = 0; v <= top + 1e-9; v += step) ticks.push(+v.toFixed(6));
    return { max: top, ticks };
  }
  const f1 = (v) => v.toFixed(1), f2 = (v) => v.toFixed(2);
  const intf = (v) => Math.round(v).toLocaleString("en-US");
  const sname = (s) => CFG[s.cfg].name + " · " + (s.spec ? "DSpark" : "no spec");

  function swatchSvg(color, m, spec) {
    const s = document.createElementNS(NS, "svg");
    s.setAttribute("viewBox", "0 0 26 12");
    el("line", { x1: 1, x2: 25, y1: 6, y2: 6, class: "s-line" + (spec ? "" : " s-base"), style: "stroke:" + color }, s);
    marker(s, m, 13, 6, spec ? 4 : 3.4, spec ? { class: "s-dot", style: "fill:" + color }
      : { class: "s-hollow", style: "stroke:" + color });
    s.setAttribute("width", 26); s.setAttribute("height", 12);
    return s.outerHTML;
  }

  function show(s, r, cx, cy) {
    const c = CFG[s.cfg];
    const rows = [
      ["Concurrency", String(r.c)],
      ["Interactivity", f1(r.user) + " tok/s/user"],
      ["Throughput", f1(r.gpu) + " tok/s/GPU"],
      ["TPOT p50", f2(r.tpot) + " ms"],
      ["TTFT p50", f2(r.ttft) + " s"],
      ["AL", r.al == null ? "–" : f2(r.al)],
      ["Requests", intf(r.n)],
    ];
    tip.innerHTML = '<div class="tip-k">' + swatchSvg(c.color, c.marker, s.spec) + sname(s) + "</div>" +
      rows.map((k) => '<div class="tip-row">' + k[0] + "<b>" + k[1] + "</b></div>").join("");
    tip.classList.add("show");
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let left = cx + 14, top = cy - h - 12;
    if (left + w > innerWidth - 8) left = cx - w - 14;
    if (top < 8) top = cy + 14;
    tip.style.left = Math.max(8, left) + "px";
    tip.style.top = top + "px";
  }
  function hide() { tip.classList.remove("show"); S.querySelectorAll(".ring").forEach((n) => n.remove()); }

  function draw() {
    S.replaceChildren();
    narrow = S.getBoundingClientRect().width < 520;
    const W = narrow ? 420 : 736, H = narrow ? 360 : 380;
    S.setAttribute("viewBox", "0 0 " + W + " " + H);
    const T0 = TABS[cur], all = T0.series.flatMap((s) => s.pts);
    const xs = nice(Math.max(...all.map((r) => r.user)) * 1.06);
    const ys = nice(Math.max(...all.map((r) => r.gpu)) * 1.06);
    const X0 = narrow ? 44 : 52, X1 = W - 12, T = 22, B = H - 46;
    const X = (v) => X0 + v / xs.max * (X1 - X0), Y = (v) => B - v / ys.max * (B - T);
    S.setAttribute("aria-label", "Output tok/s per GPU vs tok/s per user, " + T0.label +
      ", with and without DSpark for " + [...new Set(T0.series.map((s) => CFG[s.cfg].name))].join(" and ") + ".");

    for (const v of ys.ticks) {
      el("line", { x1: X0, x2: X1, y1: Y(v), y2: Y(v), class: "m-rule" }, S);
      text(S, X0 - 8, Y(v) + 4.5, String(v), "t-faint", { "text-anchor": "end" });
    }
    text(S, X0 - 8, T - 10, "out tok/s/GPU", "t-mut", { "text-anchor": "start", x: 0 });
    for (const v of narrow ? xs.ticks.filter((_, i) => i % 2 === 0) : xs.ticks) {
      el("line", { x1: X(v), x2: X(v), y1: B, y2: B + 5, class: "m-line" }, S);
      text(S, X(v), B + 20, String(v), "t-faint", { "text-anchor": "middle" });
    }
    text(S, X1, B + 38, "tok/s per user (1000 / TPOT p50)", "t-mut", { "text-anchor": "end" });

    const hits = [];
    // no-spec first, so the DSpark curves sit on top
    for (const s of [...T0.series].sort((a, b) => a.spec - b.spec)) {
      const c = CFG[s.cfg], off = hidden.has(s.cfg);
      const g = el("g", { class: "series" + (off ? " off" : ""), "data-cfg": s.cfg, "data-spec": s.spec }, S);
      const d = s.pts.map((r, i) => (i ? "L" : "M") + X(r.user).toFixed(1) + " " + Y(r.gpu).toFixed(1)).join("");
      el("path", { d, class: "s-line" + (s.spec ? "" : " s-base"), stroke: c.color }, g);
      for (const r of s.pts) {
        marker(g, c.marker, X(r.user), Y(r.gpu), s.spec ? 4.2 : 3.6,
          s.spec ? { class: "s-dot", fill: c.color } : { class: "s-hollow", stroke: c.color });
        if (D.label_c.includes(r.c) && !narrow)
          text(g, X(r.user) + (s.spec ? 7 : -7), Y(r.gpu) + (s.spec ? -7 : 14), "c" + r.c, "t-clab",
            { "text-anchor": s.spec ? "start" : "end" });
        if (!off) hits.push([s, r]);
      }
    }
    for (const [s, r] of hits) {
      const hit = el("circle", { cx: X(r.user), cy: Y(r.gpu), r: 9, class: "hit", tabindex: "0", role: "img",
        "aria-label": sname(s) + ", concurrency " + r.c + ": " + f1(r.gpu) + " tok/s/GPU at " + f1(r.user) +
          " tok/s/user, TPOT " + f2(r.tpot) + " ms" }, S);
      const on = (cx, cy) => { hide(); el("circle", { cx: X(r.user), cy: Y(r.gpu), r: 8, class: "ring" }, S); show(s, r, cx, cy); };
      hit.addEventListener("mouseenter", (e) => on(e.clientX, e.clientY));
      hit.addEventListener("mousemove", (e) => show(s, r, e.clientX, e.clientY));
      hit.addEventListener("focus", () => { const b = hit.getBoundingClientRect(); on(b.left + b.width / 2, b.top); });
      hit.addEventListener("mouseleave", hide);
      hit.addEventListener("blur", hide);
    }
    if (!hits.length) text(S, (X0 + X1) / 2, (T + B) / 2, "All configurations hidden", "t-mut", { "text-anchor": "middle" });
  }

  function legend() {
    const L = $("legend");
    L.innerHTML = "";
    const ids = [...new Set(TABS[cur].series.map((s) => s.cfg))];
    for (const id of ids) {
      const c = CFG[id], b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-pressed", String(!hidden.has(id)));
      b.innerHTML = swatchSvg(c.color, c.marker, true) + c.name;
      b.onclick = () => {
        hidden.has(id) ? hidden.delete(id) : hidden.add(id);
        b.setAttribute("aria-pressed", String(!hidden.has(id)));
        hide(); draw();
      };
      L.appendChild(b);
    }
    for (const spec of [true, false]) {
      if (!TABS[cur].series.some((s) => s.spec === spec)) continue;
      const q = document.createElement("span");
      q.innerHTML = swatchSvg("var(--muted)", "o", spec) + (spec ? "DSpark" : "no spec");
      L.appendChild(q);
    }
  }

  const tabs = TABS.map((t, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.id = "tab-" + t.key; b.textContent = t.label;
    b.setAttribute("role", "tab"); b.setAttribute("aria-controls", "panel");
    b.onclick = () => select(i);
    $("tabs").appendChild(b);
    return b;
  });
  $("tabs").addEventListener("keydown", (e) => {
    const n = TABS.length, k = { ArrowRight: cur + 1, ArrowLeft: cur - 1, Home: 0, End: n - 1 }[e.key];
    if (k == null) return;
    e.preventDefault();
    select((k + n) % n, true);
  });
  function select(k, focus) {
    cur = k;
    tabs.forEach((b, j) => { b.setAttribute("aria-selected", j === k); b.tabIndex = j === k ? 0 : -1; });
    if (focus) tabs[k].focus();
    $("sub").textContent = TABS[k].sub + ". Up and right is better.";
    $("note").textContent = TABS[k].note;
    $("panel").setAttribute("aria-labelledby", tabs[k].id);
    hide(); legend(); draw();
  }

  // ?tab=32k opens a given tab, for screenshots and deep links
  const m = /[?&]tab=(\w+)/.exec(location.search);
  const keys = TABS.map((t) => t.key);
  select(Math.max(0, keys.indexOf(m ? m[1] : D.default)));
  addEventListener("resize", () => { if ((S.getBoundingClientRect().width < 520) !== narrow) draw(); });
  addEventListener("scroll", hide, { passive: true });

  // embedding: report the content height to the parent post ('vllm-embed-resize'), as figkit.js does
  (function reportHeight() {
    if (window.self === window.top) return;
    document.documentElement.style.overflow = "hidden";
    let last = 0;
    const report = () => {
      const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
      if (h && h !== last) { last = h; window.parent.postMessage({ type: "vllm-embed-resize", height: h }, "*"); }
    };
    if (window.ResizeObserver) new ResizeObserver(report).observe(document.body);
    addEventListener("load", report);
    addEventListener("resize", report);
    setTimeout(report, 300); setTimeout(report, 1500);
    report();
  })();
})();
</script>
</body>
</html>
