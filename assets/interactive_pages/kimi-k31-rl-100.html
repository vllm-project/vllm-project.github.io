/* ── figkit tokens (Inferact blog-figures kit) ───────────────────────── */
:root {
  color-scheme: light;
  --font: Inter, -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bg: #ffffff; --ink: #23201e; --muted: #605b56; --faint: #8e8881; --rule: #e6e1da;
  --s-a: #2a78d6; --s-b: #eb6834; --s-c: #1baf7a;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #18181a; --ink: #f1eeea; --muted: #b3ada6; --faint: #8a847d; --rule: #34312e;
    --s-a: #3987e5; --s-b: #d95926; --s-c: #199e70;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #18181a; --ink: #f1eeea; --muted: #b3ada6; --faint: #8a847d; --rule: #34312e;
  --s-a: #3987e5; --s-b: #d95926; --s-c: #199e70;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 400 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
.page { padding: 28px 16px 32px; }
.fig { max-width: 760px; margin: 0 auto; }
.fig-kicker { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.fig-title { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.3; margin: 0 0 18px; text-wrap: balance; }
.panel + .panel { margin-top: 18px; }
.p-title { font: 500 11.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
svg { width: 100%; display: block; overflow: visible; }
svg text { font-family: var(--font); }
.grid { stroke: var(--rule); stroke-width: 1; }
.axis { font: 500 11px var(--mono); fill: var(--faint); }
.note { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
.c-zero { fill: var(--s-c); }
.c-dot { fill: var(--s-a); opacity: .4; }
.l-a { fill: none; stroke: var(--s-a); stroke-width: 2; }
.l-b { fill: none; stroke: var(--s-b); stroke-width: 2; }
.c-b { fill: var(--s-b); }
.fig-note { font: 400 12px/1.45 var(--mono); color: var(--muted); margin: 12px 0 0; }
</style>
</head>
