<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A hybrid model resumes only at a checkpoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one reading column of six figures. Each figure: where it goes in the post, a claim, a one-line cue, the stage, a narration line, controls, the source line. Below 674px wide every stage is redrawn for a 360-wide viewBox (stacked boxes, labels above bars). */
:root{
  --bg:#FFFFFF; --surface:#F7F6F2; --ink:#1A1A1A; --sub:#5F5F5F; --muted:#8A8A84; --line:#DEDCD4;
  --gpu:#F1F0EB; --gpu-line:#BDBDB5; --pool:#EEF1F5; --pool-line:#8D9AAD;
  --dram:#C2453A; --nvme:#2E7CD6; --focus:#1F8A7A; --focus-soft:#D9EFEA;
  --lost:#B9770E; --compute:#2E2E2A; --block:#D3D1C8; --block-line:#B5B3A9;
  --on-accent:#FFFFFF; --on-block:#3A3A36; --queue:#ECEBE5; --stale:#F3F2EE;
  --font:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --step--1:.8125rem; --step-0:1rem; --step-1:1.1875rem; --step-2:1.625rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151514; --surface:#1D1D1B; --ink:#ECEBE6; --sub:#B3B2AB; --muted:#8E8D86; --line:#383733;
    --gpu:#232320; --gpu-line:#4C4B46; --pool:#1E242C; --pool-line:#6A7B93;
    --dram:#E06B5F; --nvme:#5B9DEA; --focus:#3DB5A2; --focus-soft:#17332F;
    --lost:#E2A33A; --compute:#DAD9D2; --block:#4A4944; --block-line:#5E5D57;
    --on-accent:#0E1413; --on-block:#E6E5DF; --queue:#2A2A27; --stale:#1F1F1D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151514; --surface:#1D1D1B; --ink:#ECEBE6; --sub:#B3B2AB; --muted:#8E8D86; --line:#383733;
  --gpu:#232320; --gpu-line:#4C4B46; --pool:#1E242C; --pool-line:#6A7B93;
  --dram:#E06B5F; --nvme:#5B9DEA; --focus:#3DB5A2; --focus-soft:#17332F;
  --lost:#E2A33A; --compute:#DAD9D2; --block:#4A4944; --block-line:#5E5D57;
  --on-accent:#0E1413; --on-block:#E6E5DF; --queue:#2A2A27; --stale:#1F1F1D;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--step-0);line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:32px 64px}
.wrap{max-width:860px;margin:0 auto;display:grid;gap:40px}
header{display:grid;gap:10px;max-width:68ch}
h1{font-size:var(--step-2);line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:var(--step-1);line-height:1.3;margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
.lede{color:var(--sub)}
.eyebrow{font-size:var(--step--1);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
figure{margin:0;border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:12px;background:var(--bg);min-width:0}
.cue{color:var(--sub);max-width:70ch}
.stage{border-radius:6px;background:var(--bg);min-width:0}
.stage svg{display:block;width:100%;height:auto;margin:0 auto}
.stage svg.narrow{max-width:440px}
.say{font-weight:500;line-height:1.5;min-height:3em;max-width:70ch;font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-width:72ch}
.steps button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;width:100%;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font:400 var(--step-0)/1.45 var(--font)}
.steps button:hover{background:var(--surface)}
.steps button.done{color:var(--sub)}
.steps button[aria-current="step"]{background:var(--surface);color:var(--ink)}
.steps .n{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);font:600 12px/1 var(--font);color:var(--sub)}
.steps button[aria-current="step"] .n{background:var(--focus);border-color:var(--focus);color:var(--on-accent)}
.steps button:focus-visible{outline:2px solid var(--nvme);outline-offset:2px}
.controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
button{font:500 var(--step--1)/1 var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--nvme);outline-offset:2px}
.seg{display:inline-flex;gap:0}
.seg button{border-radius:0}
.seg button:first-child{border-radius:6px 0 0 6px}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg button+button{border-left:0}
.seg button[aria-pressed="true"],.levels button[aria-current="step"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scrub{flex:1 1 160px;min-width:120px;accent-color:var(--ink)}
figcaption{font-size:var(--step--1);color:var(--sub);display:grid;gap:6px;max-width:80ch}
figcaption b{color:var(--ink);font-weight:600}
.static{border-top:1px solid var(--line);padding-top:24px;display:grid;gap:10px;max-width:72ch}
.static ul{margin:0;padding-left:1.2em;display:grid;gap:6px;color:var(--sub)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px;background:var(--surface)}
.tile .k{font-size:var(--step--1);color:var(--sub)}
.tile .v{font-size:var(--step-1);font-weight:600;font-variant-numeric:tabular-nums}
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 20px}
.sliders label{display:grid;gap:4px;font-size:var(--step--1);color:var(--sub)}
.sliders output{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.sliders input{accent-color:var(--ink);width:100%}
@media (max-width:520px){ figure{padding:14px} .say{min-height:4.5em} .tiles{grid-template-columns:1fr 1fr} }
/* SVG text and shapes */
.sv-h{font:600 13.5px var(--font);fill:var(--ink)}
.sv-l{font:400 12.5px var(--font);fill:var(--sub)}
.sv-s{font:400 11px var(--font);fill:var(--muted)}
.sv-n{font:600 13px var(--font);fill:var(--ink);font-variant-numeric:tabular-nums}
.sv-b{font:600 11.5px var(--font)}
.sv-pop{font:600 12.5px var(--font);fill:var(--bg)}
.sv-pop-s{font:600 11.5px var(--font);fill:var(--bg)}
.sv-big{font:700 26px var(--font);fill:var(--ink);font-variant-numeric:tabular-nums}
.sv-big-s{font:700 18px var(--font);fill:var(--ink);font-variant-numeric:tabular-nums}
.sv-res{font:600 13.5px var(--font);fill:var(--ink)}
.box-gpu{fill:var(--gpu);stroke:var(--gpu-line)}
.box-pool{fill:var(--pool);stroke:var(--pool-line)}
.slot{fill:none;stroke:var(--line);stroke-dasharray:3 3}
.axis{stroke:var(--line)}
.tick{stroke:var(--line)}

/* Embedded in a vLLM blog post: no page gutters; the figure card is the whole page. */
body{padding:0;margin:0}
.wrap{max-width:none;gap:0;padding:1px}
</style>
</head>
<body>
<div class="wrap">
  <figure id="ckpt" aria-labelledby="ckpt-h">
    <h2 id="ckpt-h">A hybrid model resumes only at a checkpoint, so more checkpoints mean less recompute</h2>
    <p class="cue">The same two prompts with two checkpoint settings, side by side. Click or tap a step to jump to it.</p>
    <ol class="steps" aria-label="Steps">
      <li><button type="button"><span class="n">1</span><span class="tx">The new turn starts with the same 30,000 tokens as an earlier prompt, then adds 4,000 new ones.</span></button></li>
      <li><button type="button"><span class="n">2</span><span class="tx">Kimi-K3's KDA layers keep a running state instead of per-token KV. vLLM can resume only where it saved that state, at a checkpoint, so it resumes from the last checkpoint before 30,000.</span></button></li>
      <li><button type="button" aria-current="step"><span class="n">3</span><span class="tx">From there, prefill recomputes up to the end of the new turn: 22,000 tokens with checkpoints only at prompt ends, 5,328 with one every 7,168 tokens.</span></button></li>
    </ol>
    <div class="stage"><svg role="img" aria-label="Animation, two checkpoint settings side by side. A new turn shares its first 30,000 tokens with an earlier prompt and adds 4,000 new tokens. With checkpoints only at prompt ends, the last checkpoint before 30,000 is at 12,000, so prefill recomputes 22,000 tokens, 18,000 of them again. With a checkpoint every 7,168 tokens, it resumes at 28,672 and recomputes 5,328 tokens, 1,328 of them again."></svg></div>
    <div class="controls">
      <button class="play" type="button" id="ckpt-play">Play</button>
      <button class="replay" type="button" id="ckpt-replay">Replay</button>
      <input class="scrub" type="range" min="0" max="1000" value="1000" id="ckpt-scrub" aria-label="Animation time">
    </div>
    <figcaption>
      <span>Both sweeps run at one speed, so a longer sweep means more recompute. In each sweep, the teal part is the new tokens, which prefill computes either way; the rest is tokens computed again. Every checkpoint is also one more write to the pool.</span>
      <span><b>Measured:</b> Kimi-K3 on the kvlab corpus at 8 sessions with a DRAM pool. A checkpoint every 7,168 tokens raised the KV cache hit rate from 91.4% to 95.6% and throughput 33%.</span>
    </figcaption>
  </figure>
</div>
<script>
(() => {
"use strict";
const NS = "http://www.w3.org/2000/svg";
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const narrowMQ = window.matchMedia("(max-width: 673px)");
const S = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (parent) parent.appendChild(e); return e; };

const lerp = (a, b, p) => a + (b - a) * p;
const fmt = n => n.toLocaleString("en-US");

/* A block: rounded square with a label. */
function block(parent, w = 40, label = "") {
  const g = S("g", {}, parent);
  const r = S("rect", { width: w, height: w, rx: w > 36 ? 6 : 5 }, g);
  const t = T(g, w / 2, w / 2 + 4, label, "sv-b", "middle");
  return { g, r, t, set(x, y, fill, stroke, textFill, op = 1, lab) {
    g.setAttribute("transform", `translate(${x},${y})`); g.style.opacity = op;
    r.style.fill = fill; r.style.stroke = stroke || "none"; r.style.strokeWidth = stroke ? 1.5 : 0;
    t.style.fill = textFill; if (lab !== undefined) t.textContent = lab; } };
}

/* Player: time-based rendering, play/pause/replay, scrubber, modes. build(svg, layout) draws the scene and returns render(t, mode) -> narration. */
const players = new Map();
class Player {
  constructor(fig, { mode, duration, speed = 1, build }) {
    this.fig = fig; this.mode = mode; this.build = build; this.seen = false; this.playing = false; this.t = 0;
    this.clock = 0; this.raf = 0; this.last = null; this.holdAt = null; this.visible = true; this.resume = false;
    this.durationFn = typeof duration === "function" ? duration : () => duration;
    this.speedFn = typeof speed === "function" ? speed : () => speed;
    this.svg = fig.querySelector(".stage svg"); this.say = fig.querySelector(".say");
    this.playBtn = fig.querySelector(".play"); this.replayBtn = fig.querySelector(".replay"); this.scrub = fig.querySelector(".scrub");
    this.playBtn.addEventListener("click", () => { this.seen = true; if (this.playing && !this.held()) this.pause(); else { this.holdAt = null; this.play(); } });
    this.replayBtn.addEventListener("click", () => { this.seen = true; this.holdAt = null; this.setT(0); this.play(); });
    if (this.scrub) this.scrub.addEventListener("input", () => { this.seen = true; this.holdAt = null; this.pause(); this.setT(this.scrub.value / 1000 * this.dur()); });
    fig.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => { this.seen = true; this.setMode(b.dataset.mode); }));
    // A held, live figure stops drawing while it is off screen and picks up again when it comes back.
    if ("IntersectionObserver" in window) new IntersectionObserver(es => es.forEach(e => {
      this.visible = e.isIntersecting; if (this.visible && this.resume) { this.resume = false; this.play(); } })).observe(this.svg.parentElement);

  }
  held() { return this.holdAt != null && this.t >= this.holdAt - 1e-6; }

  relayout() { this.layout(); this.setT(this.t); }
  dur() { return this.durationFn(this.mode); }

  setT(t) { this.t = clamp(t, 0, this.dur()); const say = this.render(this.t, this.mode, this.clock); if (this.say) this.say.textContent = say || "";
    if (this.scrub) this.scrub.value = Math.round(this.t / this.dur() * 1000); this.label(); }

  play() { if (this.holdAt == null && this.t >= this.dur() - 1e-6) this.setT(0); cancelAnimationFrame(this.raf);
    this.playing = true; this.last = null; this.label(); this.raf = requestAnimationFrame(n => this.tick(n)); }
  pause() { this.playing = false; cancelAnimationFrame(this.raf); this.label(); }
  tick(now) {
    if (!this.playing) return;
    if (this.last == null) this.last = now;
    const dt = clamp((now - this.last) / 1000, 0, .1); this.last = now; this.clock += dt;
    let nt = this.t + dt * this.speedFn(this.mode);
    if (this.holdAt != null) nt = Math.min(nt, this.holdAt);
    this.setT(nt);
    if (this.holdAt == null && this.t >= this.dur()) { this.pause(); return; }
    if (this.held() && !this.visible) { this.resume = true; this.pause(); return; }
    this.raf = requestAnimationFrame(n => this.tick(n));
  }
  setMode(m) { if (m === this.mode) return; this.mode = m; this.syncModes(); this.pause();
    if (reduced) this.setT(this.dur()); else { this.setT(0); this.play(); } }
  syncModes() { this.fig.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === this.mode))); }
}

/* Steps list above a stage: highlight the step for time t; clicking a step jumps there (or shows its end frame under reduced motion). */
function stepper(fig, starts) {
  const btns = fig ? [...fig.querySelectorAll(".steps button")] : []; let last = -1;
  return t => { let si = 0; starts.forEach((s0, i) => { if (t >= s0) si = i; });
    if (si !== last) { last = si; btns.forEach((b, i) => { b.classList.toggle("done", i < si); if (i === si) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); }); } };
}
function wireSteps(player, starts, shows) {
  player.fig.querySelectorAll(".steps button").forEach((b, i) => b.addEventListener("click", () => {
    player.seen = true; player.pause();
    if (reduced) player.setT(shows[i]); else { player.setT(starts[i]); player.play(); } }));
}

/* Shared: popup fade window and popup bubble. */
const win = (t, a, b, f = .2) => Math.min(prog(t, a, a + f), b >= 1e8 ? 1 : 1 - prog(t, b - f, b));
/* A popup: dark bubble with a leader line to a dot on its target. */
function popup(parent, small) {
  const H = small ? 24 : 28, PADX = small ? 8 : 11, BASE = small ? 16 : 18.5;
  const g = S("g", {}, parent);
  const line = S("line", { "stroke-width": 1.5 }, g); line.style.stroke = "var(--ink)";
  const dot = S("circle", { r: small ? 3 : 3.5 }, g); dot.style.fill = "var(--ink)";
  const box = S("rect", { height: H, rx: 7 }, g); box.style.fill = "var(--ink)";
  const txt = T(g, 0, 0, "", small ? "sv-pop-s" : "sv-pop");
  return { set(text, tg, op) {
    g.style.opacity = op; if (op <= 0) return;
    txt.textContent = text;
    const w = textW(txt) + 2 * PADX, x0 = clamp(tg.bx - w / 2, tg.minX, tg.maxX - w);

    txt.setAttribute("x", x0 + PADX); txt.setAttribute("y", tg.by + BASE);
    const lead = tg.tx != null; line.style.opacity = lead ? 1 : 0; dot.style.opacity = lead ? 1 : 0;
    if (lead) { const side = tg.tx < x0 || tg.tx > x0 + w;
      const lx = side ? (tg.tx < x0 ? x0 : x0 + w) : clamp(tg.tx, x0 + 12, x0 + w - 12), ly = side ? clamp(tg.ty, tg.by + 4, tg.by + H - 4) : tg.ty < tg.by ? tg.by : tg.by + H;
      line.setAttribute("x1", tg.tx); line.setAttribute("y1", tg.ty); line.setAttribute("x2", lx); line.setAttribute("y2", ly);
      dot.setAttribute("cx", tg.tx); dot.setAttribute("cy", tg.ty); }
    g.setAttribute("transform", `translate(0,${((1 - op) * 4).toFixed(2)})`); } };
}

/* ---------- 1. How heavy agentic serving is: three servers as agents pile on ---------- */
const SC_LEVELS = [8, 16, 32, 70], SC_STARTS = [0, 2.6, 5.2, 7.8], SC_END = 11.8, SC_HOLD = [1.6, 4.3, 6.8, 11.8];
/* kvlab corpus, Kimi-K3, 1P1D on 16 MI355X. Per load: [tok/s per GPU, % of prompt tokens from GPU memory, % loaded from the pool, % recomputed, median TTFT in s] */
const SC_DATA = [
  { name: ["GPU memory only", "GPU only"], pool: 0, pc: null, cap: ["0.5 TB of KV space", "0.5 TB"],
    d: [[6261, 94.7, 0, 5.3, 1.8], [8255, 93.0, 0, 7.0, 5.5], [7210, 90.1, 0, 9.9, 47.2], [1062, 6, 0, 94, null]] },
  { name: ["+ 1.0 TB DRAM pool", "+1 TB DRAM"], pool: 1.0, pc: "var(--dram)", cap: ["1.5 TB of KV space", "1.5 TB"],
    d: [[6681, 94.8, 1.2, 4.0, 1.5], [9274, 92.9, 2.0, 5.1, 2.8], [9077, 89.1, 3.5, 7.4, 34.4], [1725, 29.8, 22.4, 47.8, 742.8]] },
  { name: ["+ 4.6 TB NVMe pool", "+4.6 TB NVMe"], pool: 4.6, pc: "var(--nvme)", cap: ["5.1 TB of KV space", "5.1 TB"],
    d: [[6608, 94.8, 1.0, 4.2, 1.5], [9466, 92.7, 2.3, 5.0, 2.9], [10928, 88.7, 5.4, 5.9, 25.0], [8813, 75.2, 17.5, 7.3, 90.7]] } ];
const SC_POP = [
  { a: .15, b: 2.5, col: 0, at: "grid", text: ["8 agents: one square each", "8 agents"] },
  { a: 3.3, b: 5.1, col: 0, at: "grid", text: ["16 agents on each server", "16 agents"] },
  { a: 5.9, b: 7.75, col: 0, at: "grid", text: ["32 agents: GPU memory still keeps up", "32 agents"] },
  { a: 8.5, b: 9.25, col: 0, at: "full", text: ["70 agents on each server", "70 agents"] },
  { a: 9.25, b: 1e9, col: 0, at: "below", text: ["About 94% recomputed", "94% recomputed"] },
  { a: 8.8, b: 1e9, col: 1, at: "below", text: ["First token after 12 minutes", "12 min wait"] },
  { a: 9.1, b: 1e9, col: 2, at: "below", text: ["5.1× the DRAM pool", "5.1× DRAM"] } ];
const hash2 = (a, b) => { let h = (Math.imul(a + 1, 374761393) + Math.imul(b + 7, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
function buildScale(svg, L) {
  const n = L.narrow, fig = L.fig;
  setView(svg, L, [720, 572], [360, 556]);
  // one MI355X: where its 288 GB goes
  const HX = n ? 12 : 20, HW = n ? 336 : 680, HY = n ? 26 : 30, HH = n ? 24 : 28;
  T(svg, HX, n ? 18 : 20, "One MI355X: 288 GB of HBM3E", "sv-h");
  let hx = HX;
  [[187.4, "var(--block)", n ? "weights 187 GiB" : "Kimi-K3 weights 187 GiB", "var(--on-block)"], [61.5, "var(--focus)", "KV 61 GiB", "var(--on-accent)"], [39.1, "var(--queue)", "other", "var(--sub)"]]
    .forEach(([gib, fill, lab, tf]) => { const w = gib / 288 * HW; const r = S("rect", { x: hx, y: HY, width: w - 2, height: HH, rx: 4 }, svg); r.style.fill = fill;

function extraMiss(ts) { // share of prompt tokens, compared with a pool that never evicts
  const { TS, kept, R } = RET;
  if (ts <= TS[0]) return R * (1 - kept[0]); if (ts >= TS[TS.length - 1]) return R * (1 - kept[kept.length - 1]);
  for (let i = 0; i < TS.length - 1; i++) if (ts <= TS[i + 1]) { const f = (Math.log(ts) - Math.log(TS[i])) / (Math.log(TS[i + 1]) - Math.log(TS[i])); return R * (1 - (kept[i] + f * (kept[i + 1] - kept[i]))); }
}

  [[1, "1 min"], [10, "10 min"], [60, "1 h"], [360, "6 h"], [1440, "24 h"]].forEach(([mm, lab]) => { S("line", { x1: lx(mm), x2: lx(mm), y1: Y0 + YH, y2: Y0 + YH + 5, class: "tick" }, svg); T(svg, lx(mm), Y0 + YH + 20, lab, "sv-s", "middle"); });
  S("line", { x1: X0, x2: X0 + XW, y1: Y0 + YH, y2: Y0 + YH, class: "axis" }, svg);
  T(svg, X0 + XW, Y0 + YH + 40, "how long the pool keeps KV", "sv-s", "end");
  T(svg, X0, 14, "extra prompt tokens that miss", "sv-s");
  let d = ""; RET.TS.forEach(ts => { const mm = ts / 60; if (mm < 1 || mm > 2880) return; d += `${d ? "L" : "M"}${lx(mm).toFixed(1)},${ly(extraMiss(ts) * 100).toFixed(1)}`; });
  const curve = S("path", { d, fill: "none", "stroke-width": 2 }, svg); curve.style.stroke = "var(--ink)";
  const vline = S("line", { y1: Y0, y2: Y0 + YH, "stroke-width": 1.5 }, svg); vline.style.stroke = "var(--nvme)";
  const dotM = S("circle", { r: 6 }, svg); dotM.style.fill = "var(--nvme)"; dotM.style.stroke = "var(--bg)"; dotM.style.strokeWidth = 2;
  const mLab = T(svg, 0, 0, "", "sv-n");
  const hover = S("g", {}, svg); const hl = S("line", { y1: Y0, y2: Y0 + YH, stroke: "var(--muted)", "stroke-dasharray": "3 3" }, hover); const ht = T(hover, 0, Y0 + 12, "", "sv-s"); hover.style.opacity = 0;
  const w = fig.querySelector("#ret-w"), c = fig.querySelector("#ret-c");
  const capOf = v => .5 * Math.pow(400, v / 1000);

(function reportHeight() {
  if (window.self === window.top) return;
  document.documentElement.style.overflow = "hidden";
  var last = 0;
  var report = function () {
    var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h && h !== last) { last = h; window.parent.postMessage({ type: "vllm-embed-resize", height: h }, "*"); }
  };
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.body);
  window.addEventListener("load", report);
